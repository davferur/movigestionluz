const PASOS = [
  "Paquete pendiente",
  "Trámite listo para agendar",
  "Trámite en agendamiento",
  "Documentación lista para entregar",
];
const ESTADOS = [...PASOS, "Entregado", "Cancelado"];

const TIPOS_TRAMITE = [
  "Traspaso","Duplicado","Cambio de empresa","Refrendación de licencia","Pago de impuestos",
  "Certificado de tradición","Improntas","Asesoría","Pago de comparendos",
  "Inscripción RUNT","Modificación RUNT","Trámite servicio público","Otro"
];

const CONCEPTOS_BASE = ["Derechos de tránsito","Honorarios","Retención","Papelería","Improntas","Impuestos","Multas","Mensajería"];
const HON_IMPUESTOS = "Honorarios de impuestos";
const VALOR_HON_IMPUESTOS = 15000;

/* tarifas fijas */
const TARIFA_GENERAL = { "Papelería": 15000 };
const TARIFA_IBAGUE = { "Honorarios": 100000, "Derechos de tránsito": 306000 };
const esIbague = (c) => String(c||"").trim().toLowerCase().startsWith("ibagu");

const conceptosIniciales = (ciudad) => {
  const t = { ...TARIFA_GENERAL, ...(esIbague(ciudad) ? TARIFA_IBAGUE : {}) };
  return CONCEPTOS_BASE.map((d) => ({ cant:1, desc:d, valor: t[d] ? String(t[d]) : "" }));
};

/* aplica tarifas al cambiar de ciudad, sin borrar lo que el asesor ya escribió a mano */
const aplicarCiudad = (conceptos, ciudad) => {
  const ib = esIbague(ciudad);
  return conceptos.map((x) => {
    if (!(x.desc in TARIFA_IBAGUE)) return x;
    const tarifa = String(TARIFA_IBAGUE[x.desc]);
    if (ib) return (!x.valor || x.valor === "0") ? { ...x, valor: tarifa } : x;
    return x.valor === tarifa ? { ...x, valor: "" } : x;
  });
};

/* si hay impuestos, agrega automáticamente los honorarios de impuestos */
const normalizarConceptos = (conceptos) => {
  const hayImpuesto = conceptos.some((x) => x.desc === "Impuestos" && Number(x.valor) > 0);
  const sinHon = conceptos.filter((x) => x.desc !== HON_IMPUESTOS);
  if (!hayImpuesto) return sinHon;
  const i = sinHon.findIndex((x) => x.desc === "Impuestos");
  const fila = { cant:1, desc: HON_IMPUESTOS, valor: String(VALOR_HON_IMPUESTOS), fijo: true };
  return [...sinHon.slice(0, i+1), fila, ...sinHon.slice(i+1)];
};

const fmt = (n) => "$" + (Number(n) || 0).toLocaleString("es-CO");
/* separador de miles mientras se escribe */
const miles = (v) => { const d = String(v ?? "").replace(/\D/g, "").replace(/^0+(?=\d)/, ""); return d ? Number(d).toLocaleString("es-CO") : ""; };
const soloNum = (v) => String(v ?? "").replace(/\D/g, "");
const hoy = () => new Date().toISOString().slice(0, 10);
const ahora = () => new Date().toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" });
const genCodigo = () => Array.from({length:6},()=> "ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)]).join("");
const esc = (s) => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

const cotVacia = () => ({
  id: Date.now(), numero: "", codigo: genCodigo(), fecha: hoy(), vence: "", asesor: "", ciudad: "Ibagué",
  cliente: { nombre:"", tipoDoc:"CC", doc:"", tel:"", dir:"", obs:"" },
  vehiculo: { placa:"", marca:"", linea:"", modelo:"", tipo:"Automóvil", servicio:"Particular", ciudadMat:"", licencia:"" },
  tramite: { tipo:"Traspaso", desc:"", fechaEstimada:"", requisitos:"", docsEntregados:"", docsPendientes:"" },
  conceptos: conceptosIniciales("Ibagué"),
  descuento: "", abonoEfectivo: "", abonoTransferencia: "",
  estado: PASOS[0],
  historial: [],
});

const totales = (c) => {
  const sub = c.conceptos.reduce((a, x) => a + (Number(x.cant)||1) * (Number(x.valor)||0), 0);
  const total = sub - (Number(c.descuento)||0);
  const abono = (Number(c.abonoEfectivo)||0) + (Number(c.abonoTransferencia)||0);
  return { sub, total, abono, saldo: total - abono };
};

/* ---------- estilos y componentes estáticos ---------- */
const S = {
  input: { width:"100%", padding:"12px 14px", border:"1px solid #D5DBE7", borderRadius:10, fontSize:16, outline:"none", boxSizing:"border-box", background:"#fff", color:NAVY },
  label: { fontSize:12, fontWeight:700, color:"#5A6478", textTransform:"uppercase", letterSpacing:".06em", marginBottom:6, display:"block" },
  card: { background:"#fff", borderRadius:18, padding:24, boxShadow:"0 2px 10px rgba(10,30,66,.07)", border:"1px solid #E8ECF3" },
  btnP: { background:BLUE, color:"#fff", border:"none", padding:"14px 26px", borderRadius:12, fontWeight:800, fontSize:15.5, cursor:"pointer", boxShadow:"0 2px 8px rgba(30,111,235,.28)" },
  btnS: { background:"#fff", color:NAVY, border:"1.5px solid #CBD4E3", padding:"13px 24px", borderRadius:12, fontWeight:700, fontSize:15, cursor:"pointer" },
  btnD: { background:"#fff", color:"#C0392B", border:"1.5px solid #F0C4BE", padding:"13px 22px", borderRadius:12, fontWeight:700, fontSize:15, cursor:"pointer" },
  h2: { fontSize:22, fontWeight:800, color:NAVY, margin:0 },
};

const tag = (bg, col) => ({ background:bg, color:col, padding:"4px 10px", borderRadius:20, fontSize:12, fontWeight:700, display:"inline-block" });

const colorEstado = (e) => {
  if (e === "Entregado") return tag("#E3F6E8","#1B7A3D");
  if (e === "Cancelado") return tag("#FBE7E4","#B3372A");
  if (e === PASOS[3]) return tag("#E3F6E8","#1B7A3D");
  if (e === PASOS[0]) return tag("#FFF3D6","#9A6B00");
  return tag("#E4EDFD", BLUE);
};

function Campo({ label, children }) {
  return (<div style={{marginBottom:12}}><label style={S.label}>{label}</label>{children}</div>);
}

function Sec({ titulo, children }) {
  return (
    <div style={{...S.card, marginBottom:16}}>
      <div style={{fontWeight:800, color:NAVY, fontSize:15.5, marginBottom:14, paddingBottom:8, borderBottom:"1.5px solid #EEF1F7"}}>{titulo}</div>
      {children}
    </div>
  );
}

function G2({ children }) {
  return <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(200px, 1fr))", gap:"6px 20px"}}>{children}</div>;
}

function Logo({ dark, alto }) {
  return (
    <div style={{display:"flex", alignItems:"center", gap:10}}>
      <div style={{background:"#fff", borderRadius:8, padding: dark ? "5px 9px" : 0, display:"flex"}}>
        <img src={LOGO} alt="MoviGestión Luz" style={{height: alto || 30, display:"block"}} />
      </div>
    </div>
  );
}

      border:"none", padding:"11px 20px", borderRadius:10, fontWeight:800, fontSize:15, cursor:"pointer"}}>{label}</button>

    </div>
  );
}

}

function abrirCotizacion(c, notificar) {
  const html = htmlCotizacion(c);
  try {
    const w = window.open("", "_blank");
    if (w && w.document) {
      w.document.open(); w.document.write(html); w.document.close();
      return;
    }
  } catch (e) { /* bloqueado por el navegador */ }
  descargarCotizacion(c, notificar);
}

function descargarCotizacion(c, notificar) {
  try {
    const blob = new Blob([htmlCotizacion(c)], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `Cotizacion_${c.numero || "MGL"}_${c.vehiculo.placa || ""}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    if (notificar) notificar("Archivo descargado. Ábrelo y usa Imprimir → Guardar como PDF.");
  } catch (e) { if (notificar) notificar("No se pudo descargar el archivo."); }
}

/* ============================ APP ============================ */
function App() {
  const [db, setDb] = useState({ cotizaciones: [], counter: 0 });
  const [cargando, setCargando] = useState(true);
  const [vista, setVista] = useState("login");
  const [pin, setPin] = useState("");
  const [errPin, setErrPin] = useState("");
  const [sel, setSel] = useState(null);
  const [form, setForm] = useState(null);
  const [busqueda, setBusqueda] = useState("");
  const [filtroEstado, setFiltroEstado] = useState("");
  const [toast, setToast] = useState("");
  const [pPlaca, setPPlaca] = useState("");
  const [pCodigo, setPCodigo] = useState("");
  const [pResultado, setPResultado] = useState(null);
  const [pError, setPError] = useState("");
  const [nuevoEstado, setNuevoEstado] = useState("");
  const [obsEstado, setObsEstado] = useState("");
  const [visibleCliente, setVisibleCliente] = useState(true);
  const [textoRestaurar, setTextoRestaurar] = useState("");

  useEffect(() => { cargar(); }, []);
  const notificar = (m) => { setToast(m); setTimeout(()=>setToast(""), 3200); };

  async function cargar() {
    try {
      const r = localStorage.getItem("movigestion-luz-v1");
      if (r) setDb(JSON.parse(r));
    } catch (e) { /* primera vez */ }
    setCargando(false);
  }
  async function guardarDb(nueva) {
    setDb(nueva);
    try { localStorage.setItem("movigestion-luz-v1", JSON.stringify(nueva)); }
    catch (e) { notificar("No se pudo guardar. Revisa la conexión."); }
  }

  const upd = (path, val) => {
    setForm((f) => {
      const n = JSON.parse(JSON.stringify(f));
      const keys = path.split(".");
      let o = n; for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
      o[keys[keys.length - 1]] = val;
      return n;
    });
  };

  function guardarCotizacion() {
    const f = { ...form };
    if (!f.cliente.nombre.trim() || !f.vehiculo.placa.trim()) { notificar("Nombre del cliente y placa son obligatorios."); return; }
    f.vehiculo.placa = f.vehiculo.placa.toUpperCase().trim();
    let nueva = { ...db };
    const existe = db.cotizaciones.find((c) => c.id === f.id);
    if (!existe) {
      nueva.counter = (db.counter || 0) + 1;
      f.numero = "MGL-" + String(nueva.counter).padStart(4, "0");
      f.historial = [{ de: null, a: f.estado, fecha: ahora(), usuario: f.asesor || "Admin", obs: "Cotización creada", visible: true }];
      nueva.cotizaciones = [f, ...db.cotizaciones];
    } else {
      nueva.cotizaciones = db.cotizaciones.map((c) => (c.id === f.id ? f : c));
    }
    guardarDb(nueva);
    setSel(f); setVista("detalle");
    notificar(existe ? "Cambios guardados" : "Cotización " + f.numero + " creada");
  }

  function cambiarEstado() {
    if (!nuevoEstado || nuevoEstado === sel.estado) return;
    const nv = { ...sel, estado: nuevoEstado,
      historial: [...sel.historial, { de: sel.estado, a: nuevoEstado, fecha: ahora(), usuario: sel.asesor || "Admin", obs: obsEstado, visible: visibleCliente }] };
    guardarDb({ ...db, cotizaciones: db.cotizaciones.map((c) => c.id === sel.id ? nv : c) });
    setSel(nv); setNuevoEstado(""); setObsEstado("");
    notificar("Estado actualizado: " + nuevoEstado);
  }

  function eliminar(id) {
    if (!window.confirm("¿Eliminar esta cotización? Esta acción no se puede deshacer.")) return;
    guardarDb({ ...db, cotizaciones: db.cotizaciones.filter((c) => c.id !== id) });
    setVista("lista"); notificar("Cotización eliminada");
  }

  function duplicar(c) {
    const d = JSON.parse(JSON.stringify(c));
    d.id = Date.now(); d.numero = ""; d.codigo = genCodigo(); d.fecha = hoy();
    d.estado = PASOS[0]; d.historial = []; d.conceptos = normalizarConceptos(d.conceptos);
    d.abonoEfectivo = ""; d.abonoTransferencia = "";
    setForm(d); setVista("form");
  }

  function descargarRespaldo() {
    try {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `respaldo-movigestion-${hoy()}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      notificar("Respaldo descargado");
    } catch (e) { notificar("No se pudo generar el respaldo"); }
  }

  function restaurarRespaldo() {
    try {
      const d = JSON.parse(textoRestaurar);
      if (!d.cotizaciones) { notificar("El texto no tiene el formato de respaldo"); return; }
      if (!window.confirm("Esto reemplazará las cotizaciones actuales. ¿Continuar?")) return;
      guardarDb(d); setTextoRestaurar(""); notificar("Datos restaurados: " + d.cotizaciones.length + " cotizaciones");
    } catch (e) { notificar("No se pudo leer el respaldo. Revisa el texto pegado."); }
  }

  function consultarPortal() {
    setPError(""); setPResultado(null);
    const c = db.cotizaciones.find((x) =>
      x.vehiculo.placa.toUpperCase() === pPlaca.toUpperCase().trim() &&
      x.codigo.toUpperCase() === pCodigo.toUpperCase().trim());
    if (!c) { setPError("No encontramos un trámite con esa placa y código. Verifica los datos o escríbenos por WhatsApp."); return; }
    setPResultado(c);
  }

  const filtradas = useMemo(() => {
    const q = busqueda.toLowerCase().trim();
    return db.cotizaciones.filter((c) => {
      const matchQ = !q || [c.numero, c.codigo, c.cliente.nombre, c.cliente.doc, c.cliente.tel, c.vehiculo.placa, c.fecha]
        .some((v) => (v || "").toLowerCase().includes(q));
      const matchE = !filtroEstado || c.estado === filtroEstado;
      return matchQ && matchE;
    });
  }, [db, busqueda, filtroEstado]);

  const stats = useMemo(() => {
    const cs = db.cotizaciones;
    const cuenta = (e) => cs.filter((c)=>c.estado===e).length;
    return {
      total: cs.length,
      enProceso: cs.filter((c) => !["Entregado","Cancelado"].includes(c.estado)).length,
      p0: cuenta(PASOS[0]), p1: cuenta(PASOS[1]), p2: cuenta(PASOS[2]), p3: cuenta(PASOS[3]),
      entregados: cuenta("Entregado"),
    };
  }, [db]);

  const irNueva = () => { setForm(cotVacia()); setVista("form"); };
  const salir = () => setVista("login");

  if (cargando) return <div style={{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"#F4F6FA", fontFamily:"'Segoe UI',system-ui,sans-serif", color:NAVY, fontWeight:700}}>Cargando MoviGestión Luz…</div>;

  /* ================= LOGIN ================= */
  if (vista === "login") return (
    <div style={{minHeight:"100vh", background:`linear-gradient(150deg, ${NAVY} 0%, #12305F 55%, ${BLUE} 130%)`, display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"'Segoe UI',system-ui,sans-serif", padding:20}}>
      <div style={{width:"100%", maxWidth:400}}>
        <div style={{textAlign:"center", marginBottom:22, display:"flex", justifyContent:"center"}}>
          <div style={{background:"#fff", borderRadius:14, padding:"14px 22px"}}><img src={LOGO} alt="MoviGestión Luz" style={{height:48, display:"block"}} /></div>
        </div>
        <div style={{...S.card, padding:28}}>
          <h2 style={{...S.h2, marginBottom:4}}>Acceso administrativo</h2>
          <p style={{fontSize:13.5, color:"#5A6478", marginTop:4, marginBottom:18}}>Ingresa el PIN del equipo para gestionar cotizaciones y trámites.</p>
          <Campo label="PIN de acceso">
            <input style={S.input} type="password" value={pin} onChange={(e)=>{setPin(e.target.value); setErrPin("");}}
              onKeyDown={(e)=>{ if(e.key==="Enter"){ pin===PIN_ADMIN ? (setVista("dashboard"), setPin("")) : setErrPin("PIN incorrecto. Intenta de nuevo."); }}}
              placeholder="••••••••" />
          </Campo>
          {errPin && <div style={{color:"#B3372A", fontSize:13, marginBottom:10, fontWeight:600}}>{errPin}</div>}
          <button style={{...S.btnP, width:"100%"}} onClick={()=> pin===PIN_ADMIN ? (setVista("dashboard"), setPin("")) : setErrPin("PIN incorrecto. Intenta de nuevo.")}>Entrar</button>
        </div>
        <div style={{...S.card, padding:20, marginTop:14, textAlign:"center"}}>
          <div style={{fontWeight:800, color:NAVY, fontSize:15, marginBottom:4}}>¿Eres cliente?</div>
          <p style={{fontSize:13, color:"#5A6478", margin:"0 0 12px"}}>Consulta el estado de tu trámite con tu placa y código de seguimiento.</p>
          <button style={{...S.btnS, width:"100%"}} onClick={()=>{setVista("portal"); setPResultado(null); setPPlaca(""); setPCodigo(""); setPError("");}}>Consultar mi trámite</button>
        </div>
      </div>
    </div>
  );

  /* ================= PORTAL CLIENTE ================= */
  if (vista === "portal") {
    const c = pResultado; const t = c ? totales(c) : null;
    const idxEstado = c ? (c.estado === "Entregado" ? PASOS.length : PASOS.indexOf(c.estado)) : -1;
    return (
      <div style={{minHeight:"100vh", background:"#F4F6FA", fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
        <div style={{background:NAVY, padding:"14px 20px", display:"flex", justifyContent:"space-between", alignItems:"center"}}>
          <Logo dark />
          <button style={{background:"transparent", border:"1.5px solid #3A5588", color:"#C7D6F0", padding:"8px 14px", borderRadius:9, fontSize:13, fontWeight:600, cursor:"pointer"}} onClick={()=>setVista("login")}>Volver</button>
        </div>
        <div style={{maxWidth:640, margin:"0 auto", padding:"28px 16px"}}>
          {!c && <>
            <h2 style={{...S.h2, fontSize:24, marginBottom:6}}>Consulta tu trámite</h2>
            <p style={{color:"#5A6478", fontSize:14.5, marginTop:0, marginBottom:20}}>Ingresa la placa de tu vehículo y el código de seguimiento que te entregó tu asesor.</p>
            <div style={S.card}>
              <Campo label="Placa del vehículo"><input style={{...S.input, textTransform:"uppercase", letterSpacing:".1em", fontWeight:700}} value={pPlaca} onChange={(e)=>setPPlaca(e.target.value)} placeholder="ABC123" /></Campo>
              <Campo label="Código de seguimiento"><input style={{...S.input, textTransform:"uppercase", letterSpacing:".1em", fontWeight:700}} value={pCodigo} onChange={(e)=>setPCodigo(e.target.value)} placeholder="X4K9PT" /></Campo>
              {pError && <div style={{background:"#FBE7E4", color:"#B3372A", padding:"10px 14px", borderRadius:10, fontSize:13.5, marginBottom:12}}>{pError}</div>}
              <button style={{...S.btnP, width:"100%"}} onClick={consultarPortal}>Ver estado del trámite</button>
              <a href={`https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Hola MoviGestión Luz, necesito ayuda con mi trámite.")}`} target="_blank" rel="noreferrer"
                style={{display:"block", textAlign:"center", marginTop:14, color:BLUE, fontWeight:700, fontSize:14, textDecoration:"none"}}>¿Necesitas ayuda? Escríbenos por WhatsApp</a>
            </div>

          {c && <>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:8}}>
              <h2 style={S.h2}>Trámite {c.numero}</h2>

              <div style={{display:"flex", justifyContent:"space-between", fontSize:15, borderTop:"1px solid #E8ECF3", paddingTop:8}}><b>Saldo pendiente</b><b style={{color: t.saldo>0 ? "#B3372A" : "#1B7A3D"}}>{fmt(t.saldo)}</b></div>
            </div>
            {c.historial.filter((h)=>h.visible && h.obs).length > 0 && <div style={{...S.card, marginBottom:14}}>
              <div style={{fontWeight:800, color:NAVY, marginBottom:10}}>Novedades</div>
              {c.historial.filter((h)=>h.visible && h.obs).slice().reverse().map((h, i) => (
                <div key={i} style={{borderBottom:"1px solid #EEF1F7", padding:"8px 0", fontSize:13.5}}>
                  <div style={{color:"#5A6478", fontSize:12}}>{h.fecha} · {h.a}</div>
                  <div>{h.obs}</div>
                </div>
              ))}
            </div>}
            <a href={`https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Hola, consulto por mi trámite "+c.numero+" (placa "+c.vehiculo.placa+").")}`} target="_blank" rel="noreferrer"
              style={{...S.btnP, display:"block", textAlign:"center", textDecoration:"none", boxSizing:"border-box"}}>Escribir por WhatsApp</a>
            <button style={{...S.btnS, width:"100%", marginTop:10}} onClick={()=>{setPResultado(null);}}>Consultar otra placa</button>
          </>}
        </div>
      </div>
    );
  }

  /* ================= DASHBOARD ================= */
  if (vista === "dashboard") {
    const recientes = db.cotizaciones.slice(0, 6);
    const Kpi = ({ label, valor, color }) => (
      <div style={{...S.card, padding:"16px 18px"}}>
        <div style={{fontSize:11.5, fontWeight:700, color:"#5A6478", textTransform:"uppercase", letterSpacing:".05em", lineHeight:1.3, minHeight:30}}>{label}</div>
        <div style={{fontSize:34, fontWeight:900, color: color || NAVY, marginTop:6}}>{valor}</div>
      </div>
    );
    return (
      <Shell vista={vista} setVista={setVista} onNueva={irNueva} onSalir={salir} toast={toast}>
        <h2 style={{...S.h2, fontSize:26, marginBottom:16}}>Panel operativo</h2>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(180px, 1fr))", gap:16, marginBottom:22}}>
          <Kpi label="Trámites totales" valor={stats.total} />
          <Kpi label="En proceso" valor={stats.enProceso} color={BLUE} />
          <Kpi label="1 · Paquete pendiente" valor={stats.p0} color={stats.p0>0?"#9A6B00":NAVY} />
          <Kpi label="2 · Listo para agendar" valor={stats.p1} color={BLUE} />
          <Kpi label="3 · En agendamiento" valor={stats.p2} color={BLUE} />
          <Kpi label="4 · Listo para entregar" valor={stats.p3} color="#1B7A3D" />
          <Kpi label="Entregados" valor={stats.entregados} color="#1B7A3D" />
        </div>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
          <h3 style={{...S.h2, fontSize:17}}>Actividad reciente</h3>
          <button style={S.btnP} onClick={irNueva}>+ Nueva cotización</button>
        </div>
        {recientes.length === 0 && <div style={{...S.card, textAlign:"center", padding:40, color:"#5A6478"}}>
          Aún no hay cotizaciones. Crea la primera con el botón <b>+ Nueva cotización</b>.
        </div>}
        {recientes.map((c) => { const t = totales(c); return (
          <div key={c.id} onClick={()=>{setSel(c); setVista("detalle");}} style={{...S.card, marginBottom:10, cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10}}>
            <div>
              <div style={{fontWeight:800, color:NAVY}}>{c.numero} · {c.vehiculo.placa} <span style={{fontWeight:500, color:"#5A6478"}}>· {c.cliente.nombre}</span></div>
              <div style={{fontSize:13, color:"#5A6478", marginTop:2}}>{c.tramite.tipo} · {c.fecha} · Saldo {fmt(t.saldo)}</div>
            </div>
            <span style={colorEstado(c.estado)}>{c.estado}</span>
          </div>);})}
      </Shell>
    );
  }

  /* ================= RESPALDO ================= */
  if (vista === "ajustes") return (
    <Shell vista={vista} setVista={setVista} onNueva={irNueva} onSalir={salir} toast={toast}>
      <h2 style={{...S.h2, fontSize:26, marginBottom:16}}>Respaldo de información</h2>
      <Sec titulo="Descargar respaldo">
        <p style={{fontSize:14, color:"#5A6478", marginTop:0}}>
          Guarda una copia de todas las cotizaciones en un archivo. Recomendado una vez por semana:
          descárgalo y súbelo a Drive o envíalo por WhatsApp.
        </p>
        <div style={{fontSize:14, marginBottom:14}}>Cotizaciones guardadas actualmente: <b>{db.cotizaciones.length}</b></div>
        <button style={S.btnP} onClick={descargarRespaldo}>Descargar respaldo</button>
      </Sec>
      <Sec titulo="Restaurar desde respaldo">
        <p style={{fontSize:14, color:"#5A6478", marginTop:0}}>Abre el archivo de respaldo, copia todo su contenido y pégalo aquí.</p>
        <textarea style={{...S.input, minHeight:120, fontFamily:"monospace", fontSize:12}} value={textoRestaurar} onChange={(e)=>setTextoRestaurar(e.target.value)} placeholder='{"cotizaciones":[…]}' />
        <button style={{...S.btnS, marginTop:10}} onClick={restaurarRespaldo}>Restaurar información</button>
      </Sec>
    </Shell>
  );

  /* ================= LISTA ================= */
  if (vista === "lista") return (
    <Shell vista={vista} setVista={setVista} onNueva={irNueva} onSalir={salir} toast={toast}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:10}}>
        <h2 style={{...S.h2, fontSize:26}}>Cotizaciones y trámites</h2>
        <button style={S.btnP} onClick={irNueva}>+ Nueva</button>
      </div>
      <div style={{display:"flex", gap:10, marginBottom:16, flexWrap:"wrap"}}>
        <input style={{...S.input, flex:"1 1 320px", maxWidth:520}} placeholder="Buscar por placa, nombre, documento, teléfono…" value={busqueda} onChange={(e)=>setBusqueda(e.target.value)} />
        <select style={{...S.input, flex:"0 1 260px"}} value={filtroEstado} onChange={(e)=>setFiltroEstado(e.target.value)}>
          <option value="">Todos los estados</option>
          {ESTADOS.map((e)=><option key={e}>{e}</option>)}
        </select>
      </div>
      {filtradas.length === 0 && <div style={{...S.card, textAlign:"center", padding:36, color:"#5A6478"}}>Sin resultados para esta búsqueda.</div>}
      {filtradas.map((c) => { const t = totales(c); return (
        <div key={c.id} onClick={()=>{setSel(c); setVista("detalle");}} style={{...S.card, marginBottom:10, cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10}}>
          <div>
            <div style={{fontWeight:800, color:NAVY, fontSize:15}}>{c.numero} · <span style={{letterSpacing:".06em"}}>{c.vehiculo.placa}</span></div>
            <div style={{fontSize:13, color:"#5A6478", marginTop:2}}>{c.cliente.nombre} · {c.tramite.tipo} · {c.fecha}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <span style={colorEstado(c.estado)}>{c.estado}</span>
            <div style={{fontSize:13, marginTop:4, color: t.saldo>0 ? "#B3372A" : "#1B7A3D", fontWeight:700}}>Saldo {fmt(t.saldo)}</div>
          </div>
        </div>);})}
    </Shell>
  );

  /* ================= FORMULARIO ================= */
  if (vista === "form" && form) {
    const t = totales(form);
    return (
      <Shell vista={vista} setVista={setVista} onNueva={irNueva} onSalir={salir} toast={toast}>
        <h2 style={{...S.h2, fontSize:26, marginBottom:16}}>{form.numero ? "Editar " + form.numero : "Nueva cotización"}</h2>
        <Sec titulo="Datos generales">
          <G2>
            <Campo label="Fecha"><input type="date" style={S.input} value={form.fecha} onChange={(e)=>upd("fecha", e.target.value)} /></Campo>
            <Campo label="Válida hasta"><input type="date" style={S.input} value={form.vence} onChange={(e)=>upd("vence", e.target.value)} /></Campo>
            <Campo label="Asesor"><input style={S.input} value={form.asesor} onChange={(e)=>upd("asesor", e.target.value)} placeholder="Nombre del asesor" /></Campo>
            <Campo label="Ciudad del trámite">
              <input style={S.input} list="ciudades" value={form.ciudad} onChange={(e)=>{
                const ciudad = e.target.value;
                setForm((f)=>({ ...f, ciudad, conceptos: normalizarConceptos(aplicarCiudad(f.conceptos, ciudad)) }));
              }} />
              <datalist id="ciudades"><option value="Ibagué" /></datalist>
              {esIbague(form.ciudad) && <div style={{fontSize:12, color:"#1B7A3D", fontWeight:600, marginTop:4}}>Tarifas de Ibagué aplicadas automáticamente</div>}
            </Campo>
          </G2>
        </Sec>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(300px, 1fr))", gap:18}}>
        <Sec titulo="Cliente">
          <G2>
            <Campo label="Nombre completo *"><input style={S.input} value={form.cliente.nombre} onChange={(e)=>upd("cliente.nombre", e.target.value)} /></Campo>
            <Campo label="Tipo de documento">
              <select style={S.input} value={form.cliente.tipoDoc} onChange={(e)=>upd("cliente.tipoDoc", e.target.value)}>
                <option>CC</option><option>CE</option><option>NIT</option><option>Pasaporte</option>
              </select></Campo>
            <Campo label="Número de documento"><input style={S.input} inputMode="numeric" value={form.cliente.doc} onChange={(e)=>upd("cliente.doc", e.target.value)} /></Campo>
            <Campo label="Teléfono / WhatsApp"><input style={S.input} inputMode="tel" value={form.cliente.tel} onChange={(e)=>upd("cliente.tel", e.target.value)} /></Campo>
            <Campo label="Dirección"><input style={S.input} value={form.cliente.dir} onChange={(e)=>upd("cliente.dir", e.target.value)} /></Campo>
          </G2>
        </Sec>
        <Sec titulo="Vehículo">
          <G2>
            <Campo label="Placa *"><input style={{...S.input, textTransform:"uppercase", fontWeight:700, letterSpacing:".08em"}} value={form.vehiculo.placa} onChange={(e)=>upd("vehiculo.placa", e.target.value)} placeholder="ABC123" /></Campo>
            <Campo label="Marca"><input style={S.input} value={form.vehiculo.marca} onChange={(e)=>upd("vehiculo.marca", e.target.value)} /></Campo>
            <Campo label="Línea"><input style={S.input} value={form.vehiculo.linea} onChange={(e)=>upd("vehiculo.linea", e.target.value)} /></Campo>
            <Campo label="Modelo (año)"><input style={S.input} inputMode="numeric" value={form.vehiculo.modelo} onChange={(e)=>upd("vehiculo.modelo", e.target.value)} /></Campo>
            <Campo label="Tipo">
              <select style={S.input} value={form.vehiculo.tipo} onChange={(e)=>upd("vehiculo.tipo", e.target.value)}>
                <option>Automóvil</option><option>Motocicleta</option><option>Camioneta</option><option>Camión</option><option>Volqueta</option><option>Otro</option>
              </select></Campo>
            <Campo label="Servicio">
              <select style={S.input} value={form.vehiculo.servicio} onChange={(e)=>upd("vehiculo.servicio", e.target.value)}>
                <option>Particular</option><option>Público</option>
              </select></Campo>
            <Campo label="Ciudad de matrícula"><input style={S.input} value={form.vehiculo.ciudadMat} onChange={(e)=>upd("vehiculo.ciudadMat", e.target.value)} /></Campo>
          </G2>
        </Sec>
        </div>
        <Sec titulo="Trámite">
          <G2>
            <Campo label="Tipo de trámite">
              <select style={S.input} value={form.tramite.tipo} onChange={(e)=>upd("tramite.tipo", e.target.value)}>
                {TIPOS_TRAMITE.map((x)=><option key={x}>{x}</option>)}
              </select></Campo>
            <Campo label="Fecha estimada de entrega"><input type="date" style={S.input} value={form.tramite.fechaEstimada} onChange={(e)=>upd("tramite.fechaEstimada", e.target.value)} /></Campo>
          </G2>
          <Campo label="Descripción"><textarea style={{...S.input, minHeight:60}} value={form.tramite.desc} onChange={(e)=>upd("tramite.desc", e.target.value)} /></Campo>
          <Campo label="Requisitos (aparecen en la cotización)"><textarea style={{...S.input, minHeight:80}} value={form.tramite.requisitos} onChange={(e)=>upd("tramite.requisitos", e.target.value)} placeholder={"1. Improntas\n2. Copia cédulas al 150%\n3. Comparendos al día…"} /></Campo>
          <G2>
            <Campo label="Documentos entregados"><textarea style={{...S.input, minHeight:60}} value={form.tramite.docsEntregados} onChange={(e)=>upd("tramite.docsEntregados", e.target.value)} /></Campo>
            <Campo label="Documentos pendientes (visibles al cliente)"><textarea style={{...S.input, minHeight:60}} value={form.tramite.docsPendientes} onChange={(e)=>upd("tramite.docsPendientes", e.target.value)} /></Campo>
          </G2>
        </Sec>
        <Sec titulo="Costos">
          <p style={{fontSize:13, color:"#5A6478", marginTop:0, marginBottom:14}}>
            Los conceptos ya están cargados. Escribe solo el valor de los que apliquen; los vacíos no aparecen en la cotización.
            Si registras un valor en <b>Impuestos</b>, se agrega automáticamente la fila de honorarios de impuestos.
          </p>
          {form.conceptos.map((x, i) => {
            const fijo = x.desc === HON_IMPUESTOS;
            return (
            <div key={i} style={{display:"grid", gridTemplateColumns:"1fr 150px 38px", gap:8, marginBottom:8, alignItems:"center"}}>
              <input style={{...S.input, background: fijo ? "#EAF2FF" : CONCEPTOS_BASE.includes(x.desc) ? "#F7F9FC" : "#fff", color: fijo ? BLUE : NAVY, fontWeight: fijo ? 700 : 400}} value={x.desc} placeholder="Otro concepto" readOnly={fijo}
                onChange={(e)=>{ const c=[...form.conceptos]; c[i]={...c[i], desc:e.target.value}; upd("conceptos", c); }} />
              <input style={{...S.input, textAlign:"right", fontWeight:700, background: fijo ? "#EAF2FF" : "#fff"}} inputMode="numeric" value={miles(x.valor)} placeholder="0" readOnly={fijo}
                onChange={(e)=>{ const c=[...form.conceptos]; c[i]={...c[i], valor:soloNum(e.target.value)}; upd("conceptos", normalizarConceptos(c)); }} />
              {fijo ? <div /> : <button style={{...S.btnD, padding:"8px 8px"}} onClick={()=>{ upd("conceptos", normalizarConceptos(form.conceptos.filter((_,j)=>j!==i))); }}>✕</button>}
            </div>);
          })}
          <button style={{...S.btnS, marginBottom:16}} onClick={()=>upd("conceptos", [...form.conceptos, {cant:1, desc:"", valor:""}])}>+ Agregar otro concepto</button>
          <G2>
            <Campo label="Descuento"><input style={{...S.input, textAlign:"right", fontWeight:700}} inputMode="numeric" value={miles(form.descuento)} onChange={(e)=>upd("descuento", soloNum(e.target.value))} placeholder="0" /></Campo>
            <Campo label="Abono en efectivo"><input style={{...S.input, textAlign:"right", fontWeight:700}} inputMode="numeric" value={miles(form.abonoEfectivo)} onChange={(e)=>upd("abonoEfectivo", soloNum(e.target.value))} placeholder="0" /></Campo>
            <Campo label="Abono por transferencia"><input style={{...S.input, textAlign:"right", fontWeight:700}} inputMode="numeric" value={miles(form.abonoTransferencia)} onChange={(e)=>upd("abonoTransferencia", soloNum(e.target.value))} placeholder="0" /></Campo>
          </G2>
          <div style={{background:"#F4F6FA", borderRadius:12, padding:"14px 18px", display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(130px, 1fr))", gap:10, fontSize:14}}>
            <div><span style={S.label}>Subtotal</span><b>{fmt(t.sub)}</b></div>
            <div><span style={S.label}>Total</span><b style={{fontSize:17}}>{fmt(t.total)}</b></div>
            <div><span style={S.label}>Abonado</span><b style={{color:"#1B7A3D"}}>{fmt(t.abono)}</b></div>
            <div><span style={S.label}>Saldo</span><b style={{color: t.saldo>0?"#B3372A":"#1B7A3D"}}>{fmt(t.saldo)}</b></div>
          </div>
        </Sec>
        <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
          <button style={S.btnP} onClick={guardarCotizacion}>{form.numero ? "Guardar cambios" : "Crear cotización"}</button>
          <button style={S.btnS} onClick={()=>setVista(form.numero ? "detalle" : "lista")}>Cancelar</button>
        </div>
      </Shell>
    );
  }

  /* ================= VISTA PREVIA COTIZACIÓN ================= */
  if (vista === "preview" && sel) {
    const c = db.cotizaciones.find((x)=>x.id===sel.id) || sel;
    const t = totales(c);
    const filas = c.conceptos.filter((x)=> Number(x.valor) > 0);
    return (
      <div style={{minHeight:"100vh", background:"#EEF1F7", fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
        <div style={{background:NAVY, padding:"12px 16px", display:"flex", gap:8, justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", position:"sticky", top:0, zIndex:10}}>
          <button style={{...S.btnS, padding:"9px 14px"}} onClick={()=>setVista("detalle")}>← Volver</button>
          <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
            <button style={S.btnP} onClick={()=>abrirCotizacion(c, notificar)}>Abrir en pestaña para imprimir</button>
            <button style={{...S.btnS}} onClick={()=>descargarCotizacion(c, notificar)}>Descargar</button>
          </div>
        </div>
        <div style={{padding:"16px 8px 40px"}}>
          <div style={{maxWidth:720, margin:"0 auto", background:"#fff", borderRadius:8, boxShadow:"0 2px 12px rgba(10,30,66,.15)", padding:"28px 26px", color:NAVY}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", borderBottom:`3px solid ${NAVY}`, paddingBottom:14, marginBottom:18, gap:16, flexWrap:"wrap"}}>
              <img src={LOGO} alt="MoviGestión Luz" style={{height:44}} />
              <div style={{textAlign:"right", fontSize:12, color:"#5A6478"}}>
                <div style={{fontSize:17, fontWeight:900, color:NAVY}}>COTIZACIÓN {c.numero}</div>
                <div>Fecha: {c.fecha}</div>
                {c.vence && <div>Válida hasta: {c.vence}</div>}
                <div>Tel: {TEL_VISIBLE}</div>
                <div>{DIRECCION}</div>
              </div>
            </div>
            <div style={{display:"flex", gap:24, marginBottom:16, flexWrap:"wrap"}}>
              <div style={{flex:1, minWidth:200}}>
                <div style={{fontSize:12, letterSpacing:".06em", borderBottom:"1.5px solid #E8ECF3", paddingBottom:4, marginBottom:7, fontWeight:800}}>CLIENTE</div>
                <div><b>{c.cliente.nombre}</b></div>
                <div>{c.cliente.tipoDoc} {c.cliente.doc}</div>
                <div>{c.cliente.tel}</div>
              </div>
              <div style={{flex:1, minWidth:200}}>
                <div style={{fontSize:12, letterSpacing:".06em", borderBottom:"1.5px solid #E8ECF3", paddingBottom:4, marginBottom:7, fontWeight:800}}>VEHÍCULO</div>
                <div>Placa: <b>{c.vehiculo.placa}</b></div>
                <div>{c.vehiculo.marca} {c.vehiculo.linea} {c.vehiculo.modelo}</div>
                <div>Matriculado en: {c.vehiculo.ciudadMat || "—"}</div>
                <div>Servicio: {c.vehiculo.servicio}</div>
              </div>
            </div>
            <div style={{fontSize:12, letterSpacing:".06em", borderBottom:"1.5px solid #E8ECF3", paddingBottom:4, marginBottom:7, fontWeight:800}}>TRÁMITE: {c.tramite.tipo.toUpperCase()}</div>
            {c.tramite.desc && <div style={{marginBottom:4}}>{c.tramite.desc}</div>}
            {c.tramite.fechaEstimada && <div style={{marginBottom:4}}>Entrega estimada: {c.tramite.fechaEstimada}</div>}
            <table style={{width:"100%", borderCollapse:"collapse", margin:"14px 0", fontSize:13.5}}>
              <thead><tr style={{background:NAVY, color:"#fff"}}>
                <th style={{padding:"8px 10px", textAlign:"left"}}>Descripción</th>
                <th style={{padding:"8px 10px", textAlign:"right"}}>Valor</th>
              </tr></thead>
              <tbody>{filas.map((x,i)=>(
                <tr key={i} style={{borderBottom:"1px solid #E8ECF3"}}>
                  <td style={{padding:"7px 10px"}}>{x.desc}</td>
                  <td style={{padding:"7px 10px", textAlign:"right"}}>{fmt(x.valor)}</td>
                </tr>))}
                {filas.length===0 && <tr><td colSpan={2} style={{padding:"10px", color:"#9AA3B2"}}>Sin valores registrados aún.</td></tr>}
              </tbody>
            </table>
            <div style={{marginLeft:"auto", width:280, fontSize:13.5}}>
              {Number(c.descuento)>0 && <div style={{display:"flex", justifyContent:"space-between", padding:"4px 10px"}}><span>Descuento</span><span>−{fmt(c.descuento)}</span></div>}
              <div style={{display:"flex", justifyContent:"space-between", padding:"8px 10px", background:NAVY, color:"#fff", fontWeight:800, borderRadius:6}}><span>TOTAL</span><span>{fmt(t.total)}</span></div>
              {t.abono>0 && <>
                <div style={{display:"flex", justifyContent:"space-between", padding:"4px 10px 0"}}><span>Abono</span><span>{fmt(t.abono)}</span></div>
                <div style={{display:"flex", justifyContent:"space-between", padding:"4px 10px", fontWeight:800}}><span>SALDO</span><span>{fmt(t.saldo)}</span></div>
              </>}
            </div>
            {c.tramite.requisitos && <div style={{marginTop:16}}>
              <div style={{fontSize:12, letterSpacing:".06em", fontWeight:800, marginBottom:4}}>REQUISITOS</div>
              <div style={{whiteSpace:"pre-wrap", fontSize:12.5}}>{c.tramite.requisitos}</div>
            </div>}
            <div style={{background:"#F4F6FA", borderRadius:10, padding:"12px 16px", fontSize:12.5, margin:"16px 0"}}>
              <b>Seguimiento en línea:</b> consulta el estado con la placa <b>{c.vehiculo.placa}</b> y el código <b style={{letterSpacing:".1em"}}>{c.codigo}</b>.
            </div>
            <div style={{display:"flex", justifyContent:"space-between", fontSize:12, color:"#5A6478", borderTop:"1px solid #E8ECF3", paddingTop:12, flexWrap:"wrap", gap:8}}>
              <div>Asesor: <b style={{color:NAVY}}>{c.asesor || "—"}</b></div>
              <div>MoviGestión Luz · Servicios Integrales Vehiculares</div>
            </div>
          </div>
          <p style={{maxWidth:720, margin:"14px auto 0", fontSize:12.5, color:"#5A6478", textAlign:"center"}}>
            Para guardar en PDF: toca <b>Abrir en pestaña para imprimir</b> y luego elige <b>Imprimir → Guardar como PDF</b>.
          </p>
        </div>
      </div>
    );
  }

  /* ================= DETALLE ================= */
  if (vista === "detalle" && sel) {
    const c = db.cotizaciones.find((x)=>x.id===sel.id) || sel;
    const t = totales(c);
    const telCliente = (c.cliente.tel||"").replace(/\D/g,"");
    const destino = telCliente ? (telCliente.length === 10 ? "57"+telCliente : telCliente) : WHATSAPP;
    const linkWA = `https://wa.me/${destino}?text=${encodeURIComponent(
      `Hola ${c.cliente.nombre.split(" ")[0]}, te saluda MoviGestión Luz. Tu trámite ${c.numero} (placa ${c.vehiculo.placa}) está en estado: ${c.estado}. Puedes hacer seguimiento con tu placa y el código ${c.codigo}. Saldo pendiente: ${fmt(t.saldo)}.`)}`;
    return (
      <Shell vista={vista} setVista={setVista} onNueva={irNueva} onSalir={salir} toast={toast}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:10}}>
          <div>
            <h2 style={{...S.h2, fontSize:26}}>{c.numero} · <span style={{letterSpacing:".06em"}}>{c.vehiculo.placa}</span></h2>
            <div style={{fontSize:13.5, color:"#5A6478", marginTop:3}}>Código de seguimiento: <b style={{color:NAVY, letterSpacing:".1em"}}>{c.codigo}</b> · {c.fecha}</div>
          </div>
          <span style={colorEstado(c.estado)}>{c.estado}</span>
        </div>
        <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:18}}>
          <button style={S.btnP} onClick={()=>{setSel(c); setVista("preview");}}>Ver cotización</button>
          <button style={S.btnS} onClick={()=>abrirCotizacion(c, notificar)}>Abrir en pestaña</button>
          <button style={S.btnS} onClick={()=>descargarCotizacion(c, notificar)}>Descargar</button>
          <a style={{...S.btnS, textDecoration:"none", display:"inline-block"}} href={linkWA} target="_blank" rel="noreferrer">Enviar por WhatsApp</a>
          <button style={S.btnS} onClick={()=>{setForm(JSON.parse(JSON.stringify(c))); setVista("form");}}>Editar</button>
          <button style={S.btnS} onClick={()=>duplicar(c)}>Duplicar</button>
          <button style={S.btnD} onClick={()=>eliminar(c.id)}>Eliminar</button>
        </div>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(300px, 1fr))", gap:18, marginBottom:14}}>
          <div style={S.card}>
            <div style={{fontWeight:800, color:NAVY, marginBottom:10}}>Cliente</div>
            <div style={{fontSize:14, lineHeight:1.8}}>
              <b>{c.cliente.nombre}</b><br/>{c.cliente.tipoDoc} {c.cliente.doc}<br/>{c.cliente.tel}
            </div>
          </div>
          <div style={S.card}>
            <div style={{fontWeight:800, color:NAVY, marginBottom:10}}>Vehículo · {c.tramite.tipo}</div>
            <div style={{fontSize:14, lineHeight:1.8}}>
              {c.vehiculo.marca} {c.vehiculo.linea} {c.vehiculo.modelo} · {c.vehiculo.tipo}<br/>
              Servicio {c.vehiculo.servicio}{c.vehiculo.ciudadMat && <><br/>Matriculado en {c.vehiculo.ciudadMat}</>}
              {c.tramite.fechaEstimada && <><br/>Entrega estimada: <b>{c.tramite.fechaEstimada}</b></>}
            </div>
          </div>
          <div style={S.card}>
            <div style={{fontWeight:800, color:NAVY, marginBottom:10}}>Dinero</div>
            <div style={{fontSize:14, lineHeight:1.9}}>
              Total: <b>{fmt(t.total)}</b><br/>
              Abonado: <b style={{color:"#1B7A3D"}}>{fmt(t.abono)}</b> <span style={{color:"#5A6478", fontSize:12.5}}>(Efec. {fmt(c.abonoEfectivo)} · Transf. {fmt(c.abonoTransferencia)})</span><br/>
              Saldo: <b style={{color: t.saldo>0?"#B3372A":"#1B7A3D"}}>{fmt(t.saldo)}</b>
            </div>
          </div>
        </div>
        <div style={{...S.card, marginBottom:14}}>
          <div style={{fontWeight:800, color:NAVY, marginBottom:12}}>Actualizar estado</div>
          <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end"}}>
            <div style={{flex:"1 1 220px"}}>
              <label style={S.label}>Nuevo estado</label>
              <select style={S.input} value={nuevoEstado} onChange={(e)=>setNuevoEstado(e.target.value)}>
                <option value="">Seleccionar…</option>
                {ESTADOS.map((e, i)=><option key={e}>{e}</option>)}
              </select>
            </div>
            <div style={{flex:"2 1 280px"}}>
              <label style={S.label}>Observación</label>
              <input style={S.input} value={obsEstado} onChange={(e)=>setObsEstado(e.target.value)} placeholder="Ej: cita agendada para el 30 de julio" />
            </div>
            <label style={{display:"flex", alignItems:"center", gap:6, fontSize:13, fontWeight:600, color:NAVY, paddingBottom:10, cursor:"pointer"}}>
              <input type="checkbox" checked={visibleCliente} onChange={(e)=>setVisibleCliente(e.target.checked)} /> Visible al cliente
            </label>
            <button style={S.btnP} onClick={cambiarEstado}>Actualizar</button>
          </div>
        </div>
        <div style={S.card}>
          <div style={{fontWeight:800, color:NAVY, marginBottom:12}}>Historial del trámite</div>
          {c.historial.slice().reverse().map((h, i) => (
            <div key={i} style={{display:"flex", gap:12, padding:"10px 0", borderBottom:"1px solid #EEF1F7", fontSize:13.5}}>
              <div style={{width:8, height:8, borderRadius:"50%", background:BLUE, marginTop:6, flexShrink:0}} />
              <div>
                <b style={{color:NAVY}}>{h.a}</b> <span style={{color:"#5A6478"}}>· {h.fecha} · {h.usuario}</span>
                {!h.visible && <span style={{...tag("#EEF1F7","#5A6478"), marginLeft:8, fontSize:11}}>Interno</span>}
                {h.obs && <div style={{marginTop:2}}>{h.obs}</div>}
              </div>
            </div>
          ))}
        </div>
      </Shell>
    );
  }

  return null;
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
