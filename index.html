                {h.obs && <div style={{marginTop:2}}>{h.obs}</div>}
              </div>
            </div>
          ))}
        </div>
        </>}
      </Shell>
    );
  }

  return null;
}


/* ================= APLICATIVO DE CAJA (encapsulado) ================= */
function CajaApp({ onSalirCaja, tabla, titulo, onVerTramite }) {
  const TABLA_CAJA = tabla || "caja_state";
  const TITULO_APP = titulo || "Finanzas de Caja";

  /* ============================================================
     CAJA — Control financiero (reutilizable para la empresa o para finanzas personales)
     Conectado a Supabase (misma nube de los trámites)
     ============================================================ */

  const NAVY = "#0A1E42";
  const BLUE = "#1E6FEB";
  const GOLD = "#C9A24B";
  const GREEN = "#1B7A3D";
  const RED = "#B3372A";
  const PURPLE = "#6B2FB3";
  const AMARILLO = "#B8860B";
  /* color de un movimiento: canje siempre amarillo, sino verde (entra) / rojo (sale) / azul (transferencia) */
  function colorMovimiento(m) {
    if ((m.categoria || "").toLowerCase().includes("canje")) return AMARILLO;
    if (m.tipo === "ingreso") return GREEN;
    if (m.tipo === "egreso") return RED;
    return BLUE;
  }






  /* cuentas por defecto */
  const CUENTAS_DEF = ["Efectivo", "Nequi", "Davivienda", "Bancolombia"];
  const COLOR_CUENTA = {
    "Efectivo": "#1B7A3D", "Nequi": "#DA0081", "Davivienda": "#ED1C27", "Bancolombia": "#FDDA24",
  };
  const ICONO_CUENTA = { "Efectivo": "💵", "Nequi": "📱", "Davivienda": "🏦", "Bancolombia": "🏛️" };

  /* conceptos de trámite: ganancia real vs dinero en canje */
  const CONCEPTOS_GANANCIA = ["Honorarios", "Honorarios de impuestos", "Papelería", "Improntas"];
  const CONCEPTOS_CANJE = ["Derechos de tránsito", "Impuestos", "Retención", "Multas", "Mensajería"];

  /* categorías de movimientos */
  const CAT_INGRESO = ["Abono de trámite", "Abono trámite (Honorarios)", "Abono trámite (Canje)", "Pago de trámite", "Otro ingreso", "Aporte de capital"];
  const CAT_EGRESO = ["Pago a tránsito (canje)", "Pago a empleado", "Gasto fijo", "Gasto diario", "Retiro personal", "Compra / insumos", "Egreso fortuito", "Otro egreso"];
  const CAT_TRANSFER = ["Entre cuentas", "Retirar dinero de banco", "Consignar dinero a banco"];

  const fmt = (n) => "$" + Math.round(Number(n) || 0).toLocaleString("es-CO");
  const hoy = () => new Date().toISOString().slice(0, 10);
  const ahora = () => new Date().toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" });
  const miles = (v) => { const d = String(v ?? "").replace(/\D/g, "").replace(/^0+(?=\d)/, ""); return d ? Number(d).toLocaleString("es-CO") : ""; };
  const soloNum = (v) => String(v ?? "").replace(/\D/g, "");
  const uid = () => Date.now() + "-" + Math.random().toString(36).slice(2, 7);

  /* estilos base */
  const S = {
    input: { width:"100%", padding:"12px 14px", border:"1px solid #D5DBE7", borderRadius:10, fontSize:16, outline:"none", boxSizing:"border-box", background:"#fff", color:NAVY },
    label: { fontSize:12, fontWeight:700, color:"#5A6478", textTransform:"uppercase", letterSpacing:".06em", marginBottom:6, display:"block" },
    card: { background:"#fff", borderRadius:18, padding:24, boxShadow:"0 2px 10px rgba(10,30,66,.07)", border:"1px solid #E8ECF3" },
    btnP: { background:BLUE, color:"#fff", border:"none", padding:"14px 26px", borderRadius:12, fontWeight:800, fontSize:15.5, cursor:"pointer", boxShadow:"0 2px 8px rgba(30,111,235,.28)" },
    btnS: { background:"#fff", color:NAVY, border:"1.5px solid #CBD4E3", padding:"13px 24px", borderRadius:12, fontWeight:700, fontSize:15, cursor:"pointer" },
    btnD: { background:"#fff", color:"#C0392B", border:"1.5px solid #F0C4BE", padding:"13px 22px", borderRadius:12, fontWeight:700, fontSize:15, cursor:"pointer" },
    h2: { fontSize:22, fontWeight:800, color:NAVY, margin:0 },
  };
  const tag = (bg, col) => ({ background:bg, color:col, padding:"4px 10px", borderRadius:20, fontSize:12, fontWeight:700, display:"inline-block" });

  /* clasifica el valor de una cotización en ganancia vs canje */
  function clasificarCotizacion(cot) {
    let ganancia = 0, canje = 0;
    (cot.conceptos || []).forEach((x) => {
      const v = (Number(x.cant) || 1) * (Number(x.valor) || 0);
      if (!v) return;
      if (CONCEPTOS_GANANCIA.includes(x.desc)) ganancia += v;
      else if (CONCEPTOS_CANJE.includes(x.desc)) canje += v;
      else ganancia += v; // conceptos personalizados se asumen ganancia
    });
    return { ganancia, canje };
  }
  /* ---------- componentes visuales ---------- */
  function Logo({ dark, alto }) {
    return (
      <div style={{display:"flex", alignItems:"center", gap:10}}>
        <div style={{background:"#fff", borderRadius:8, padding: dark ? "5px 9px" : 0, display:"flex"}}>
          <img src={LOGO} alt="MoviGestión Luz" style={{height: alto || 30, display:"block"}} />
        </div>
        <div style={{color: dark ? "#fff" : NAVY, fontWeight:800, fontSize:15, letterSpacing:".02em"}}>Finanzas</div>
      </div>
    );
  }
  function Campo({ label, children }) {
    return (<div style={{marginBottom:12}}><label style={S.label}>{label}</label>{children}</div>);
  }
  function Sec({ titulo, children, extra }) {
    return (
      <div style={{...S.card, marginBottom:16}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, paddingBottom:8, borderBottom:"1.5px solid #EEF1F7"}}>
          <div style={{fontWeight:800, color:NAVY, fontSize:15.5}}>{titulo}</div>
          {extra}
        </div>
        {children}
      </div>
    );
  }
  function Shell({ children, vista, setVista, onSalir, toast }) {
    const NavBtn = ({ v, label }) => (
      <button onClick={()=>setVista(v)} style={{
        background: vista===v ? BLUE : "transparent", color: vista===v ? "#fff" : "#C7D6F0",
        border:"none", padding:"11px 18px", borderRadius:10, fontWeight:800, fontSize:14.5, cursor:"pointer"}}>{label}</button>
    );
    return (
      <div style={{minHeight:"100vh", background:"#F4F6FA", fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
        <div style={{background:NAVY, padding:"16px clamp(20px,4vw,48px)", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:12, position:"sticky", top:0, zIndex:10, boxShadow:"0 2px 12px rgba(10,30,66,.18)"}}>
          <Logo dark alto={34} />
          <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
            <NavBtn v="panel" label="Panel" />
            <NavBtn v="movimientos" label="Registrar" />
            <NavBtn v="resumen" label="Movimientos" />
            <NavBtn v="arqueo" label="Arqueo" />
            {TABLA_CAJA === "caja_state" && <NavBtn v="tramites" label="Desde trámites" />}
            <NavBtn v="informe" label="Informe" />
            <button onClick={onSalir} style={{background:"transparent", border:"1.5px solid #3A5588", color:"#C7D6F0", padding:"10px 16px", borderRadius:10, fontSize:14, fontWeight:700, cursor:"pointer"}}>Salir</button>
          </div>
        </div>
        <div style={{maxWidth:1180, margin:"0 auto", padding:"28px clamp(16px,3vw,36px)"}}>{children}</div>
        {toast && <div style={{position:"fixed", bottom:22, left:"50%", transform:"translateX(-50%)", background:NAVY, color:"#fff", padding:"12px 22px", borderRadius:12, fontWeight:700, fontSize:14, boxShadow:"0 6px 20px rgba(10,30,66,.3)", zIndex:50, maxWidth:"90vw", textAlign:"center"}}>{toast}</div>}
      </div>
    );
  }
  /* ============================ APP ============================ */
  function CajaRoot() {
    const [caja, setCaja] = useState({ cuentas:{}, movimientos:[], arqueos:[], config:{ cuentas: CUENTAS_DEF } });
    const [tramitesDb, setTramitesDb] = useState({ cotizaciones: [] });
    const [cargando, setCargando] = useState(true);
    const [vista, setVista] = useState("panel");
    const [pin, setPin] = useState("");
    const [errPin, setErrPin] = useState("");
    const [toast, setToast] = useState("");

    // formulario de movimiento
    const [movTipo, setMovTipo] = useState("ingreso"); // ingreso | egreso | transferencia
    const [movCuenta, setMovCuenta] = useState("Efectivo");
    const [movCuentaDest, setMovCuentaDest] = useState("Nequi");
    const [movMonto, setMovMonto] = useState("");
    const [movCat, setMovCat] = useState(CAT_INGRESO[0]);
    const [movNota, setMovNota] = useState("");
    const [movFecha, setMovFecha] = useState(hoy());
    const [filtroFecha, setFiltroFecha] = useState("");

    const notificar = (m) => { setToast(m); setTimeout(()=>setToast(""), 3000); };
    useEffect(() => { cargar(); }, []);

    async function cargar() {
      // salvavidas: pase lo que pase, la app arranca en 6 segundos
      const salvavidas = setTimeout(()=> setCargando(false), 6000);
      const conTimeout = (promesa, ms) => Promise.race([promesa, new Promise((res)=>setTimeout(()=>res({ data:null, error:"timeout" }), ms))]);
      if (sb) {
        // caja / finanzas
        try {
          const r1 = await conTimeout(sb.from(TABLA_CAJA).select("data").eq("id",1).single(), 5000);
          if (r1 && r1.data && r1.data.data) setCaja(normalizarCaja(r1.data.data));
        } catch (e) { /* tabla nueva o sin datos */ }
        // trámites (solo aplica para la caja de la empresa; en finanzas personales queda vacío y no molesta)
        try {
          const r2 = await conTimeout(sb.from("app_state").select("data").eq("id",1).single(), 5000);
          if (r2 && r2.data && r2.data.data) setTramitesDb(r2.data.data);
        } catch (e) { /* sin datos */ }
        // realtime (si falla, no bloquea)
        try {
          sb.channel(TABLA_CAJA + "-rt")
            .on("postgres_changes", { event:"*", schema:"public", table:TABLA_CAJA },
              (p)=>{ if (p.new && p.new.data) setCaja(normalizarCaja(p.new.data)); })
            .on("postgres_changes", { event:"*", schema:"public", table:"app_state" },
              (p)=>{ if (p.new && p.new.data) setTramitesDb(p.new.data); })
            .subscribe();
        } catch (e) {}
      } else {
        try { const r = localStorage.getItem(TABLA_CAJA + "-v1"); if (r) setCaja(normalizarCaja(JSON.parse(r))); } catch(e) {}
        try { const r = localStorage.getItem("movigestion-luz-v1"); if (r) setTramitesDb(JSON.parse(r)); } catch(e) {}
      }
      clearTimeout(salvavidas);
      setCargando(false);
    }
    function normalizarCaja(c) {
      return { cuentas: c.cuentas || {}, movimientos: c.movimientos || [], arqueos: c.arqueos || [],
        config: { cuentas: (c.config && c.config.cuentas) || CUENTAS_DEF } };
    }
    async function guardar(nueva) {
      setCaja(nueva);
      if (sb) { try { await sb.from(TABLA_CAJA).upsert({ id:1, data:nueva }); } catch(e){ notificar("Error al sincronizar"); } }
      else { try { localStorage.setItem(TABLA_CAJA + "-v1", JSON.stringify(nueva)); } catch(e){} }
    }

    const cuentas = (caja.config && caja.config.cuentas) || CUENTAS_DEF;

    /* saldos calculados a partir de los movimientos + aportes base */
    const saldos = useMemo(() => {
      const s = {}; cuentas.forEach((c)=> s[c] = Number(caja.cuentas[c] || 0));
      (caja.movimientos || []).forEach((m) => {
        if (m.tipo === "ingreso") s[m.cuenta] = (s[m.cuenta]||0) + Number(m.monto);
        else if (m.tipo === "egreso") s[m.cuenta] = (s[m.cuenta]||0) - Number(m.monto);
        else if (m.tipo === "transferencia") {
          s[m.cuenta] = (s[m.cuenta]||0) - Number(m.monto);
          s[m.cuentaDest] = (s[m.cuentaDest]||0) + Number(m.monto);
        }
      });
      return s;
    }, [caja, cuentas]);

    const totalDisponible = useMemo(()=> Object.values(saldos).reduce((a,b)=>a+b,0), [saldos]);
    /* dinero en proceso (canje) y utilidad, calculados desde los trámites */
    const resumenTramites = useMemo(() => {
      const cots = (tramitesDb.cotizaciones || []).filter((c)=> c.modo !== "cotizacion");
      let canjeCobrado = 0, gananciaCobrada = 0, saldoPorCobrar = 0, canjeTotal = 0, gananciaTotal = 0;
      const registrados = new Set((caja.movimientos||[]).filter(m=>m.tramiteId).map(m=>m.tramiteId));
      const pagadosATransitoPorTramite = new Set((caja.movimientos||[]).filter(m=>m.tramiteId && m.categoria==="Pago a tránsito (canje)").map(m=>m.tramiteId));
      const pendientesRegistrar = [];
      const tramitesActivosPendientesTransito = [];
      cots.forEach((c) => {
        const { ganancia, canje } = clasificarCotizacion(c);
        const total = ganancia + canje;
        const abono = (Number(c.abonoEfectivo)||0) + (Number(c.abonoTransferencia)||0);
        canjeTotal += canje; gananciaTotal += ganancia;
        saldoPorCobrar += Math.max(0, total - abono);
        // proporción cobrada
        const prop = total > 0 ? Math.min(1, abono/total) : 0;
        canjeCobrado += canje * prop;
        gananciaCobrada += ganancia * prop;
        if (abono > 0 && !registrados.has(c.id)) pendientesRegistrar.push({ c, ganancia, canje, abono });
        // trámites activos (no entregados) que ya cobraron canje pero aún no se ha pagado a tránsito
        if (!ESTADOS_RESUELTOS.includes(c.estado) && canje > 0 && abono > 0 && !pagadosATransitoPorTramite.has(c.id)) {
          tramitesActivosPendientesTransito.push({ c, canjePendiente: canje * prop });
        }
      });
      return { canjeCobrado, gananciaCobrada, saldoPorCobrar, canjeTotal, gananciaTotal, pendientesRegistrar, tramitesActivosPendientesTransito, totalTramites: cots.length };
    }, [tramitesDb, caja]);

    /* dinero en proceso = canje cobrado que aún no se ha pagado a tránsito */
    const pagadoATransito = useMemo(()=>
      (caja.movimientos||[]).filter(m=> m.categoria === "Pago a tránsito (canje)").reduce((a,m)=>a+Number(m.monto),0),
    [caja]);
    const dineroEnProceso = Math.max(0, resumenTramites.canjeCobrado - pagadoATransito);
    const utilidadReal = resumenTramites.gananciaCobrada;

    function agregarMovimiento() {
      const monto = Number(soloNum(movMonto));
      if (!monto) { notificar("Escribe un monto válido"); return; }
      let origen = movCuenta, destino = movCuentaDest, categoria = movCat;
      if (movTipo === "transferencia") {
        if (movCat === "Retirar dinero de banco") { destino = "Efectivo"; if (origen === "Efectivo") origen = cuentas.find(c=>c!=="Efectivo"); }
        else if (movCat === "Consignar dinero a banco") { origen = "Efectivo"; if (destino === "Efectivo") destino = cuentas.find(c=>c!=="Efectivo"); }
        if (origen === destino) { notificar("El origen y el destino no pueden ser iguales"); return; }
      }
      const mov = { id: uid(), tipo: movTipo, cuenta: origen,
        cuentaDest: movTipo==="transferencia" ? destino : null,
        monto, categoria: movTipo==="transferencia" ? categoria : movCat,
        nota: movNota.trim(), fecha: movFecha, creado: ahora() };
      guardar({ ...caja, movimientos: [mov, ...caja.movimientos] });
      setMovMonto(""); setMovNota("");
      notificar("Movimiento registrado");
    }
    function eliminarMovimiento(id) {
      if (!window.confirm("¿Eliminar este movimiento?")) return;
      guardar({ ...caja, movimientos: caja.movimientos.filter(m=>m.id!==id) });
    }

    /* registrar el abono de un trámite como movimiento(s) de caja */
    function registrarAbonoTramite(item, bancoTransfer) {
      const { c } = item;
      const efe = Number(c.abonoEfectivo)||0, tra = Number(c.abonoTransferencia)||0;
      const info = { numero: c.numero, placa: c.vehiculo.placa, cliente: c.cliente.nombre, tipo: (c.tramite && c.tramite.tipo) || "Trámite" };
      const movs = [];
      if (efe > 0) movs.push({ id: uid(), tipo:"ingreso", cuenta:"Efectivo", cuentaDest:null, monto: efe,
        categoria:"Abono de trámite", nota:`${c.numero} · ${c.vehiculo.placa} (efectivo)`, fecha: hoy(), creado: ahora(), tramiteId: c.id, tramiteInfo: info });
      if (tra > 0) movs.push({ id: uid(), tipo:"ingreso", cuenta: bancoTransfer || "Nequi", cuentaDest:null, monto: tra,
        categoria:"Abono de trámite", nota:`${c.numero} · ${c.vehiculo.placa} (${bancoTransfer || "transferencia"})`, fecha: hoy(), creado: ahora(), tramiteId: c.id, tramiteInfo: info });
      guardar({ ...caja, movimientos: [...movs, ...caja.movimientos] });
      notificar(`Abono de ${c.numero} registrado en caja`);
    }

    const movsFiltrados = useMemo(()=>{
      let ms = caja.movimientos || [];
      if (filtroFecha) ms = ms.filter(m=>m.fecha === filtroFecha);
      return ms;
    }, [caja, filtroFecha]);

    const totalesDia = useMemo(()=>{
      const f = filtroFecha || hoy();
      const ms = (caja.movimientos||[]).filter(m=>m.fecha===f);
      const ing = ms.filter(m=>m.tipo==="ingreso").reduce((a,m)=>a+Number(m.monto),0);
      const egr = ms.filter(m=>m.tipo==="egreso").reduce((a,m)=>a+Number(m.monto),0);
      // canje y utilidad del día: se calcula de los abonos de trámite registrados ese día
      let canje = 0, utilidad = 0;
      ms.filter(m=>m.tramiteId && m.tipo==="ingreso").forEach((m)=>{
        const cot = (tramitesDb.cotizaciones||[]).find(c=>c.id===m.tramiteId);
        if (!cot) return;
        const { ganancia, canje: cj } = clasificarCotizacion(cot);
        const total = ganancia + cj;
        if (total<=0) return;
        utilidad += m.monto * (ganancia/total);
        canje += m.monto * (cj/total);
      });
      return { ing, egr, neto: ing-egr, canje, utilidad, fecha:f };
    }, [caja, filtroFecha, tramitesDb]);

    function guardarSaldoInicial(cuenta, valor) {
      const n = Number(soloNum(valor)) || 0;
      guardar({ ...caja, cuentas: { ...caja.cuentas, [cuenta]: n } });
    }
    function guardarConfigNum(campo, valor) {
      const n = Number(soloNum(valor)) || 0;
      guardar({ ...caja, config: { ...caja.config, [campo]: n } });
    }
    const metaUtilidad = Number((caja.config && caja.config.metaUtilidad) || 0);
    const alertaEfectivo = Number((caja.config && caja.config.alertaEfectivo) || 0);
    const utilidadMesActual = useMemo(()=>{
      const mesActual = hoy().slice(0,7);
      let u = 0;
      (caja.movimientos||[]).filter(m=>m.tramiteId && m.tipo==="ingreso" && (m.fecha||"").slice(0,7)===mesActual).forEach((m)=>{
        const cot=(tramitesDb.cotizaciones||[]).find(c=>c.id===m.tramiteId); if(!cot) return;
        const {ganancia,canje:cj}=clasificarCotizacion(cot); const t=ganancia+cj; if(t<=0) return;
        u += m.monto*(ganancia/t);
      });
      return u;
    }, [caja, tramitesDb]);

    const salir = () => { if (onSalirCaja) onSalirCaja(); };
    if (cargando) return <div style={{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"#F4F6FA", fontFamily:"'Segoe UI',system-ui,sans-serif", color:NAVY, fontWeight:700}}>Cargando {TITULO_APP}…</div>;

    /* ================= PANEL ================= */
    if (vista === "panel") {
      const Kpi = ({ label, valor, color, sub, icon }) => (
        <div style={{...S.card, padding:"18px 20px", display:"flex", flexDirection:"column", gap:10}}>
          <div style={{width:38, height:38, borderRadius:12, background:(color||NAVY)+"1A", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18}}>{icon || "💰"}</div>
          <div>
            <div style={{fontSize:12, fontWeight:700, color:"#5A6478", textTransform:"uppercase", letterSpacing:".05em"}}>{label}</div>
            <div style={{fontSize:24, fontWeight:900, color: color || NAVY, marginTop:3}}>{valor}</div>
            {sub && <div style={{fontSize:12, color:"#5A6478", marginTop:2}}>{sub}</div>}
          </div>
        </div>
      );
      return (
        <Shell vista={vista} setVista={setVista} onSalir={salir} toast={toast}>
          <div style={{background:`linear-gradient(135deg, ${NAVY} 0%, #163a6e 55%, #0F2A54 100%)`, borderRadius:22, padding:"24px 26px", marginBottom:18, position:"relative", overflow:"hidden", boxShadow:"0 10px 28px rgba(10,30,66,.24)"}}>
            <div style={{position:"absolute", width:200, height:200, borderRadius:"50%", background:"radial-gradient(circle, rgba(255,255,255,.08), transparent 70%)", top:-80, right:-50}} />
            <div style={{position:"relative", color:"#9DB4DE", fontSize:13, fontWeight:600}}>{TITULO_APP} · disponible libre</div>
            <div style={{position:"relative", color:"#fff", fontSize:36, fontWeight:900, marginTop:4}}>{fmt(Math.max(0, totalDisponible - dineroEnProceso))}</div>
            <div style={{position:"relative", display:"flex", gap:20, marginTop:16, flexWrap:"wrap"}}>
              <div><div style={{color:"#9DB4DE", fontSize:11, fontWeight:700, textTransform:"uppercase"}}>Total en caja</div><div style={{color:"#fff", fontSize:17, fontWeight:800, marginTop:2}}>{fmt(totalDisponible)}</div></div>
              <div style={{width:1, background:"rgba(255,255,255,.15)"}} />
              <div><div style={{color:"#C9A24B", fontSize:11, fontWeight:700, textTransform:"uppercase"}}>En canje</div><div style={{color:"#fff", fontSize:17, fontWeight:800, marginTop:2}}>{fmt(dineroEnProceso)}</div></div>
            </div>
          </div>
          <h2 style={{...S.h2, fontSize:20, marginBottom:16}}>Detalle</h2>

          <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(200px,1fr))", gap:14, marginBottom:18}}>
            <Kpi label="Total disponible" valor={fmt(totalDisponible)} color={NAVY} sub="Suma de todas las cuentas" icon="🏦" />
            <Kpi label="Dinero en proceso (canje)" valor={fmt(dineroEnProceso)} color={PURPLE} sub="Reservado para pagar a tránsito" icon="🔄" />
            <Kpi label="Disponible libre" valor={fmt(Math.max(0, totalDisponible - dineroEnProceso))} color={GREEN} sub="Lo que no está comprometido" icon="✅" />
            <Kpi label="Utilidad de trámites" valor={fmt(utilidadReal)} color={GOLD} sub="Honorarios + papelería + improntas cobrados" icon="⭐" />
          </div>

          {alertaEfectivo > 0 && (saldos["Efectivo"]||0) < alertaEfectivo && <div style={{...S.card, marginBottom:16, borderLeft:"4px solid "+RED, background:"#FDF3F1"}}>
            <div style={{fontWeight:800, color:RED}}>⚠ Efectivo bajo</div>
            <div style={{fontSize:13.5, color:"#5A6478", marginTop:2}}>Tienes {fmt(saldos["Efectivo"]||0)} en efectivo, por debajo del mínimo de {fmt(alertaEfectivo)} que configuraste. Puede que no alcance para pagar trámites en tránsito.</div>
          </div>}

          <Sec titulo="Saldo por cuenta">
            <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(210px,1fr))", gap:12}}>
              {cuentas.map((c)=>{
                const col = COLOR_CUENTA[c] || BLUE;
                return (
                <div key={c} style={{borderRadius:18, padding:"18px 20px", background:`linear-gradient(135deg, ${col}, ${col}CC)`, position:"relative", overflow:"hidden", minHeight:96, boxShadow:"0 8px 20px "+col+"40"}}>
                  <div style={{position:"absolute", width:120, height:120, borderRadius:"50%", background:"rgba(255,255,255,.12)", top:-60, right:-40}} />
                  <div style={{position:"relative"}}>
                    <div style={{display:"flex", alignItems:"center", gap:8}}>
                      <span style={{fontSize:17}}>{ICONO_CUENTA[c]||"💳"}</span>
                      <span style={{fontSize:12.5, fontWeight:700, color:"rgba(255,255,255,.9)", textTransform:"uppercase", letterSpacing:".05em"}}>{c}</span>
                    </div>
                    <div style={{fontSize:23, fontWeight:900, color:"#fff", marginTop:8}}>{fmt(saldos[c]||0)}</div>
                  </div>
                </div>);
              })}
            </div>
            <details style={{marginTop:14}}>
              <summary style={{fontSize:13.5, color:BLUE, fontWeight:700, cursor:"pointer"}}>Ajustar saldo inicial de cada cuenta</summary>
              <div style={{fontSize:13, color:"#5A6478", margin:"10px 0"}}>El saldo inicial es el dinero que ya había en cada cuenta antes de empezar a usar la app. Los movimientos se suman o restan sobre este.</div>
              <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(200px,1fr))", gap:12}}>
                {cuentas.map((c)=>(
                  <div key={c}>
                    <label style={S.label}>{c} — saldo inicial</label>
                    <input inputMode="numeric" style={{...S.input, textAlign:"right", fontWeight:700}} value={miles(caja.cuentas[c]||"")} placeholder="0"
                      onChange={(e)=>guardarSaldoInicial(c, e.target.value)} />
                  </div>
                ))}
              </div>
            </details>
          </Sec>

          <Sec titulo={"Movimiento del día · " + totalesDia.fecha}>
            <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(140px,1fr))", gap:12}}>
              <div><div style={S.label}>Ingresos</div><div style={{fontSize:22, fontWeight:900, color:GREEN}}>{fmt(totalesDia.ing)}</div></div>
              <div><div style={S.label}>Egresos</div><div style={{fontSize:22, fontWeight:900, color:RED}}>{fmt(totalesDia.egr)}</div></div>
              <div><div style={S.label}>Neto del día</div><div style={{fontSize:22, fontWeight:900, color: totalesDia.neto<0?RED:NAVY}}>{fmt(totalesDia.neto)}</div></div>
              <div><div style={S.label}>Canje del día</div><div style={{fontSize:22, fontWeight:900, color:PURPLE}}>{fmt(totalesDia.canje)}</div></div>
              <div><div style={S.label}>Utilidad del día</div><div style={{fontSize:22, fontWeight:900, color:GOLD}}>{fmt(totalesDia.utilidad)}</div></div>
            </div>
          </Sec>

          {resumenTramites.pendientesRegistrar.length > 0 && <div style={{...S.card, marginBottom:16, borderLeft:"4px solid "+BLUE}}>
            <div style={{fontWeight:800, color:NAVY, marginBottom:6}}>Hay {resumenTramites.pendientesRegistrar.length} abono(s) de trámites sin registrar en caja</div>
            <div style={{fontSize:13.5, color:"#5A6478", marginBottom:10}}>Puedes ingresarlos automáticamente desde la sección “Desde trámites”.</div>
            <button style={S.btnP} onClick={()=>setVista("tramites")}>Ver pendientes</button>
          </div>}

          <Sec titulo="Últimos movimientos" extra={<button style={{...S.btnS, padding:"8px 14px"}} onClick={()=>setVista("resumen")}>Ver todos</button>}>
            {(caja.movimientos||[]).length===0 && <div style={{color:"#9AA3B2", fontSize:14}}>Aún no hay movimientos registrados.</div>}
            {(caja.movimientos||[]).slice(0,10).map((m)=>(<FilaMovimiento key={m.id} m={m} onEliminar={eliminarMovimiento} />))}
          </Sec>

          <Sec titulo="Meta de utilidad del mes">
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8, flexWrap:"wrap", gap:8}}>
              <div style={{fontSize:14, color:"#5A6478"}}>Utilidad de este mes: <b style={{color:GOLD}}>{fmt(utilidadMesActual)}</b>{metaUtilidad>0 && <> de <b>{fmt(metaUtilidad)}</b></>}</div>
              {metaUtilidad>0 && <b style={{color: utilidadMesActual>=metaUtilidad?GREEN:NAVY}}>{Math.min(100, Math.round(utilidadMesActual/metaUtilidad*100))}%</b>}
            </div>
            {metaUtilidad>0 && <div style={{background:"#EEF1F7", borderRadius:8, height:10, overflow:"hidden"}}>
              <div style={{width:Math.min(100, utilidadMesActual/metaUtilidad*100)+"%", height:"100%", background: utilidadMesActual>=metaUtilidad?GREEN:GOLD}} />
            </div>}
            <details style={{marginTop:12}}>
              <summary style={{fontSize:13, color:BLUE, fontWeight:700, cursor:"pointer"}}>Configurar meta y alertas</summary>
              <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(200px,1fr))", gap:12, marginTop:10}}>
                <div><label style={S.label}>Meta de utilidad mensual</label>
                  <input inputMode="numeric" style={{...S.input, textAlign:"right", fontWeight:700}} value={miles(caja.config?.metaUtilidad||"")} placeholder="0" onChange={(e)=>guardarConfigNum("metaUtilidad", e.target.value)} /></div>
                <div><label style={S.label}>Alertar si Efectivo baja de</label>
                  <input inputMode="numeric" style={{...S.input, textAlign:"right", fontWeight:700}} value={miles(caja.config?.alertaEfectivo||"")} placeholder="0" onChange={(e)=>guardarConfigNum("alertaEfectivo", e.target.value)} /></div>
              </div>
            </details>
          </Sec>
        </Shell>
      );
    }
    /* ================= MOVIMIENTOS ================= */
    if (vista === "movimientos") {
      const cats = movTipo === "ingreso" ? CAT_INGRESO : movTipo === "egreso" ? CAT_EGRESO : CAT_TRANSFER;
      const TipoBtn = ({ v, label, color }) => (
        <button onClick={()=>{ setMovTipo(v); setMovCat((v==="ingreso"?CAT_INGRESO:v==="egreso"?CAT_EGRESO:CAT_TRANSFER)[0]); }}
          style={{flex:1, padding:"12px", borderRadius:10, border:"2px solid "+(movTipo===v?color:"#E0E5EE"),
            background: movTipo===v ? color : "#fff", color: movTipo===v ? "#fff" : "#5A6478", fontWeight:800, fontSize:14.5, cursor:"pointer"}}>{label}</button>
      );
      // en retiro: banco -> efectivo; en consignar: efectivo -> banco
      const bancos = cuentas.filter((c)=>c!=="Efectivo");
      const esRetiro = movTipo==="transferencia" && movCat==="Retirar dinero de banco";
      const esConsignar = movTipo==="transferencia" && movCat==="Consignar dinero a banco";
      return (
        <Shell vista={vista} setVista={setVista} onSalir={salir} toast={toast}>
          <h2 style={{...S.h2, fontSize:26, marginBottom:16}}>Movimientos</h2>
          <Sec titulo="Registrar movimiento">
            <div style={{display:"flex", gap:8, marginBottom:14}}>
              <TipoBtn v="ingreso" label="Ingreso" color={GREEN} />
              <TipoBtn v="egreso" label="Egreso" color={RED} />
              <TipoBtn v="transferencia" label="Transferencia" color={BLUE} />
            </div>
            {movTipo==="transferencia" && <Campo label="Tipo de transferencia">
              <select style={S.input} value={movCat} onChange={(e)=>setMovCat(e.target.value)}>
                {CAT_TRANSFER.map((c)=><option key={c}>{c}</option>)}
              </select>
            </Campo>}
            <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(200px,1fr))", gap:"0 14px"}}>
              {movTipo!=="transferencia" && <Campo label="Cuenta">
                <select style={S.input} value={movCuenta} onChange={(e)=>setMovCuenta(e.target.value)}>
                  {cuentas.map((c)=><option key={c}>{c}</option>)}
                </select>
              </Campo>}
              {movTipo==="transferencia" && <Campo label={esRetiro ? "Banco de origen" : esConsignar ? "Sale de Efectivo" : "Desde la cuenta"}>
                {esConsignar
                  ? <input style={{...S.input, background:"#F4F6FA"}} value="Efectivo" disabled />
                  : <select style={S.input} value={esRetiro ? (bancos.includes(movCuenta)?movCuenta:bancos[0]) : movCuenta} onChange={(e)=>setMovCuenta(e.target.value)}>
                      {(esRetiro ? bancos : cuentas).map((c)=><option key={c}>{c}</option>)}
                    </select>}
              </Campo>}
              {movTipo==="transferencia" && <Campo label={esConsignar ? "Banco de destino" : esRetiro ? "Entra a Efectivo" : "Hacia la cuenta"}>
                {esRetiro
                  ? <input style={{...S.input, background:"#F4F6FA"}} value="Efectivo" disabled />
                  : <select style={S.input} value={esConsignar ? (bancos.includes(movCuentaDest)?movCuentaDest:bancos[0]) : movCuentaDest} onChange={(e)=>setMovCuentaDest(e.target.value)}>
                      {(esConsignar ? bancos : cuentas).map((c)=><option key={c}>{c}</option>)}
                    </select>}
              </Campo>}
              {movTipo!=="transferencia" && <Campo label="Categoría">
                <select style={S.input} value={movCat} onChange={(e)=>setMovCat(e.target.value)}>
                  {cats.map((c)=><option key={c}>{c}</option>)}
                </select>
              </Campo>}
              <Campo label="Monto"><input inputMode="numeric" style={{...S.input, textAlign:"right", fontWeight:700}} value={miles(movMonto)} onChange={(e)=>setMovMonto(soloNum(e.target.value))} placeholder="0" /></Campo>
              <Campo label="Fecha"><input type="date" style={S.input} value={movFecha} onChange={(e)=>setMovFecha(e.target.value)} /></Campo>
            </div>
            <Campo label="Nota (opcional)"><input style={S.input} value={movNota} onChange={(e)=>setMovNota(e.target.value)} placeholder="Ej: pago de arriendo, almuerzo, etc." /></Campo>
            <button style={S.btnP} onClick={agregarMovimiento}>Registrar {movTipo}</button>
          </Sec>
        </Shell>
      );
    }

    /* ================= RESUMEN DE MOVIMIENTOS ================= */
    if (vista === "resumen") {
      // agrupar por día, orden más reciente primero, y dentro del día por hora de creación
      const grupos = {};
      movsFiltrados.forEach((m)=>{ (grupos[m.fecha] = grupos[m.fecha] || []).push(m); });
      const diasOrdenados = Object.keys(grupos).sort((a,b)=> a<b?1:-1);
      return (
        <Shell vista={vista} setVista={setVista} onSalir={salir} toast={toast}>
          <h2 style={{...S.h2, fontSize:26, marginBottom:6}}>Movimientos</h2>
          <p style={{fontSize:14, color:"#5A6478", marginTop:0, marginBottom:16}}>Resumen completo, ordenado por día y hora de creación. Toca un movimiento para ver todos sus detalles.</p>
          <Sec titulo={"Todos los movimientos (" + movsFiltrados.length + ")"} extra={<input type="date" style={{...S.input, width:"auto", padding:"8px 10px"}} value={filtroFecha} onChange={(e)=>setFiltroFecha(e.target.value)} />}>
            {filtroFecha && <button style={{...S.btnS, marginBottom:12, padding:"7px 14px"}} onClick={()=>setFiltroFecha("")}>Ver todos</button>}
            {movsFiltrados.length === 0 && <div style={{color:"#9AA3B2", fontSize:14, padding:"10px 0"}}>Sin movimientos.</div>}
            {diasOrdenados.map((dia)=>(
              <div key={dia} style={{marginBottom:18}}>
                <div style={{fontSize:12.5, fontWeight:800, color:BLUE, textTransform:"uppercase", letterSpacing:".05em", margin:"6px 0 8px", paddingBottom:4, borderBottom:"1.5px solid #E8ECF3"}}>{dia}</div>
                {grupos[dia].map((m)=><FilaMovimiento key={m.id} m={m} onEliminar={eliminarMovimiento} />)}
              </div>
            ))}
          </Sec>
        </Shell>
      );
    }
    /* ================= ARQUEO ================= */
    if (vista === "arqueo") {
      return <ArqueoView caja={caja} cuentas={cuentas} saldos={saldos} guardar={guardar} notificar={notificar} Shell={Shell} vista={vista} setVista={setVista} salir={salir} toast={toast} />;
    }

    /* ================= DESDE TRÁMITES ================= */
    if (vista === "tramites") {
      const r = resumenTramites;
      return (
        <Shell vista={vista} setVista={setVista} onSalir={salir} toast={toast}>
          <h2 style={{...S.h2, fontSize:26, marginBottom:16}}>Dinero desde los trámites</h2>
          <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(200px,1fr))", gap:14, marginBottom:18}}>
            <div style={S.card}><div style={S.label}>Utilidad cobrada</div><div style={{fontSize:24, fontWeight:900, color:GOLD}}>{fmt(r.gananciaCobrada)}</div><div style={{fontSize:12, color:"#5A6478"}}>Honorarios, papelería, improntas</div></div>
            <div style={S.card}><div style={S.label}>Canje cobrado</div><div style={{fontSize:24, fontWeight:900, color:PURPLE}}>{fmt(r.canjeCobrado)}</div><div style={{fontSize:12, color:"#5A6478"}}>Para pagar a tránsito</div></div>
            <div style={S.card}><div style={S.label}>Pagado a tránsito</div><div style={{fontSize:24, fontWeight:900, color:NAVY}}>{fmt(pagadoATransito)}</div></div>
            <div style={S.card}><div style={S.label}>Falta pagar a tránsito</div><div style={{fontSize:24, fontWeight:900, color: dineroEnProceso>0?PURPLE:GREEN}}>{fmt(dineroEnProceso)}</div></div>
            <div style={S.card}><div style={S.label}>Saldo por cobrar a clientes</div><div style={{fontSize:24, fontWeight:900, color:RED}}>{fmt(r.saldoPorCobrar)}</div></div>
          </div>

          <Sec titulo={"Abonos sin registrar en caja ("+r.pendientesRegistrar.length+")"}>
            {r.pendientesRegistrar.length === 0 && <div style={{color:"#9AA3B2", fontSize:14}}>Todos los abonos ya están registrados en la caja.</div>}
            {r.pendientesRegistrar.map((it)=>(
              <FilaAbono key={it.c.id} it={it} cuentas={cuentas} onRegistrar={registrarAbonoTramite} />
            ))}
          </Sec>

          <Sec titulo={"Trámites activos con canje pendiente de pagar a tránsito ("+r.tramitesActivosPendientesTransito.length+")"}>
            {r.tramitesActivosPendientesTransito.length === 0 && <div style={{color:"#9AA3B2", fontSize:14}}>No hay trámites en curso con dinero de canje sin pagar a tránsito.</div>}
            {r.tramitesActivosPendientesTransito.map((it)=>(
              <div key={it.c.id} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"10px 0", borderBottom:"1px solid #EEF1F7", gap:10, flexWrap:"wrap"}}>
                <div>
                  <div style={{fontWeight:700, color: onVerTramite?BLUE:NAVY, cursor: onVerTramite?"pointer":"default", textDecoration: onVerTramite?"underline":"none"}} onClick={()=>onVerTramite && onVerTramite(it.c.id)}>{it.c.numero} · {it.c.vehiculo.placa}</div>
                  <div style={{fontSize:12.5, color:"#5A6478"}}>{it.c.estado}</div>
                </div>
                <div style={{fontWeight:900, color:PURPLE, fontSize:15}}>{fmt(it.canjePendiente)}</div>
              </div>
            ))}
            {r.tramitesActivosPendientesTransito.length > 0 && <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", paddingTop:12, marginTop:4, borderTop:"2px solid "+NAVY}}>
              <b style={{color:NAVY}}>Total pendiente de pagar a tránsito</b>
              <b style={{color:PURPLE, fontSize:17}}>{fmt(r.tramitesActivosPendientesTransito.reduce((a,it)=>a+it.canjePendiente,0))}</b>
            </div>}
          </Sec>

          <div style={{...S.card, background:"#F7F9FC"}}>
            <div style={{fontWeight:800, color:NAVY, marginBottom:8}}>¿Cómo se clasifica el dinero de un trámite?</div>
            <div style={{fontSize:13.5, color:"#5A6478", lineHeight:1.7}}>
              <b style={{color:GOLD}}>Utilidad (de ustedes):</b> {CONCEPTOS_GANANCIA.join(", ")}.<br/>
              <b style={{color:PURPLE}}>Canje (pasa a tránsito):</b> {CONCEPTOS_CANJE.join(", ")}.<br/>
              El dinero en proceso es el canje que ya cobraron pero aún no han pagado a tránsito.
            </div>
          </div>
        </Shell>
      );
    }

    /* ================= INFORME MENSUAL ================= */
    if (vista === "informe") {
      return <InformeView caja={caja} cuentas={cuentas} tramitesDb={tramitesDb} notificar={notificar} Shell={Shell} vista={vista} setVista={setVista} salir={salir} toast={toast} />;
    }

    return null;
  }

  /* ================= FILA DE ABONO PENDIENTE ================= */
  function FilaMovimiento({ m, onEliminar }) {
    const [abierto, setAbierto] = useState(false);
    const color = colorMovimiento(m);
    const signo = m.tipo==="ingreso" ? "+" : m.tipo==="egreso" ? "−" : "↔";
    const etiquetaTipo = m.tipo==="ingreso" ? "Ingreso" : m.tipo==="egreso" ? "Egreso" : "Transferencia";
    return (
      <div style={{borderBottom:"1px solid #EEF1F7"}}>
        <div onClick={()=>setAbierto(!abierto)} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"11px 0", gap:10, cursor:"pointer"}}>
          <div style={{minWidth:0}}>
            <div style={{fontWeight:700, color:NAVY, fontSize:14.5}}>
              {m.tipo==="transferencia" ? `${m.cuenta} → ${m.cuentaDest}` : `${m.categoria}`}
            </div>
            <div style={{fontSize:12.5, color:"#5A6478", marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>
              {m.tipo!=="transferencia" && <span style={{...tag("#EEF2F8","#5A6478"), fontSize:11, marginRight:6}}>{m.cuenta}</span>}
              {m.tramiteInfo && <span onClick={(e)=>{ if(onVerTramite){ e.stopPropagation(); onVerTramite(m.tramiteId); } }} style={{...tag("#EAF1FE","#1E6FEB"), fontSize:11, marginRight:6, cursor: onVerTramite?"pointer":"default", textDecoration: onVerTramite?"underline":"none"}}>{m.tramiteInfo.numero} · {m.tramiteInfo.placa}</span>}
              {m.creado || m.fecha}{m.nota ? " · "+m.nota : ""}
            </div>
          </div>
          <div style={{textAlign:"right", flexShrink:0, display:"flex", alignItems:"center", gap:8}}>
            <div style={{fontWeight:900, color, fontSize:15}}>{signo}{fmt(m.monto)}</div>
            <span style={{color:"#9AA3B2", fontSize:12}}>{abierto ? "▲" : "▼"}</span>
          </div>
        </div>
        {abierto && <div style={{background:"#F7F9FC", borderRadius:10, padding:"12px 14px", marginBottom:10, fontSize:13}}>
          <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(160px,1fr))", gap:8}}>
            <div><span style={{color:"#5A6478"}}>Tipo: </span><b>{etiquetaTipo}</b></div>
            <div><span style={{color:"#5A6478"}}>Monto: </span><b>{fmt(m.monto)}</b></div>
            {m.tipo==="transferencia" ? <>
              <div><span style={{color:"#5A6478"}}>Desde: </span><b>{m.cuenta}</b></div>
              <div><span style={{color:"#5A6478"}}>Hacia: </span><b>{m.cuentaDest}</b></div>
              <div><span style={{color:"#5A6478"}}>Movimiento: </span><b>{m.categoria}</b></div>
            </> : <>
              <div><span style={{color:"#5A6478"}}>Cuenta: </span><b>{m.cuenta}</b></div>
              <div><span style={{color:"#5A6478"}}>Categoría: </span><b>{m.categoria}</b></div>
            </>}
            <div><span style={{color:"#5A6478"}}>Fecha: </span><b>{m.fecha}</b></div>
            <div><span style={{color:"#5A6478"}}>Creado: </span><b>{m.creado || "—"}</b></div>
            {m.tramiteId && !m.tramiteInfo && <div><span style={{color:"#5A6478"}}>Origen: </span><b>Abono de trámite</b></div>}
            {m.ajuste && <div><span style={{color:"#5A6478"}}>Origen: </span><b>Ajuste de arqueo</b></div>}
          </div>
          {m.tramiteInfo && <div style={{marginTop:10, paddingTop:10, borderTop:"1px solid #E8ECF3"}}>
            <div style={{fontSize:11.5, fontWeight:800, color:BLUE, textTransform:"uppercase", letterSpacing:".05em", marginBottom:6}}>Trámite relacionado</div>
            <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(160px,1fr))", gap:8}}>
              <div><span style={{color:"#5A6478"}}>Número: </span><b>{m.tramiteInfo.numero}</b></div>
              <div><span style={{color:"#5A6478"}}>Placa: </span><b>{m.tramiteInfo.placa}</b></div>
              <div><span style={{color:"#5A6478"}}>Cliente: </span><b>{m.tramiteInfo.cliente}</b></div>
              <div><span style={{color:"#5A6478"}}>Trámite: </span><b>{m.tramiteInfo.tipo}</b></div>
            </div>
            {onVerTramite && <button onClick={(e)=>{ e.stopPropagation(); onVerTramite(m.tramiteId); }} style={{...S.btnP, padding:"9px 16px", fontSize:13, marginTop:10}}>Ver trámite completo →</button>}
          </div>}
          {m.nota && <div style={{marginTop:8, paddingTop:8, borderTop:"1px solid #E8ECF3"}}><span style={{color:"#5A6478"}}>Nota: </span>{m.nota}</div>}
          <button onClick={(e)=>{ e.stopPropagation(); onEliminar(m.id); }} style={{background:"none", border:"none", color:"#C0392B", fontSize:12.5, fontWeight:700, cursor:"pointer", padding:0, marginTop:10}}>Eliminar movimiento</button>
        </div>}
      </div>
    );
  }

  function FilaAbono({ it, cuentas, onRegistrar }) {
    const bancos = cuentas.filter((c)=> c !== "Efectivo");
    const [banco, setBanco] = useState((it.c.bancoTransferencia && bancos.includes(it.c.bancoTransferencia)) ? it.c.bancoTransferencia : (bancos[0] || "Nequi"));
    const efe = Number(it.c.abonoEfectivo)||0, tra = Number(it.c.abonoTransferencia)||0;
    return (
      <div style={{padding:"12px 0", borderBottom:"1px solid #EEF1F7"}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10, flexWrap:"wrap"}}>
          <div>
            <div style={{fontWeight:700, color: onVerTramite?BLUE:NAVY, cursor: onVerTramite?"pointer":"default", textDecoration: onVerTramite?"underline":"none"}} onClick={()=>onVerTramite && onVerTramite(it.c.id)}>{it.c.numero} · {it.c.vehiculo.placa}</div>
            <div style={{fontSize:12.5, color:"#5A6478", marginTop:2}}>
              {efe>0 && <span>Efectivo {fmt(efe)}</span>}{efe>0 && tra>0 && " · "}{tra>0 && <span>Transferencia {fmt(tra)}</span>}
            </div>
            <div style={{fontSize:12, color:"#5A6478", marginTop:2}}>Utilidad {fmt(it.ganancia)} · Canje {fmt(it.canje)}</div>
          </div>
          <div style={{display:"flex", gap:8, alignItems:"center", flexWrap:"wrap"}}>
            {tra > 0 && <select value={banco} onChange={(e)=>setBanco(e.target.value)}
              style={{...S.input, width:"auto", padding:"9px 11px", fontSize:14}}>
              {bancos.map((b)=><option key={b}>{b}</option>)}
            </select>}
            <button style={{...S.btnP, padding:"10px 16px"}} onClick={()=>onRegistrar(it, banco)}>Registrar</button>
          </div>
        </div>
        {tra > 0 && <div style={{fontSize:11.5, color:"#9AA3B2", marginTop:6}}>La transferencia de {fmt(tra)} entrará a <b>{banco}</b>.</div>}
      </div>
    );
  }

  /* ================= COMPONENTE INFORME MENSUAL ================= */
  function InformeView({ caja, cuentas, tramitesDb, notificar, Shell, vista, setVista, salir, toast }) {
    const [mes, setMes] = useState(hoy().slice(0,7)); // YYYY-MM

    const datos = useMemo(()=>{
      const movs = (caja.movimientos||[]).filter(m=> (m.fecha||"").slice(0,7) === mes);
      const ing = movs.filter(m=>m.tipo==="ingreso").reduce((a,m)=>a+Number(m.monto),0);
      const egr = movs.filter(m=>m.tipo==="egreso").reduce((a,m)=>a+Number(m.monto),0);
      // por categoría
      const porCatIng = {}, porCatEgr = {};
      movs.forEach(m=>{
        if (m.tipo==="ingreso") porCatIng[m.categoria] = (porCatIng[m.categoria]||0)+Number(m.monto);
        if (m.tipo==="egreso") porCatEgr[m.categoria] = (porCatEgr[m.categoria]||0)+Number(m.monto);
      });
      // canje / utilidad del mes (de abonos de trámite)
      let canje=0, utilidad=0;
      movs.filter(m=>m.tramiteId && m.tipo==="ingreso").forEach(m=>{
        const cot=(tramitesDb.cotizaciones||[]).find(c=>c.id===m.tramiteId); if(!cot) return;
        const {ganancia,canje:cj}=clasificarCotizacion(cot); const t=ganancia+cj; if(t<=0) return;
        utilidad += m.monto*(ganancia/t); canje += m.monto*(cj/t);
      });
      // por día (para la gráfica)
      const porDia = {};
      movs.forEach(m=>{ const d=m.fecha; if(!porDia[d]) porDia[d]={ing:0,egr:0}; if(m.tipo==="ingreso")porDia[d].ing+=Number(m.monto); if(m.tipo==="egreso")porDia[d].egr+=Number(m.monto); });
      return { movs, ing, egr, neto:ing-egr, porCatIng, porCatEgr, canje, utilidad, porDia };
    }, [caja, mes, tramitesDb]);

    const nombreMes = (()=>{ const [y,m]=mes.split("-"); const meses=["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"]; return meses[Number(m)]+" "+y; })();
    const maxDia = Math.max(1, ...Object.values(datos.porDia).map(d=>Math.max(d.ing,d.egr)));

    function generarInforme() {
      const filasCatIng = Object.entries(datos.porCatIng).map(([k,v])=>`<tr><td>${k}</td><td class=r>${fmt(v)}</td></tr>`).join("") || '<tr><td colspan=2>Sin ingresos</td></tr>';
      const filasCatEgr = Object.entries(datos.porCatEgr).map(([k,v])=>`<tr><td>${k}</td><td class=r>${fmt(v)}</td></tr>`).join("") || '<tr><td colspan=2>Sin egresos</td></tr>';
      const filasMovs = datos.movs.slice().sort((a,b)=> (a.fecha<b.fecha?1:-1)).map(m=>{
        const signo = m.tipo==="ingreso"?"+":m.tipo==="egreso"?"−":"↔";
        const desc = m.tipo==="transferencia"? `${m.cuenta} → ${m.cuentaDest}` : m.categoria;
        return `<tr><td>${m.fecha}</td><td>${m.tipo}</td><td>${desc}</td><td>${m.cuenta}</td><td>${m.nota||""}</td><td class=r>${signo}${fmt(m.monto)}</td></tr>`;
      }).join("") || '<tr><td colspan=6>Sin movimientos</td></tr>';
      const dias = Object.keys(datos.porDia).sort();
      const barras = dias.map(d=>{
        const v=datos.porDia[d]; const hi=Math.round(v.ing/maxDia*90), he=Math.round(v.egr/maxDia*90);
        return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:26px"><div style="display:flex;align-items:flex-end;gap:2px;height:100px"><div title="Ingreso ${fmt(v.ing)}" style="width:9px;height:${hi}px;background:#1B7A3D;border-radius:2px 2px 0 0"></div><div title="Egreso ${fmt(v.egr)}" style="width:9px;height:${he}px;background:#B3372A;border-radius:2px 2px 0 0"></div></div><div style="font-size:9px;color:#5A6478">${d.slice(8)}</div></div>`;
      }).join("");
      const html = `<!DOCTYPE html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Informe ${nombreMes} · MoviGestión Luz</title>
  <style>
  *{box-sizing:border-box}body{font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#0A1E42;margin:0;padding:26px;font-size:13px}
  .wrap{max-width:820px;margin:0 auto}
  .head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0A1E42;padding-bottom:14px;margin-bottom:18px}
  .head img{height:44px}h1{font-size:20px;margin:0}h2{font-size:15px;margin:22px 0 8px;border-left:4px solid #1E6FEB;padding-left:8px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
  .kpi{border:1px solid #E8ECF3;border-radius:10px;padding:12px}.kpi .l{font-size:11px;color:#5A6478;text-transform:uppercase}.kpi .v{font-size:19px;font-weight:800;margin-top:3px}
  table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:12px}
  th{background:#0A1E42;color:#fff;padding:7px 9px;text-align:left}td{padding:6px 9px;border-bottom:1px solid #E8ECF3}.r{text-align:right}
  .bar{position:sticky;top:0;background:#0A1E42;margin:-26px -26px 20px;padding:12px 20px;display:flex;gap:10px;justify-content:flex-end}
  .bar button{background:#1E6FEB;color:#fff;border:none;padding:10px 18px;border-radius:9px;font-weight:700;cursor:pointer}
  @media print{.bar{display:none}body{padding:0}}
  .chart{display:flex;gap:3px;align-items:flex-end;border:1px solid #E8ECF3;border-radius:10px;padding:14px 10px;overflow-x:auto}
  .leg{display:flex;gap:16px;font-size:11px;margin:6px 0 0}.leg span{display:inline-flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
  </style></head><body>
  <div class=bar><button onclick="window.print()">Imprimir / Guardar PDF</button></div>
  <div class=wrap>
  <div class=head><img src="${LOGO}"><div style="text-align:right"><h1>Informe financiero</h1><div style="color:#5A6478">${nombreMes} · MoviGestión Luz</div></div></div>
  <div class=kpis>
  <div class=kpi><div class=l>Ingresos</div><div class=v style="color:#1B7A3D">${fmt(datos.ing)}</div></div>
  <div class=kpi><div class=l>Egresos</div><div class=v style="color:#B3372A">${fmt(datos.egr)}</div></div>
  <div class=kpi><div class=l>Neto</div><div class=v>${fmt(datos.neto)}</div></div>
  <div class=kpi><div class=l>Utilidad trámites</div><div class=v style="color:#C9A24B">${fmt(datos.utilidad)}</div></div>
  </div>
  <div class=kpis style="grid-template-columns:repeat(2,1fr)">
  <div class=kpi><div class=l>Dinero en canje (pasa a tránsito)</div><div class=v style="color:#6B2FB3">${fmt(datos.canje)}</div></div>
  <div class=kpi><div class=l>Movimientos registrados</div><div class=v>${datos.movs.length}</div></div>
  </div>
  <h2>Ingresos y egresos por día</h2>
  <div class=chart>${barras || '<div style="color:#9AA3B2">Sin datos</div>'}</div>
  <div class=leg><span><i class=dot style="background:#1B7A3D"></i>Ingresos</span><span><i class=dot style="background:#B3372A"></i>Egresos</span></div>
  <h2>Ingresos por categoría</h2><table><thead><tr><th>Categoría</th><th class=r>Total</th></tr></thead><tbody>${filasCatIng}</tbody></table>
  <h2>Egresos por categoría</h2><table><thead><tr><th>Categoría</th><th class=r>Total</th></tr></thead><tbody>${filasCatEgr}</tbody></table>
  <h2>Detalle de movimientos (${datos.movs.length})</h2><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th>Cuenta</th><th>Nota</th><th class=r>Monto</th></tr></thead><tbody>${filasMovs}</tbody></table>
  <div style="margin-top:20px;font-size:11px;color:#5A6478;border-top:1px solid #E8ECF3;padding-top:10px">Generado el ${ahora()} · MoviGestión Luz — ${TITULO_APP}</div>
  </div></body></html>`;
      try {
        const w = window.open("", "_blank");
        if (w && w.document) { w.document.open(); w.document.write(html); w.document.close(); return; }
      } catch(e){}
      try {
        const blob = new Blob([html], {type:"text/html"}); const url=URL.createObjectURL(blob);
        const a=document.createElement("a"); a.href=url; a.download=`Informe_${mes}_MoviGestion.html`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        notificar("Informe descargado");
      } catch(e){ notificar("No se pudo generar el informe"); }
    }

    return (
      <Shell vista={vista} setVista={setVista} onSalir={salir} toast={toast}>
        <h2 style={{...S.h2, fontSize:26, marginBottom:6}}>Informe mensual</h2>
        <p style={{fontSize:14, color:"#5A6478", marginTop:0, marginBottom:16}}>Resumen del mes con totales, categorías, gráfica y detalle. Genera un informe imprimible o en PDF.</p>

        <Sec titulo="Mes del informe" extra={<input type="month" style={{...S.input, width:"auto", padding:"8px 12px"}} value={mes} onChange={(e)=>setMes(e.target.value)} />}>
          <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(150px,1fr))", gap:12, marginBottom:6}}>
            <div><div style={S.label}>Ingresos</div><div style={{fontSize:21, fontWeight:900, color:GREEN}}>{fmt(datos.ing)}</div></div>
            <div><div style={S.label}>Egresos</div><div style={{fontSize:21, fontWeight:900, color:RED}}>{fmt(datos.egr)}</div></div>
            <div><div style={S.label}>Neto</div><div style={{fontSize:21, fontWeight:900, color: datos.neto<0?RED:NAVY}}>{fmt(datos.neto)}</div></div>
            <div><div style={S.label}>Utilidad trámites</div><div style={{fontSize:21, fontWeight:900, color:GOLD}}>{fmt(datos.utilidad)}</div></div>
            <div><div style={S.label}>Canje</div><div style={{fontSize:21, fontWeight:900, color:PURPLE}}>{fmt(datos.canje)}</div></div>
          </div>
        </Sec>

        <Sec titulo={"Movimientos del mes (" + datos.movs.length + ")"}>
          {datos.movs.length===0 && <div style={{color:"#9AA3B2", fontSize:14}}>Sin movimientos en {nombreMes}.</div>}
          {datos.movs.slice().sort((a,b)=>(a.fecha<b.fecha?1:-1)).slice(0,40).map((m)=>{
            const color=colorMovimiento(m); const signo=m.tipo==="ingreso"?"+":m.tipo==="egreso"?"−":"↔";
            return (
              <div key={m.id} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"9px 0", borderBottom:"1px solid #EEF1F7", gap:10}}>
                <div style={{minWidth:0}}>
                  <div style={{fontWeight:700, color:NAVY, fontSize:14}}>{m.tipo==="transferencia"?`${m.cuenta} → ${m.cuentaDest}`:m.categoria}</div>
                  <div style={{fontSize:12, color:"#5A6478"}}>{m.fecha} · {m.cuenta}{m.nota?" · "+m.nota:""}</div>
                </div>
                <div style={{fontWeight:900, color, fontSize:14.5, flexShrink:0}}>{signo}{fmt(m.monto)}</div>
              </div>
            );
          })}
          {datos.movs.length>40 && <div style={{fontSize:12.5, color:"#5A6478", marginTop:8}}>… y {datos.movs.length-40} más. El informe completo los incluye todos.</div>}
        </Sec>

        <button style={{...S.btnP, width:"100%", fontSize:16.5, padding:"15px"}} onClick={generarInforme}>Generar informe mensual ({nombreMes})</button>
      </Shell>
    );
  }
  function ArqueoView({ caja, cuentas, saldos, guardar, notificar, Shell, vista, setVista, salir, toast }) {
    const [conteo, setConteo] = useState(()=> { const o={}; cuentas.forEach(c=>o[c]=""); return o; });
    const [nota, setNota] = useState("");
    const [ajustar, setAjustar] = useState(true);
    const [buscar, setBuscar] = useState("");

    const cuentasContadas = cuentas.filter(c=> conteo[c] !== "" && conteo[c] != null);
    const totalContado = cuentas.reduce((a,c)=> a + Number(soloNum(conteo[c])||0), 0);
    const totalSistema = cuentas.reduce((a,c)=> a + Number(saldos[c]||0), 0);
    const diferencia = totalContado - totalSistema;

    function guardarArqueo() {
      if (cuentasContadas.length === 0) { notificar("Escribe al menos una cuenta contada"); return; }
      const detalle = cuentas.map(c=>({ cuenta:c, sistema: Number(saldos[c]||0), contado: Number(soloNum(conteo[c])||0), medido: conteo[c]!=="" }));
      const arqueo = { id: uid(), fecha: hoy(), creado: ahora(), detalle, totalContado, totalSistema, diferencia, nota: nota.trim(), ajustado: ajustar };
      let nuevosMovs = [];
      if (ajustar) {
        // crea un movimiento de ajuste por cada cuenta contada con diferencia
        cuentasContadas.forEach((c)=>{
          const dif = Number(soloNum(conteo[c])||0) - Number(saldos[c]||0);
          if (dif !== 0) {
            nuevosMovs.push({ id: uid(), tipo: dif>0?"ingreso":"egreso", cuenta: c, cuentaDest:null, monto: Math.abs(dif),
              categoria: dif>0 ? "Otro ingreso" : "Egreso fortuito", nota: `Ajuste de arqueo (${dif>0?"sobrante":"faltante"})`, fecha: hoy(), creado: ahora(), ajuste:true });
          }
        });
      }
      guardar({ ...caja, arqueos: [arqueo, ...(caja.arqueos||[])], movimientos: [...nuevosMovs, ...caja.movimientos] });
      notificar(ajustar && nuevosMovs.length ? "Arqueo guardado y saldos ajustados" : "Arqueo guardado");
      const o={}; cuentas.forEach(c=>o[c]=""); setConteo(o); setNota("");
    }

    const arqueosFiltrados = (caja.arqueos||[]).filter(a=> !buscar || (a.fecha||"").includes(buscar) || (a.nota||"").toLowerCase().includes(buscar.toLowerCase()));

    return (
      <Shell vista={vista} setVista={setVista} onSalir={salir} toast={toast}>
        <h2 style={{...S.h2, fontSize:26, marginBottom:6}}>Arqueo de caja</h2>
        <p style={{fontSize:14, color:"#5A6478", marginTop:0, marginBottom:16}}>Cuenta el dinero real en cada cuenta y compáralo con el sistema. Si activas el ajuste, la app iguala los saldos automáticamente registrando el sobrante o faltante.</p>

        <Sec titulo="Conteo por cuenta">
          {cuentas.map((c)=>{
            const contado = Number(soloNum(conteo[c])||0);
            const dif = contado - Number(saldos[c]||0);
            return (
              <div key={c} style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, alignItems:"center", padding:"10px 0", borderBottom:"1px solid #EEF1F7"}}>
                <div style={{fontWeight:700, color:NAVY}}>{c}<div style={{fontSize:12, color:"#5A6478", fontWeight:400}}>Sistema: {fmt(saldos[c]||0)}</div></div>
                <input inputMode="numeric" style={{...S.input, textAlign:"right", fontWeight:700}} placeholder="Contado" value={miles(conteo[c])} onChange={(e)=>setConteo({...conteo, [c]: soloNum(e.target.value)})} />
                <div style={{textAlign:"right", fontWeight:800, fontSize:13.5, color: dif===0?GREEN: dif>0?BLUE:RED}}>{conteo[c]!==""? (dif===0?"Cuadra": (dif>0?"Sobra ":"Falta ")+fmt(Math.abs(dif))):"—"}</div>
              </div>
            );
          })}
          <div style={{background:"#F4F6FA", borderRadius:12, padding:"14px 16px", marginTop:14, display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))", gap:10}}>
            <div><div style={S.label}>Contado</div><b style={{fontSize:17}}>{fmt(totalContado)}</b></div>
            <div><div style={S.label}>Sistema</div><b style={{fontSize:17}}>{fmt(totalSistema)}</b></div>
            <div><div style={S.label}>Diferencia</div><b style={{fontSize:17, color: diferencia===0?GREEN: diferencia>0?BLUE:RED}}>{diferencia===0?"Cuadrada":(diferencia>0?"Sobra ":"Falta ")+fmt(Math.abs(diferencia))}</b></div>
          </div>
          <label style={{display:"flex", alignItems:"center", gap:8, fontSize:14, fontWeight:600, color:NAVY, margin:"14px 0 6px", cursor:"pointer"}}>
            <input type="checkbox" checked={ajustar} onChange={(e)=>setAjustar(e.target.checked)} />
            Ajustar saldos automáticamente para que cuadre (recomendado al inicio)
          </label>
          <div style={{fontSize:12.5, color:"#5A6478", marginBottom:10}}>Al activarlo, la app crea un movimiento de "sobrante" o "faltante" en cada cuenta contada para dejar el saldo igual a lo que contaste. Ideal cuando ya había dinero en las cuentas.</div>
          <Campo label="Nota del arqueo (opcional)"><input style={S.input} value={nota} onChange={(e)=>setNota(e.target.value)} placeholder="Ej: cierre del día, turno tarde…" /></Campo>
          <button style={S.btnP} onClick={guardarArqueo}>Guardar arqueo{ajustar?" y cuadrar":""}</button>
        </Sec>

        <Sec titulo="Arqueos anteriores" extra={<input style={{...S.input, width:"auto", padding:"8px 12px", maxWidth:190}} value={buscar} onChange={(e)=>setBuscar(e.target.value)} placeholder="Buscar fecha o nota" />}>
          {arqueosFiltrados.length === 0 && <div style={{color:"#9AA3B2", fontSize:14}}>{buscar ? "Sin resultados." : "Aún no hay arqueos guardados."}</div>}
          {arqueosFiltrados.slice(0,60).map((a)=>(
            <div key={a.id} style={{padding:"11px 0", borderBottom:"1px solid #EEF1F7"}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", gap:10, flexWrap:"wrap"}}>
                <div><div style={{fontWeight:700, color:NAVY, fontSize:15}}>{a.fecha}</div><div style={{fontSize:12.5, color:"#5A6478"}}>{a.creado}{a.nota?" · "+a.nota:""}{a.ajustado?" · ajustado":""}</div></div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontWeight:800}}>{fmt(a.totalContado)}</div>
                  <div style={{fontSize:12.5, fontWeight:700, color: a.diferencia===0?GREEN:a.diferencia>0?BLUE:RED}}>{a.diferencia===0?"Cuadró":(a.diferencia>0?"Sobró ":"Faltó ")+fmt(Math.abs(a.diferencia))}</div>
                </div>
              </div>
              <details style={{marginTop:6}}>
                <summary style={{fontSize:12.5, color:BLUE, fontWeight:700, cursor:"pointer"}}>Ver detalle por cuenta</summary>
                <div style={{marginTop:6}}>
                  {(a.detalle||[]).map((d)=>(
                    <div key={d.cuenta} style={{display:"flex", justifyContent:"space-between", fontSize:12.5, padding:"3px 0", color:"#5A6478"}}>
                      <span>{d.cuenta}</span><span>Sistema {fmt(d.sistema)} · Contado {fmt(d.contado)}</span>
                    </div>
                  ))}
                </div>
              </details>
            </div>
          ))}
        </Sec>
      </Shell>
    );
  }
  return <CajaRoot />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
