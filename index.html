            </div>
            <div style={{...S.card, marginBottom:14}}>
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, fontSize:14}}>
                <div><span style={S.label}>Trámite(s)</span><b style={{color:NAVY}}>{tiposTexto(c)}</b></div>
                <div><span style={S.label}>Ciudad</span>{c.ciudad}</div>
                <div><span style={S.label}>Entrega estimada</span>{c.tramite.fechaEstimada || "Por definir"}</div>
              </div>
            </div>
            {c.estado === RETENIDO && <div style={{...S.card, marginBottom:14, borderLeft:"4px solid #B3372A", background:"#FFF6F5"}}>
              <div style={{fontWeight:800, color:"#B3372A", marginBottom:6}}>Trámite retenido en tránsito</div>
              <div style={{fontSize:14, color:NAVY}}>{motivoRetencion ? motivoRetencion : "El organismo de tránsito devolvió el trámite. Tu asesor se comunicará contigo con los detalles."}</div>
            </div>}
            <div style={{...S.card, marginBottom:14}}>
              <div style={{fontWeight:800, color:NAVY, marginBottom:16}}>Progreso del trámite</div>
              {PASOS.map((e, i) => {
                const marca = c.estado === RETENIDO ? idxRetenido : idxEstado;
                const done = i < marca, actual = i === marca;
                const col = COLOR_ESTADO[e] ? COLOR_ESTADO[e].col : BLUE;
                return (
                  <div key={e} style={{display:"flex", gap:14, alignItems:"flex-start", opacity: done||actual ? 1 : .45}}>
                    <div style={{display:"flex", flexDirection:"column", alignItems:"center"}}>
                      <div style={{width:26, height:26, borderRadius:"50%", background: actual ? col : done ? "#1B7A3D" : "#DDE3EE", color:"#fff", fontSize:13, fontWeight:800, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0}}>{done ? "✓" : i+1}</div>
                      {i < PASOS.length-1 && <div style={{width:3, height:30, background: done ? "#1B7A3D" : "#DDE3EE"}} />}
                    </div>
                    <div style={{fontSize:15, fontWeight: actual ? 800 : 500, color: actual ? col : NAVY, paddingTop:3}}>{e}</div>
                  </div>
                );
              })}
              {c.estado === "Entregado" && <div style={{marginTop:10, ...tag("#E3F6E8","#1B7A3D"), display:"inline-block"}}>Trámite entregado</div>}
            </div>
            {docsFaltantes(c).length > 0 && <div style={{...S.card, marginBottom:14, borderLeft:"4px solid #E0A800"}}>
              <div style={{fontWeight:800, color:"#9A6B00", marginBottom:10}}>Documentos que faltan por entregar</div>
              <div style={{display:"grid", gap:8}}>
                {docsFaltantes(c).map((r) => (
                  <div key={r} style={{display:"flex", alignItems:"center", gap:10, fontSize:14}}>
                    <span style={{width:20, height:20, borderRadius:5, background:"#fff", border:"2px solid #E0A800", flexShrink:0}} />{r}
                  </div>
                ))}
              </div>
            </div>}
            {getObs(c).filter((o)=>o.visible).length > 0 && <div style={{...S.card, marginBottom:14}}>
              <div style={{fontWeight:800, color:NAVY, marginBottom:10}}>Pendientes y observaciones</div>
              {getObs(c).filter((o)=>o.visible).map((o) => (
                <div key={o.id} style={{display:"flex", alignItems:"center", gap:10, padding:"7px 0", borderBottom:"1px solid #EEF1F7", fontSize:14}}>
                  <span style={{width:20, height:20, borderRadius:5, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center",
                    background:o.hecho?"#1B7A3D":"#fff", border:"2px solid "+(o.hecho?"#1B7A3D":"#C9D2E2"), color:"#fff", fontSize:12, fontWeight:800}}>{o.hecho?"✓":""}</span>
                  <span style={{textDecoration:o.hecho?"line-through":"none", color:o.hecho?"#9AA3B2":NAVY}}>{o.texto}</span>
                </div>
              ))}
            </div>}
            {c.tramite.docsPendientes && <div style={{...S.card, marginBottom:14, borderLeft:"4px solid #E0A800"}}>
              <div style={{fontWeight:800, color:"#9A6B00", marginBottom:6}}>Nota adicional</div>
              <div style={{fontSize:14, whiteSpace:"pre-wrap"}}>{c.tramite.docsPendientes}</div>
            </div>}
            <div style={{...S.card, marginBottom:14}}>
              <div style={{fontWeight:800, color:NAVY, marginBottom:10}}>Pagos</div>
              <div style={{display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:6}}><span>Total del trámite</span><b>{fmt(t.total)}</b></div>
              <div style={{display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:6}}><span>Abonado</span><b style={{color:"#1B7A3D"}}>{fmt(t.abono)}</b></div>
              <div style={{display:"flex", justifyContent:"space-between", fontSize:15, borderTop:"1px solid #E8ECF3", paddingTop:8}}><b>Saldo pendiente</b><b style={{color: t.saldo>0 ? "#B3372A" : "#1B7A3D"}}>{fmt(t.saldo)}</b></div>
            </div>
            {c.historial.filter((h)=>h.visible && h.obs).length > 0 && <div style={{...S.card, marginBottom:14}}>
              <div style={{fontWeight:800, color:NAVY, marginBottom:10}}>Novedades</div>
              {c.historial.filter((h)=>h.visible && h.obs).slice().reverse().map((h, i) => (
                <div key={i} style={{borderBottom:"1px solid #EEF1F7", padding:"8px 0", fontSize:13.5}}>
                  <div style={{color:"#5A6478", fontSize:12}}>{h.fecha} · {h.a}</div>
                  <div>{h.obs}</div>
                </div>
              ))}
            </div>}
            <a href={`https://wa.me/${WHATSAPP}?text=${encodeURIComponent("Hola, consulto por mi trámite "+c.numero+" (placa "+c.vehiculo.placa+").")}`} target="_blank" rel="noreferrer"
              style={{...S.btnP, display:"block", textAlign:"center", textDecoration:"none", boxSizing:"border-box"}}>Escribir por WhatsApp</a>
            <button style={{...S.btnS, width:"100%", marginTop:10}} onClick={()=>{setPResultado(null);}}>Consultar otra placa</button>
          </>}
        </div>
      </div>
    );
  }

  /* ================= ELEGIR TIPO ================= */
  if (vista === "elegirTipo") return (
    <Shell vista="form" setVista={setVista} onNueva={irNueva} onSalir={salir} toast={toast}>
      <h2 style={{...S.h2, fontSize:26, marginBottom:6}}>¿Qué deseas crear?</h2>
      <p style={{fontSize:14.5, color:"#5A6478", marginTop:0, marginBottom:20}}>Una cotización es solo el estimado de precio. Un trámite ya incluye documentos y seguimiento completo.</p>
      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(280px, 1fr))", gap:16}}>
        <div onClick={nuevaCotizacion} style={{...S.card, cursor:"pointer", borderTop:"4px solid "+GOLD}}>
          <div style={{fontSize:30, marginBottom:6}}>🧾</div>
          <div style={{fontWeight:800, color:NAVY, fontSize:18, marginBottom:6}}>Nueva cotización</div>
          <div style={{fontSize:14, color:"#5A6478", lineHeight:1.5}}>Solo el estimado de precio para el cliente. Sin documentos ni etapas. Genera factura de cotización (COT). Luego se puede convertir en trámite.</div>
        </div>
        <div onClick={nuevoTramite} style={{...S.card, cursor:"pointer", borderTop:"4px solid "+BLUE}}>
          <div style={{fontSize:30, marginBottom:6}}>🚗</div>
          <div style={{fontWeight:800, color:NAVY, fontSize:18, marginBottom:6}}>Nuevo trámite</div>
          <div style={{fontSize:14, color:"#5A6478", lineHeight:1.5}}>Proceso completo: documentos, SOAT/tecnomecánica, etapas, pagos y seguimiento (MGL).</div>
        </div>
      </div>
    </Shell>
  );

  /* ================= DASHBOARD ================= */
  if (vista === "dashboard") {
    const recientes = db.cotizaciones.filter((c)=>!esCotizacion(c) && c.estado !== ESTADO_FINAL).slice(0, 6);
    const Kpi = ({ label, valor, color, icon }) => (
      <div style={{...S.card, padding:"16px 18px", display:"flex", flexDirection:"column", gap:10}}>
        <div style={{width:38, height:38, borderRadius:12, background:(color||NAVY)+"1A", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18}}>{icon || "📊"}</div>
        <div>
          <div style={{fontSize:11.5, fontWeight:700, color:"#5A6478", textTransform:"uppercase", letterSpacing:".05em", lineHeight:1.3}}>{label}</div>
          <div style={{fontSize:28, fontWeight:900, color: color || NAVY, marginTop:3}}>{valor}</div>
        </div>
      </div>
    );
    return (
      <Shell vista={vista} setVista={setVista} onNueva={irNueva} onSalir={salir} toast={toast}>
        <div style={{background:`linear-gradient(135deg, #1E4A8F 0%, ${NAVY} 55%, #0F2A54 100%)`, borderRadius:24, padding:"26px 28px", marginBottom:22, position:"relative", overflow:"hidden", boxShadow:"0 12px 32px rgba(10,30,66,.28)"}}>
          <div style={{position:"absolute", width:220, height:220, borderRadius:"50%", background:"radial-gradient(circle, rgba(30,111,235,.35), transparent 70%)", top:-90, right:-60}} />
          <div style={{position:"relative", display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:16}}>
            <div>
              <div style={{color:"#9DB4DE", fontSize:13, fontWeight:600}}>Panel operativo</div>
              <div style={{color:"#fff", fontSize:26, fontWeight:800, marginTop:2}}>MoviGestión Luz</div>
              <div style={{display:"flex", gap:18, marginTop:18, flexWrap:"wrap"}}>
                <div><div style={{color:"#9DB4DE", fontSize:11.5, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em"}}>Trámites totales</div><div style={{color:"#fff", fontSize:28, fontWeight:900, marginTop:2}}>{stats.total}</div></div>
                <div style={{width:1, background:"rgba(255,255,255,.15)"}} />
                <div><div style={{color:"#9DB4DE", fontSize:11.5, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em"}}>En proceso</div><div style={{color:"#fff", fontSize:28, fontWeight:900, marginTop:2}}>{stats.enProceso}</div></div>
                <div style={{width:1, background:"rgba(255,255,255,.15)"}} />
                <div><div style={{color:"#C9A24B", fontSize:11.5, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em"}}>Cotizaciones</div><div style={{color:"#fff", fontSize:28, fontWeight:900, marginTop:2}}>{stats.cotizaciones}</div></div>
              </div>
            </div>
          </div>
          <div style={{display:"flex", gap:10, marginTop:22, flexWrap:"wrap", position:"relative"}}>
            {[["form","+ Nuevo","✚"],["cotizaciones","Cotizaciones","🧾"],["lista","Trámites","🚗"],["archivados","Finalizados","✅"]].map(([v,l,ic])=>(
              <button key={v} onClick={()=> v==="form" ? irNueva() : setVista(v)} style={{flex:"1 1 110px", background:"rgba(255,255,255,.1)", border:"1px solid rgba(255,255,255,.16)", borderRadius:16, padding:"14px 10px", color:"#fff", fontWeight:700, fontSize:13.5, cursor:"pointer", textAlign:"center", backdropFilter:"blur(6px)"}}>
                <div style={{fontSize:20, marginBottom:4}}>{ic}</div>{l}
              </button>
            ))}
          </div>
        </div>
        {sync === "error" && <div style={{...S.card, marginBottom:16, borderLeft:"4px solid #B3372A", background:"#FDF3F1", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10}}>
          <div style={{fontSize:14.5, color:NAVY}}><b>No se pudo cargar la información de la nube.</b> Puede ser tu conexión a internet. Los datos que ves pueden estar incompletos o desactualizados.</div>
          <button style={S.btnP} onClick={cargar}>Reintentar</button>
        </div>}
        {hayBorrador && <div style={{...S.card, marginBottom:16, borderLeft:"4px solid "+BLUE, display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10}}>
          <div style={{fontSize:14.5, color:NAVY}}><b>Tienes una cotización sin terminar.</b> Quedó guardada como borrador.</div>
          <div style={{display:"flex", gap:8}}>
            <button style={S.btnP} onClick={recuperarBorrador}>Recuperar borrador</button>
            <button style={S.btnS} onClick={limpiarBorrador}>Descartar</button>
          </div>
        </div>}
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(180px, 1fr))", gap:16, marginBottom:22}}>
          <Kpi label="Paquete pendiente" valor={stats.pendiente} color={stats.pendiente>0?"#9A6B00":NAVY} icon="⏳" />
          <Kpi label="En agendamiento" valor={stats.agendamiento} color="#14285A" icon="📅" />
          <Kpi label="Paquetes enviados" valor={stats.enviados} color="#C43D8A" icon="📦" />
          <Kpi label="Retenidos" valor={stats.retenidos} color={stats.retenidos>0?"#B3372A":NAVY} icon="⚠️" />
          <Kpi label="Entregados" valor={stats.entregados} color="#1B7A3D" icon="✅" />
        </div>

        {cajaData && <div style={{...S.card, marginBottom:22}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:8}}>
            <div style={{fontWeight:800, color:NAVY, fontSize:15.5}}>💰 Finanzas de Caja</div>
            <button style={{...S.btnS, padding:"8px 16px"}} onClick={()=>{ setPin(""); setModoApp("caja"); }}>Abrir caja completa</button>
          </div>
          {(()=>{
            const cuentasCaja = (cajaData.config && cajaData.config.cuentas) || ["Efectivo","Nequi","Davivienda","Bancolombia"];
            const saldosMini = {}; cuentasCaja.forEach(c=> saldosMini[c] = Number((cajaData.cuentas||{})[c] || 0));
            (cajaData.movimientos||[]).forEach((m)=>{
              if (m.tipo==="ingreso") saldosMini[m.cuenta] = (saldosMini[m.cuenta]||0)+Number(m.monto);
              else if (m.tipo==="egreso") saldosMini[m.cuenta] = (saldosMini[m.cuenta]||0)-Number(m.monto);
              else if (m.tipo==="transferencia") { saldosMini[m.cuenta]=(saldosMini[m.cuenta]||0)-Number(m.monto); saldosMini[m.cuentaDest]=(saldosMini[m.cuentaDest]||0)+Number(m.monto); }
            });
            const totalCaja = Object.values(saldosMini).reduce((a,b)=>a+b,0);
            let canjeCobrado=0;
            (db.cotizaciones||[]).filter(c=>c.modo!=="cotizacion").forEach((c)=>{
              let ganancia=0, canje=0;
              (c.conceptos||[]).forEach((x)=>{ const v=(Number(x.cant)||1)*(Number(x.valor)||0); if(!v) return;
                const GAN=["Honorarios","Honorarios de impuestos","Papelería","Improntas"];
                if(GAN.includes(x.desc)) ganancia+=v; else canje+=v; });
              const total=ganancia+canje; const abono=(Number(c.abonoEfectivo)||0)+(Number(c.abonoTransferencia)||0);
              const prop = total>0 ? Math.min(1, abono/total) : 0; canjeCobrado += canje*prop;
            });
            const pagadoATransitoMini = (cajaData.movimientos||[]).filter(m=>m.categoria==="Pago a tránsito (canje)").reduce((a,m)=>a+Number(m.monto),0);
            const enProcesoMini = Math.max(0, canjeCobrado - pagadoATransitoMini);
            return (
              <>
                <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(160px,1fr))", gap:12, marginBottom:14}}>
                  <div><div style={S.label}>Dinero en caja</div><div style={{fontSize:19, fontWeight:900, color:NAVY}}>{fmt(totalCaja)}</div></div>
                  <div><div style={S.label}>En proceso (canje)</div><div style={{fontSize:19, fontWeight:900, color:"#6B2FB3"}}>{fmt(enProcesoMini)}</div></div>
                  <div><div style={S.label}>Disponible libre</div><div style={{fontSize:19, fontWeight:900, color:"#1B7A3D"}}>{fmt(Math.max(0, totalCaja-enProcesoMini))}</div></div>
                </div>
                <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(140px,1fr))", gap:10, paddingTop:12, borderTop:"1px solid #EEF1F7"}}>
                  {cuentasCaja.map((cta)=>(
                    <div key={cta} style={{fontSize:13}}>
                      <span style={{color:"#5A6478"}}>{cta}: </span>
                      <b style={{color:NAVY}}>{fmt(saldosMini[cta]||0)}</b>
                    </div>
                  ))}
                </div>
              </>
            );
          })()}
        </div>}

        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12}}>
          <h3 style={{...S.h2, fontSize:17}}>Actividad reciente</h3>
          <button style={S.btnP} onClick={irNueva}>+ Nueva cotización</button>
        </div>
        {recientes.length === 0 && <div style={{...S.card, textAlign:"center", padding:40, color:"#5A6478"}}>
          Aún no hay cotizaciones. Crea la primera con el botón <b>+ Nueva cotización</b>.
        </div>}
        {recientes.map((c) => { const t = totales(c); return (
          <div key={c.id} onClick={()=>{setSel(c); setVista("detalle");}} style={{...S.card, marginBottom:10, cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10}}>
            <div>
              <div style={{fontWeight:800, color:NAVY}}>{c.numero} · {c.vehiculo.placa} <span style={{fontWeight:500, color:"#5A6478"}}>· {c.cliente.nombre}</span></div>
              <div style={{fontSize:13, color:"#5A6478", marginTop:2}}>{tiposTexto(c)} · {c.fecha} · Saldo {fmt(t.saldo)}</div>
            </div>
            <span style={colorEstado(c.estado)}>{c.estado}</span>
          </div>);})}
      </Shell>
    );
  }

  /* ================= RESPALDO ================= */
  if (vista === "ajustes") return (
    <Shell vista={vista} setVista={setVista} onNueva={irNueva} onSalir={salir} toast={toast}>
      <h2 style={{...S.h2, fontSize:26, marginBottom:16}}>Respaldo de información</h2>
      <Sec titulo="Descargar respaldo">
        <p style={{fontSize:14, color:"#5A6478", marginTop:0}}>
          Guarda una copia de todas las cotizaciones en un archivo. Recomendado una vez por semana:
          descárgalo y súbelo a Drive o envíalo por WhatsApp.
        </p>
        <div style={{fontSize:14, marginBottom:14}}>Cotizaciones guardadas actualmente: <b>{db.cotizaciones.length}</b></div>
        <button style={S.btnP} onClick={descargarRespaldo}>Descargar respaldo</button>
      </Sec>
      <Sec titulo="Restaurar desde respaldo">
        <p style={{fontSize:14, color:"#5A6478", marginTop:0}}>Abre el archivo de respaldo, copia todo su contenido y pégalo aquí.</p>
        <textarea style={{...S.input, minHeight:120, fontFamily:"monospace", fontSize:12}} value={textoRestaurar} onChange={(e)=>setTextoRestaurar(e.target.value)} placeholder='{"cotizaciones":[…]}' />
        <button style={{...S.btnS, marginTop:10}} onClick={restaurarRespaldo}>Restaurar información</button>
      </Sec>
    </Shell>
  );

  /* ================= LISTA ================= */
  if (vista === "lista" || vista === "archivados" || vista === "cotizaciones") return (
    <Shell vista={vista} setVista={setVista} onNueva={irNueva} onSalir={salir} toast={toast}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:10}}>
        <h2 style={{...S.h2, fontSize:26}}>{vista === "archivados" ? "Trámites finalizados" : vista === "cotizaciones" ? "Cotizaciones" : "Trámites"}</h2>
        <button style={S.btnP} onClick={irNueva}>+ Nuevo</button>
      </div>
      {vista === "archivados" && <div style={{fontSize:14, color:"#5A6478", marginBottom:14}}>Aquí quedan almacenados los trámites entregados. Salen de la vista principal para no estorbar el día a día.</div>}
      {vista === "cotizaciones" && <div style={{fontSize:14, color:"#5A6478", marginBottom:14}}>Estimados de precio (COT). No tienen documentos ni seguimiento hasta convertirlos en trámite.</div>}
      <div style={{display:"flex", gap:10, marginBottom:16, flexWrap:"wrap"}}>
        <input style={{...S.input, flex:"1 1 320px", maxWidth:520}} placeholder="Buscar por placa, nombre, documento, teléfono…" value={busqueda} onChange={(e)=>setBusqueda(e.target.value)} />
        {vista === "lista" && <select style={{...S.input, flex:"0 1 260px"}} value={filtroEstado} onChange={(e)=>setFiltroEstado(e.target.value)}>
          <option value="">Todos los estados</option>
          {ESTADOS.map((e)=><option key={e}>{e}</option>)}
        </select>}
      </div>
      {filtradas.length === 0 && <div style={{...S.card, textAlign:"center", padding:36, color:"#5A6478"}}>{vista === "archivados" ? "Aún no hay trámites finalizados." : vista === "cotizaciones" ? "Aún no hay cotizaciones. Crea una con “+ Nuevo”." : "Sin resultados para esta búsqueda."}</div>}
      {filtradas.map((c) => { const t = totales(c); const efe=Number(c.abonoEfectivo)||0, tra=Number(c.abonoTransferencia)||0; const alerta = alertaVigencia(c.vehiculo); return (
        <div key={c.id} onClick={()=>{setSel(c); setVista("detalle");}} style={{...S.card, marginBottom:10, cursor:"pointer", padding:"16px 20px", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:14, borderLeft: alerta ? "4px solid #D9483A" : esCotizacion(c) ? "4px solid "+GOLD : "1px solid #EDF0F6", transition:"transform .12s ease, box-shadow .12s ease"}}>
          <div style={{display:"flex", alignItems:"center", gap:14, minWidth:0}}>
            <div style={{width:46, height:46, borderRadius:14, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", fontSize:21,
              background: esCotizacion(c) ? "linear-gradient(135deg,#F4E4B8,#E8CE8A)" : alerta ? "linear-gradient(135deg,#F7C7BE,#EFA79A)" : `linear-gradient(135deg, ${NAVY}, #1E4A8F)`}}>
              {esCotizacion(c) ? "🧾" : iconoVehiculo(c.vehiculo.tipo)}
            </div>
            <div style={{minWidth:0}}>
              <div style={{fontWeight:800, color:NAVY, fontSize:15}}>{c.numero} · <span style={{letterSpacing:".06em"}}>{c.vehiculo.placa}</span></div>
              <div style={{fontSize:13, color:"#6B7690", marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{c.cliente.nombre} · {esCotizacion(c) ? "Cotización" : tiposTexto(c)} · {c.fecha}</div>
              {!esCotizacion(c) && (efe>0 || tra>0) && <div style={{fontSize:12, color:"#5A6478", marginTop:5}}>
                {efe>0 && <span style={{...tag("#EAF6EE","#1B7A3D"), fontSize:11, marginRight:5}}>Efectivo {fmt(efe)}</span>}
                {tra>0 && <span style={{...tag("#EAF1FE","#1E6FEB"), fontSize:11}}>{c.bancoTransferencia||"Nequi"} {fmt(tra)}</span>}
              </div>}
              {alerta && <div style={{marginTop:5, display:"inline-flex", alignItems:"center", gap:5, background:"#FBE4E1", color:"#B3372A", fontSize:11.5, fontWeight:800, padding:"3px 9px", borderRadius:20}}>⚠ {alerta.mensaje} — hazlo con prioridad</div>}
            </div>
          </div>
          <div style={{textAlign:"right", flexShrink:0}}>
            {esCotizacion(c) ? <span style={tag("#FBF3DE","#8A6D1B")}>Cotización</span> : <span style={alerta ? {...colorEstado(c.estado), background:"#FBE4E1", color:"#B3372A"} : colorEstado(c.estado)}>{c.estado}</span>}
            <div style={{fontSize:14, marginTop:5, color: t.saldo>0 ? "#B3372A" : "#1B7A3D", fontWeight:800}}>{esCotizacion(c) ? "Total "+fmt(t.total) : "Saldo "+fmt(t.saldo)}</div>
          </div>
        </div>);})}
    </Shell>
  );

  /* ================= FORMULARIO ================= */
  if (vista === "form" && form) {
    const t = totales(form);
    return (
      <Shell vista={vista} setVista={setVista} onNueva={irNueva} onSalir={salir} toast={toast}>
        <h2 style={{...S.h2, fontSize:26, marginBottom:16}}>{form.numero ? "Editar " + form.numero : (esCotizacion(form) ? "Nueva cotización" : "Nuevo trámite")}</h2>
        <Sec titulo="Datos generales">
          <G2>
            <Campo label="Fecha"><input type="date" style={S.input} value={form.fecha} onChange={(e)=>upd("fecha", e.target.value)} /></Campo>
            <Campo label="Válida hasta"><input type="date" style={S.input} value={form.vence} onChange={(e)=>upd("vence", e.target.value)} /></Campo>
            <Campo label="Asesor"><input style={S.input} value={form.asesor} onChange={(e)=>upd("asesor", e.target.value)} placeholder="Nombre del asesor" /></Campo>
            <Campo label="Ciudad del trámite">
              <input style={S.input} list="ciudades" value={form.ciudad} onChange={(e)=>{
                const ciudad = e.target.value;
                setForm((f)=>({ ...f, ciudad, conceptos: normalizarConceptos(aplicarCiudad(f.conceptos, ciudad)) }));
              }} />
              <datalist id="ciudades"><option value="Ibagué" /></datalist>
              {esIbague(form.ciudad) && <div style={{fontSize:12, color:"#1B7A3D", fontWeight:600, marginTop:4}}>Tarifas de Ibagué aplicadas automáticamente</div>}
            </Campo>
          </G2>
        </Sec>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(300px, 1fr))", gap:18}}>
        <Sec titulo="Cliente">
          <G2>
            <Campo label="Nombre completo *"><input style={S.input} value={form.cliente.nombre} onChange={(e)=>upd("cliente.nombre", e.target.value)} /></Campo>
            <Campo label="Tipo de documento">
              <select style={S.input} value={form.cliente.tipoDoc} onChange={(e)=>upd("cliente.tipoDoc", e.target.value)}>
                <option>CC</option><option>CE</option><option>NIT</option><option>Pasaporte</option>
              </select></Campo>
            <Campo label="Número de documento"><input style={S.input} inputMode="numeric" value={form.cliente.doc} onChange={(e)=>upd("cliente.doc", e.target.value)} /></Campo>
            <Campo label="Teléfono / WhatsApp"><input style={S.input} inputMode="tel" value={form.cliente.tel} onChange={(e)=>upd("cliente.tel", e.target.value)} /></Campo>
            <Campo label="Dirección"><input style={S.input} value={form.cliente.dir} onChange={(e)=>upd("cliente.dir", e.target.value)} /></Campo>
          </G2>
        </Sec>
        <Sec titulo="Vehículo">
          <G2>
            <Campo label="Placa *"><input style={{...S.input, textTransform:"uppercase", fontWeight:700, letterSpacing:".08em"}} value={form.vehiculo.placa} onChange={(e)=>upd("vehiculo.placa", e.target.value)} placeholder="ABC123" /></Campo>
            <Campo label="Marca"><input style={S.input} value={form.vehiculo.marca} onChange={(e)=>upd("vehiculo.marca", e.target.value)} /></Campo>
            <Campo label="Línea"><input style={S.input} value={form.vehiculo.linea} onChange={(e)=>upd("vehiculo.linea", e.target.value)} /></Campo>
            <Campo label="Modelo (año)"><input style={S.input} inputMode="numeric" value={form.vehiculo.modelo} onChange={(e)=>upd("vehiculo.modelo", e.target.value)} /></Campo>
            <Campo label="Tipo">
              <select style={S.input} value={form.vehiculo.tipo} onChange={(e)=>upd("vehiculo.tipo", e.target.value)}>
                <option>Automóvil</option><option>Bus</option><option>Buseta</option><option>Camión</option><option>Camioneta</option><option>Campero</option><option>Microbús</option><option>Tractocamión</option><option>Motocicleta</option><option>Motocarro</option><option>Motociclo</option><option>Cuatrimoto</option><option>Volqueta</option><option>Otro</option>
              </select></Campo>
            <Campo label="Servicio">
              <select style={S.input} value={form.vehiculo.servicio} onChange={(e)=>upd("vehiculo.servicio", e.target.value)}>
                <option>Particular</option><option>Público</option>
              </select></Campo>
            <Campo label="Ciudad de matrícula"><input style={S.input} value={form.vehiculo.ciudadMat} onChange={(e)=>upd("vehiculo.ciudadMat", e.target.value)} /></Campo>
          </G2>
          <div style={{marginTop:8, borderTop:"1.5px solid #EEF1F7", paddingTop:14}}>
            <div style={{fontWeight:800, color:NAVY, fontSize:14, marginBottom:10}}>SOAT y Tecnomecánica</div>
            {[["soat","SOAT"],["tecno","Tecnomecánica"]].map(([k, lbl]) => {
              const d = form.vehiculo[k] || { tiene:false, desde:"", hasta:"" };
              return (
                <div key={k} style={{display:"grid", gridTemplateColumns:"minmax(150px,1fr) 1fr 1fr", gap:12, alignItems:"end", marginBottom:12}}>
                  <button onClick={()=>upd("vehiculo."+k, { ...d, tiene: !d.tiene })}
                    style={{display:"flex", alignItems:"center", gap:10, padding:"12px 14px", borderRadius:11,
                      border:"1.5px solid "+(d.tiene?"#1B7A3D":"#D5DBE7"), background:d.tiene?"#E9F8EE":"#fff",
                      cursor:"pointer", textAlign:"left", fontSize:14.5, fontWeight:700, color:NAVY}}>
                    <span style={{width:24, height:24, borderRadius:7, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center",
                      background:d.tiene?"#1B7A3D":"#fff", border:"2px solid "+(d.tiene?"#1B7A3D":"#C9D2E2"), color:"#fff", fontSize:15, fontWeight:800}}>{d.tiene?"✓":""}</span>
                    {lbl} {d.tiene ? "(vigente)" : "(no tiene)"}
                  </button>
                  <div><label style={S.label}>Desde</label><input type="date" style={{...S.input, opacity:d.tiene?1:.5}} disabled={!d.tiene} value={d.desde} onChange={(e)=>upd("vehiculo."+k, { ...d, desde:e.target.value, hasta: e.target.value ? (k==="soat" ? vigenciaSoat(e.target.value) : vigenciaTecno(e.target.value)) : d.hasta })} /></div>
                  <div><label style={S.label}>Vigente hasta</label><input type="date" style={{...S.input, opacity:d.tiene?1:.5}} disabled={!d.tiene} value={d.hasta} onChange={(e)=>upd("vehiculo."+k, { ...d, hasta:e.target.value })} /></div>
                  {d.tiene && d.hasta && (()=>{ const dias=diasParaVencer(d.hasta); if(dias===null||dias>5) return null; const venc=dias<0;
                    return <div style={{gridColumn:"1 / -1", background: venc?"#FBE4E1":"#FFF0E0", border:"1.5px solid "+(venc?"#D9483A":"#E8963A"), borderRadius:10, padding:"9px 12px", fontSize:12.5, fontWeight:700, color: venc?"#B3372A":"#9A5B00", display:"flex", alignItems:"center", gap:6}}>
                      ⚠ {lbl} {venc ? "ya venció" : dias===0 ? "vence hoy" : `vence en ${dias} día${dias===1?"":"s"}`} — si se vence antes de terminar el trámite, hay que cancelarlo todo. Hazlo con prioridad.
                    </div>;
                  })()}
                </div>
              );
            })}
          </div>
        </Sec>
        </div>
        {!esCotizacion(form) && <Sec titulo="Trámite(s)">
          <label style={S.label}>Trámites de esta cotización</label>
          {(form.tramite.tipos || []).map((tp, i) => (
            <div key={i} style={{display:"grid", gridTemplateColumns:"1fr 40px", gap:8, marginBottom:8, alignItems:"center"}}>
              <select style={S.input} value={tp} onChange={(e)=>{ const a=[...form.tramite.tipos]; a[i]=e.target.value; upd("tramite.tipos", a); }}>
                {TIPOS_TRAMITE.map((x)=><option key={x}>{x}</option>)}
              </select>
              {form.tramite.tipos.length > 1
                ? <button style={{...S.btnD, padding:"10px 10px"}} onClick={()=>upd("tramite.tipos", form.tramite.tipos.filter((_,j)=>j!==i))}>✕</button>
                : <div />}
            </div>
          ))}
          <button style={{...S.btnS, marginBottom:16}} onClick={()=>upd("tramite.tipos", [...(form.tramite.tipos||[]), "Traspaso"])}>+ Agregar otro trámite</button>
          <G2>
            <Campo label="Fecha estimada de entrega"><input type="date" style={S.input} value={form.tramite.fechaEstimada} onChange={(e)=>upd("tramite.fechaEstimada", e.target.value)} /></Campo>
          </G2>
          <Campo label="Descripción"><textarea style={{...S.input, minHeight:60}} value={form.tramite.desc} onChange={(e)=>upd("tramite.desc", e.target.value)} /></Campo>
          <Campo label="Requisitos / documentos (marca los que ya tienes)">
            <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(210px, 1fr))", gap:9}}>
              {reqOrden(form).map((r) => {
                const on = (form.tramite.reqs || {})[r];
                return (
                  <button key={r} onClick={()=>upd("tramite.reqs", { ...(form.tramite.reqs||{}), [r]: !on })}
                    style={{display:"flex", alignItems:"center", gap:11, padding:"12px 14px", borderRadius:11,
                      border:"1.5px solid "+(on?"#1B7A3D":"#D5DBE7"), background:on?"#E9F8EE":"#fff",
                      cursor:"pointer", textAlign:"left", fontSize:14.5, fontWeight:600, color:NAVY}}>
                    <span style={{width:24, height:24, borderRadius:7, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center",
                      background:on?"#1B7A3D":"#fff", border:"2px solid "+(on?"#1B7A3D":"#C9D2E2"), color:"#fff", fontSize:15, fontWeight:800}}>{on?"✓":""}</span>
                    {r}
                  </button>
                );
              })}
            </div>
          </Campo>
          <G2>
            <Campo label="Documentos entregados"><textarea style={{...S.input, minHeight:60}} value={form.tramite.docsEntregados} onChange={(e)=>upd("tramite.docsEntregados", e.target.value)} /></Campo>
            <Campo label="Documentos pendientes (visibles al cliente)"><textarea style={{...S.input, minHeight:60}} value={form.tramite.docsPendientes} onChange={(e)=>upd("tramite.docsPendientes", e.target.value)} /></Campo>
          </G2>
        </Sec>}
        <Sec titulo="Costos">
          <p style={{fontSize:13, color:"#5A6478", marginTop:0, marginBottom:14}}>
            Los conceptos ya están cargados. Escribe solo el valor de los que apliquen; los vacíos no aparecen en la cotización.
            Si registras un valor en <b>Impuestos</b>, se agrega automáticamente la fila de honorarios de impuestos.
          </p>
          {form.conceptos.map((x, i) => {
            const fijo = x.desc === HON_IMPUESTOS;
            return (
            <div key={i} style={{display:"grid", gridTemplateColumns:"1fr 150px 38px", gap:8, marginBottom:8, alignItems:"center"}}>
              <input style={{...S.input, background: fijo ? "#EAF2FF" : CONCEPTOS_BASE.includes(x.desc) ? "#F7F9FC" : "#fff", color: fijo ? BLUE : NAVY, fontWeight: fijo ? 700 : 400}} value={x.desc} placeholder="Otro concepto" readOnly={fijo}
                onChange={(e)=>{ const c=[...form.conceptos]; c[i]={...c[i], desc:e.target.value}; upd("conceptos", c); }} />
              <input style={{...S.input, textAlign:"right", fontWeight:700, background: fijo ? "#EAF2FF" : "#fff"}} inputMode="numeric" value={miles(x.valor)} placeholder="0" readOnly={fijo}
                onChange={(e)=>{ const c=[...form.conceptos]; c[i]={...c[i], valor:soloNum(e.target.value)}; upd("conceptos", normalizarConceptos(c)); }} />
              {fijo ? <div /> : <button style={{...S.btnD, padding:"8px 8px"}} onClick={()=>{ upd("conceptos", normalizarConceptos(form.conceptos.filter((_,j)=>j!==i))); }}>✕</button>}
            </div>);
          })}
          <button style={{...S.btnS, marginBottom:16}} onClick={()=>upd("conceptos", [...form.conceptos, {cant:1, desc:"", valor:""}])}>+ Agregar otro concepto</button>
          <G2>
            <Campo label="Descuento"><input style={{...S.input, textAlign:"right", fontWeight:700}} inputMode="numeric" value={miles(form.descuento)} onChange={(e)=>upd("descuento", soloNum(e.target.value))} placeholder="0" /></Campo>
            <Campo label="Abono en efectivo"><input style={{...S.input, textAlign:"right", fontWeight:700}} inputMode="numeric" value={miles(form.abonoEfectivo)} onChange={(e)=>upd("abonoEfectivo", soloNum(e.target.value))} placeholder="0" /></Campo>
            <Campo label="Abono por transferencia"><input style={{...S.input, textAlign:"right", fontWeight:700}} inputMode="numeric" value={miles(form.abonoTransferencia)} onChange={(e)=>upd("abonoTransferencia", soloNum(e.target.value))} placeholder="0" /></Campo>
            {Number(form.abonoTransferencia) > 0 && <Campo label="¿A qué banco entró la transferencia?">
              <select style={S.input} value={form.bancoTransferencia || "Nequi"} onChange={(e)=>upd("bancoTransferencia", e.target.value)}>
                {BANCOS_DISPONIBLES.map((b)=><option key={b}>{b}</option>)}
              </select>
            </Campo>}
          </G2>
          <div style={{background:"#F4F6FA", borderRadius:12, padding:"14px 18px", display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(130px, 1fr))", gap:10, fontSize:14}}>
            <div><span style={S.label}>Subtotal</span><b>{fmt(t.sub)}</b></div>
            <div><span style={S.label}>Total</span><b style={{fontSize:17}}>{fmt(t.total)}</b></div>
            <div><span style={S.label}>Abonado</span><b style={{color:"#1B7A3D"}}>{fmt(t.abono)}</b></div>
            <div><span style={S.label}>Saldo</span><b style={{color: t.saldo>0?"#B3372A":"#1B7A3D"}}>{fmt(t.saldo)}</b></div>
          </div>
        </Sec>
        <Sec titulo="Observaciones">
          <p style={{fontSize:13, color:"#5A6478", marginTop:0, marginBottom:10}}>Espacio libre para anotar lo que necesites sobre este {esCotizacion(form)?"cotización":"trámite"} (uso interno).</p>
          <textarea style={{...S.input, minHeight:80}} value={form.notaManual || ""} onChange={(e)=>upd("notaManual", e.target.value)} placeholder="Ej: cliente pidió que se agilice, documento pendiente por revisar…" />
        </Sec>
        <div style={{display:"flex", gap:10, flexWrap:"wrap"}}>
          <button style={S.btnP} onClick={guardarCotizacion}>{form.numero ? "Guardar cambios" : "Crear cotización"}</button>
          <button style={S.btnS} onClick={()=>setVista(form.numero ? "detalle" : "lista")}>Cancelar</button>
        </div>
      </Shell>
    );
  }

  /* ================= VISTA PREVIA COTIZACIÓN ================= */
  if (vista === "preview" && sel) {
    const c = db.cotizaciones.find((x)=>x.id===sel.id) || sel;
    const t = totales(c);
    const filas = c.conceptos.filter((x)=> Number(x.valor) > 0);
    return (
      <div style={{minHeight:"100vh", background:"#EEF1F7", fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
        <div style={{background:NAVY, padding:"12px 16px", display:"flex", gap:8, justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", position:"sticky", top:0, zIndex:10}}>
          <button style={{...S.btnS, padding:"9px 14px"}} onClick={()=>setVista("detalle")}>← Volver</button>
          <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
            <button style={{...S.btnP, background:"#25D366", boxShadow:"none"}} onClick={()=>copiarImagenCotizacion(notificar)}>📋 Copiar imagen (WhatsApp)</button>
            <button style={S.btnP} onClick={()=>abrirCotizacion(c, notificar)}>Abrir en pestaña para imprimir</button>
            <button style={{...S.btnS}} onClick={()=>descargarCotizacion(c, notificar)}>Descargar</button>
          </div>
        </div>
        <div style={{padding:"16px 8px 40px"}}>
          <div id="tarjeta-cotizacion-captura" style={{maxWidth:720, margin:"0 auto", background:"#fff", borderRadius:8, boxShadow:"0 2px 12px rgba(10,30,66,.15)", padding:"28px 26px", color:NAVY}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", borderBottom:`3px solid ${NAVY}`, paddingBottom:14, marginBottom:18, gap:16, flexWrap:"wrap"}}>
              <img src={LOGO} alt="MoviGestión Luz" style={{height:44}} />
              <div style={{textAlign:"right", fontSize:12, color:"#5A6478"}}>
                <div style={{fontSize:17, fontWeight:900, color:NAVY}}>{esCotizacion(c) ? "COTIZACIÓN" : "ORDEN DE TRÁMITE"} {c.numero}</div>
                <div>Fecha: {c.fecha}</div>
                {c.vence && <div>Válida hasta: {c.vence}</div>}
                <div>Tel: {TEL_VISIBLE}</div>
                <div>{DIRECCION}</div>
              </div>
            </div>
            <div style={{display:"flex", gap:24, marginBottom:16, flexWrap:"wrap"}}>
              <div style={{flex:1, minWidth:200}}>
                <div style={{fontSize:12, letterSpacing:".06em", borderBottom:"1.5px solid #E8ECF3", paddingBottom:4, marginBottom:7, fontWeight:800}}>CLIENTE</div>
                <div><b>{c.cliente.nombre}</b></div>
                <div>{c.cliente.tipoDoc} {c.cliente.doc}</div>
                <div>{c.cliente.tel}</div>
              </div>
              <div style={{flex:1, minWidth:200}}>
                <div style={{fontSize:12, letterSpacing:".06em", borderBottom:"1.5px solid #E8ECF3", paddingBottom:4, marginBottom:7, fontWeight:800}}>VEHÍCULO</div>
                <div>Placa: <b>{c.vehiculo.placa}</b></div>
                <div>{c.vehiculo.marca} {c.vehiculo.linea} {c.vehiculo.modelo}</div>
                <div>Matriculado en: {c.vehiculo.ciudadMat || "—"}</div>
                <div>Servicio: {c.vehiculo.servicio}</div>
                <div style={{marginTop:6}}>SOAT: <b>{getSoat(c).tiene ? ("Vigente"+(getSoat(c).hasta?" hasta "+getSoat(c).hasta:"")) : "No registra"}</b></div>
                <div>Tecnomecánica: <b>{getTecno(c).tiene ? ("Vigente"+(getTecno(c).hasta?" hasta "+getTecno(c).hasta:"")) : "No registra"}</b></div>
              </div>
            </div>
            {!esCotizacion(c) && <div style={{fontSize:12, letterSpacing:".06em", borderBottom:"1.5px solid #E8ECF3", paddingBottom:4, marginBottom:7, fontWeight:800}}>TRÁMITE{getTipos(c).length>1?"S":""}: {tiposTexto(c).toUpperCase()}</div>}
            {!esCotizacion(c) && c.tramite.desc && <div style={{marginBottom:4}}>{c.tramite.desc}</div>}
            {!esCotizacion(c) && c.tramite.fechaEstimada && <div style={{marginBottom:4}}>Entrega estimada: {c.tramite.fechaEstimada}</div>}
            <table style={{width:"100%", borderCollapse:"collapse", margin:"14px 0", fontSize:13.5}}>
              <thead><tr style={{background:NAVY, color:"#fff"}}>
                <th style={{padding:"8px 10px", textAlign:"left"}}>Descripción</th>
                <th style={{padding:"8px 10px", textAlign:"right"}}>Valor</th>
              </tr></thead>
              <tbody>{filas.map((x,i)=>(
                <tr key={i} style={{borderBottom:"1px solid #E8ECF3"}}>
                  <td style={{padding:"7px 10px"}}>{x.desc}</td>
                  <td style={{padding:"7px 10px", textAlign:"right"}}>{fmt(x.valor)}</td>
                </tr>))}
                {filas.length===0 && <tr><td colSpan={2} style={{padding:"10px", color:"#9AA3B2"}}>Sin valores registrados aún.</td></tr>}
              </tbody>
            </table>
            <div style={{marginLeft:"auto", width:280, fontSize:13.5}}>
              {Number(c.descuento)>0 && <div style={{display:"flex", justifyContent:"space-between", padding:"4px 10px"}}><span>Descuento</span><span>−{fmt(c.descuento)}</span></div>}
              <div style={{display:"flex", justifyContent:"space-between", padding:"8px 10px", background:NAVY, color:"#fff", fontWeight:800, borderRadius:6}}><span>TOTAL</span><span>{fmt(t.total)}</span></div>
              {t.abono>0 && <>
                <div style={{display:"flex", justifyContent:"space-between", padding:"4px 10px 0"}}><span>Abono</span><span>{fmt(t.abono)}</span></div>
                <div style={{display:"flex", justifyContent:"space-between", padding:"4px 10px", fontWeight:800}}><span>SALDO</span><span>{fmt(t.saldo)}</span></div>
                <div style={{padding:"8px 10px 0", fontSize:12, color:"#5A6478"}}>
                  {Number(c.abonoEfectivo)>0 && <div style={{display:"flex", justifyContent:"space-between"}}><span>· Efectivo</span><span>{fmt(c.abonoEfectivo)}</span></div>}
                  {Number(c.abonoTransferencia)>0 && <div style={{display:"flex", justifyContent:"space-between"}}><span>· {c.bancoTransferencia||"Nequi"}</span><span>{fmt(c.abonoTransferencia)}</span></div>}
                </div>
              </>}
            </div>
            {!esCotizacion(c) && (c.tramite.reqs && Object.keys(c.tramite.reqs).length) ? <div style={{marginTop:16}}>
              <div style={{fontSize:12, letterSpacing:".06em", fontWeight:800, marginBottom:8}}>REQUISITOS / DOCUMENTOS</div>
              <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(200px, 1fr))", gap:"5px 18px", fontSize:13}}>
                {reqOrden(c).map((r)=>{ const on=getReqs(c)[r]===true; return (
                  <div key={r} style={{display:"flex", alignItems:"center", gap:8}}>
                    <span style={{width:18, height:18, borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:800, color:"#fff", background:on?"#1B7A3D":"#C9D2E2"}}>{on?"✓":"✕"}</span>{r}
                  </div>);})}
              </div>
            </div> : null}
            <div style={{background:"#F4F6FA", borderRadius:10, padding:"12px 16px", fontSize:12.5, margin:"16px 0"}}>
              <b>Seguimiento en línea:</b> consulta el estado con la placa <b>{c.vehiculo.placa}</b> y el código <b style={{letterSpacing:".1em"}}>{c.codigo}</b>.
            </div>
            <div style={{display:"flex", justifyContent:"space-between", fontSize:12, color:"#5A6478", borderTop:"1px solid #E8ECF3", paddingTop:12, flexWrap:"wrap", gap:8}}>
              <div>Asesor: <b style={{color:NAVY}}>{c.asesor || "—"}</b></div>
              <div>MoviGestión Luz · Servicios Integrales Vehiculares</div>
            </div>
          </div>
          <p style={{maxWidth:720, margin:"14px auto 0", fontSize:12.5, color:"#5A6478", textAlign:"center"}}>
            Para guardar en PDF: toca <b>Abrir en pestaña para imprimir</b> y luego elige <b>Imprimir → Guardar como PDF</b>.
          </p>
        </div>
      </div>
    );
  }

  /* ================= ENVIAR SEGUIMIENTO POR WHATSAPP ================= */
  if (vista === "enviarWA" && sel) {
    const c = db.cotizaciones.find((x)=>x.id===sel.id) || sel;
    const mensaje = mensajeSeguimiento(c);
    const link = `https://wa.me/${waCliente(c)}?text=${encodeURIComponent(mensaje)}`;
    const faltan = docsFaltantes(c);
    const negrita = (linea, i) => {
      const partes = linea.split(/(\*[^*]+\*)/g);
      return <div key={i} style={{minHeight: linea==="" ? 10 : "auto"}}>{partes.map((p, j) =>
        p.startsWith("*") && p.endsWith("*") && p.length>2
          ? <b key={j}>{p.slice(1,-1)}</b> : <span key={j}>{p}</span>)}</div>;
    };
    return (
      <div style={{minHeight:"100vh", background:"#F4F6FA", fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
        <div style={{background:NAVY, padding:"16px clamp(20px,4vw,48px)", display:"flex", justifyContent:"space-between", alignItems:"center"}}>
          <Logo dark alto={34} />
          <button style={{...S.btnS, padding:"9px 16px"}} onClick={()=>setVista("detalle")}>Ir al trámite</button>
        </div>
        <div style={{maxWidth:620, margin:"0 auto", padding:"28px 16px"}}>
          <div style={{...S.card, textAlign:"center", marginBottom:16, borderTop:"4px solid #25D366"}}>
            <div style={{fontSize:34, marginBottom:4}}>✅</div>
            <h2 style={{...S.h2, fontSize:22, marginBottom:4}}>Cotización {c.numero} creada</h2>
            <p style={{fontSize:14.5, color:"#5A6478", margin:0}}>Envíale al cliente el mensaje de seguimiento con su placa y código.</p>
          </div>

          <div style={{...S.card, marginBottom:16}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10, flexWrap:"wrap", gap:6}}>
              <div style={{fontWeight:800, color:NAVY}}>Vista previa del mensaje</div>
              <div style={{fontSize:13, color:"#5A6478"}}>Para: <b style={{color:NAVY}}>{c.cliente.tel || "sin número"}</b></div>
            </div>
            {!c.cliente.tel && <div style={{background:"#FFF3D6", color:"#9A6B00", padding:"9px 12px", borderRadius:9, fontSize:13, marginBottom:10}}>
              Esta cotización no tiene número de teléfono del cliente. Puedes agregarlo con <b>Editar</b>, o copiar el mensaje y enviarlo manualmente.
            </div>}
            <div style={{background:"#E7F7EC", border:"1px solid #C9EBD3", borderRadius:14, padding:"14px 16px", fontSize:14.5, lineHeight:1.5, color:"#0A2A17", whiteSpace:"pre-wrap"}}>
              {mensaje.split("\n").map(negrita)}
            </div>
            {faltan.length > 0 && <div style={{fontSize:12.5, color:"#9A6B00", marginTop:10}}>Se incluyeron automáticamente {faltan.length} documento(s) faltante(s).</div>}
          </div>

          <a href={link} target="_blank" rel="noreferrer"
            style={{...S.btnP, background:"#25D366", boxShadow:"0 2px 8px rgba(37,211,102,.35)", display:"block", textAlign:"center", textDecoration:"none", fontSize:16.5, padding:"15px", marginBottom:10}}>
            Enviar por WhatsApp
          </a>
          <div style={{display:"flex", gap:10}}>
            <button style={{...S.btnS, flex:1}} onClick={()=>{ try{ navigator.clipboard.writeText(mensaje); notificar("Mensaje copiado"); }catch(e){ notificar("No se pudo copiar"); } }}>Copiar mensaje</button>
            <button style={{...S.btnS, flex:1}} onClick={()=>setVista("detalle")}>Omitir</button>
          </div>
        </div>
      </div>
    );
  }

  /* ================= DETALLE ================= */
  if (vista === "detalle" && sel) {
    const c = db.cotizaciones.find((x)=>x.id===sel.id) || sel;
    const t = totales(c);
    return (
      <Shell vista={vista} setVista={setVista} onNueva={irNueva} onSalir={salir} toast={toast}>
        <div style={{background:`linear-gradient(135deg, ${NAVY} 0%, #163a6e 55%, #0F2A54 100%)`, borderRadius:22, padding:"22px 26px", marginBottom:16, position:"relative", overflow:"hidden", boxShadow:"0 10px 28px rgba(10,30,66,.24)"}}>
          <div style={{position:"absolute", width:180, height:180, borderRadius:"50%", background:"radial-gradient(circle, rgba(255,255,255,.08), transparent 70%)", top:-70, right:-40}} />
          <div style={{position:"relative", display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:14}}>
            <div style={{display:"flex", alignItems:"center", gap:14}}>
              <div style={{width:52, height:52, borderRadius:16, background:"rgba(255,255,255,.12)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:26, flexShrink:0}}>{esCotizacion(c) ? "🧾" : iconoVehiculo(c.vehiculo.tipo)}</div>
              <div>
                <div style={{color:"#fff", fontWeight:800, fontSize:22}}>{c.numero} · <span style={{letterSpacing:".06em"}}>{c.vehiculo.placa}</span></div>
                <div style={{color:"#9DB4DE", fontSize:13, marginTop:2}}>Código: <b style={{color:"#fff", letterSpacing:".1em"}}>{c.codigo}</b> · {c.fecha}</div>
              </div>
            </div>
            <span style={esCotizacion(c) ? {...tag("rgba(201,162,75,.25)","#F2D998")} : {...colorEstado(c.estado), background:"rgba(255,255,255,.14)", color:"#fff"}}>{esCotizacion(c) ? "Cotización" : c.estado}</span>
          </div>
          <div style={{display:"flex", gap:22, marginTop:20, flexWrap:"wrap", position:"relative"}}>
            <div><div style={{color:"#9DB4DE", fontSize:11.5, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em"}}>{esCotizacion(c)?"Total":"Total"}</div><div style={{color:"#fff", fontSize:22, fontWeight:900, marginTop:2}}>{fmt(t.total)}</div></div>
            {!esCotizacion(c) && <>
              <div style={{width:1, background:"rgba(255,255,255,.15)"}} />
              <div><div style={{color:"#9DB4DE", fontSize:11.5, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em"}}>Abonado</div><div style={{color:"#7EE0A8", fontSize:22, fontWeight:900, marginTop:2}}>{fmt(t.abono)}</div></div>
              <div style={{width:1, background:"rgba(255,255,255,.15)"}} />
              <div><div style={{color:"#9DB4DE", fontSize:11.5, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em"}}>Saldo</div><div style={{color: t.saldo>0?"#F3A99A":"#7EE0A8", fontSize:22, fontWeight:900, marginTop:2}}>{fmt(t.saldo)}</div></div>
            </>}
          </div>
        </div>
        {esCotizacion(c) && <div style={{...S.card, marginBottom:14, borderLeft:"4px solid "+GOLD, display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:12}}>
          <div style={{fontSize:14.5, color:NAVY}}><b>Esta es una cotización.</b> Cuando el cliente acepte, conviértela en trámite para gestionar documentos y seguimiento.</div>
          <button style={{...S.btnP, background:GOLD, boxShadow:"none"}} onClick={()=>convertirATramite(c)}>Convertir a trámite</button>
        </div>}
        <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:18}}>
          <button style={S.btnP} onClick={()=>{setSel(c); setVista("preview");}}>Ver {esCotizacion(c) ? "cotización" : "factura"}</button>
          <button style={S.btnS} onClick={()=>abrirCotizacion(c, notificar)}>Abrir en pestaña</button>
          <button style={S.btnS} onClick={()=>descargarCotizacion(c, notificar)}>Descargar</button>
          <button style={{...S.btnP, background:"#25D366", boxShadow:"none"}} onClick={()=>{setSel(c); setVista("enviarWA");}}>Enviar por WhatsApp</button>
          <button style={S.btnS} onClick={()=>{setForm(JSON.parse(JSON.stringify(c))); setVista("form");}}>Editar</button>
          <button style={S.btnS} onClick={()=>duplicar(c)}>Duplicar</button>
          <button style={S.btnD} onClick={()=>eliminar(c.id)}>Eliminar</button>
        </div>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(300px, 1fr))", gap:18, marginBottom:14}}>
          <div style={S.card}>
            <div style={{fontWeight:800, color:NAVY, marginBottom:10}}>Cliente</div>
            <div style={{fontSize:14, lineHeight:1.8}}>
              <b>{c.cliente.nombre}</b><br/>{c.cliente.tipoDoc} {c.cliente.doc}<br/>{c.cliente.tel}
            </div>
          </div>
          <div style={S.card}>
            <div style={{fontWeight:800, color:NAVY, marginBottom:10}}>Vehículo · {tiposTexto(c)}</div>
            <div style={{fontSize:14, lineHeight:1.8}}>
              {c.vehiculo.marca} {c.vehiculo.linea} {c.vehiculo.modelo} · {c.vehiculo.tipo}<br/>
              Servicio {c.vehiculo.servicio}{c.vehiculo.ciudadMat && <><br/>Matriculado en {c.vehiculo.ciudadMat}</>}
              {c.tramite.fechaEstimada && <><br/>Entrega estimada: <b>{c.tramite.fechaEstimada}</b></>}
            </div>
            <div style={{marginTop:12, borderTop:"1px solid #EEF1F7", paddingTop:12, display:"grid", gap:10}}>
              {[["soat","SOAT"],["tecno","Tecnomecánica"]].map(([k, lbl]) => {
                const d = (c.vehiculo && c.vehiculo[k]) || { tiene:false, desde:"", hasta:"" };
                return (
                  <div key={k}>
                    <button onClick={()=>toggleVigencia(k)} style={{display:"flex", alignItems:"center", gap:9, padding:"8px 11px", borderRadius:9, width:"100%",
                      border:"1.5px solid "+(d.tiene?"#1B7A3D":"#D5DBE7"), background:d.tiene?"#E9F8EE":"#fff", cursor:"pointer", textAlign:"left", fontSize:13.5, fontWeight:700, color:NAVY}}>
                      <span style={{width:20, height:20, borderRadius:6, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center",
                        background:d.tiene?"#1B7A3D":"#fff", border:"2px solid "+(d.tiene?"#1B7A3D":"#C9D2E2"), color:"#fff", fontSize:13, fontWeight:800}}>{d.tiene?"✓":""}</span>
                      {lbl} {d.tiene ? "vigente" : "no tiene"}
                    </button>
                    {d.tiene && <div style={{display:"flex", gap:6, marginTop:6}}>
                      <input type="date" style={{...S.input, padding:"7px 9px", fontSize:13}} value={d.desde} onChange={(e)=>setVigenciaFecha(k,"desde",e.target.value)} />
                      <input type="date" style={{...S.input, padding:"7px 9px", fontSize:13}} value={d.hasta} onChange={(e)=>setVigenciaFecha(k,"hasta",e.target.value)} />
                    </div>}
                    {d.tiene && d.hasta && (()=>{ const dias=diasParaVencer(d.hasta); if(dias===null||dias>5) return null; const venc=dias<0;
                      return <div style={{marginTop:6, background: venc?"#FBE4E1":"#FFF0E0", border:"1.5px solid "+(venc?"#D9483A":"#E8963A"), borderRadius:9, padding:"7px 10px", fontSize:12, fontWeight:700, color: venc?"#B3372A":"#9A5B00"}}>
                        ⚠ {lbl} {venc ? "ya venció" : dias===0 ? "vence hoy" : `vence en ${dias} día${dias===1?"":"s"}`} — hazlo con prioridad, si se vence toca cancelar el trámite.
                      </div>;
                    })()}
                  </div>
                );
              })}
            </div>
          </div>
          <div style={S.card}>
            <div style={{fontWeight:800, color:NAVY, marginBottom:10}}>Cuenta de cobro</div>
            <div style={{display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:5}}><span>Total</span><b>{fmt(t.total)}</b></div>
            <div style={{display:"flex", justifyContent:"space-between", fontSize:13.5, marginBottom:3, color:"#5A6478"}}><span>Efectivo</span><span>{fmt(c.abonoEfectivo)}</span></div>
            <div style={{display:"flex", justifyContent:"space-between", fontSize:13.5, marginBottom:5, color:"#5A6478"}}><span>Transferencia{Number(c.abonoTransferencia)>0 ? " ("+(c.bancoTransferencia||"Nequi")+")" : ""}</span><span>{fmt(c.abonoTransferencia)}</span></div>
            <div style={{display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:5, borderTop:"1px solid #EEF1F7", paddingTop:6}}><span>Abonado</span><b style={{color:"#1B7A3D"}}>{fmt(t.abono)}</b></div>
            <div style={{display:"flex", justifyContent:"space-between", fontSize:16, marginBottom:12}}><b>Saldo</b><b style={{color: t.saldo>0?"#B3372A":"#1B7A3D"}}>{fmt(t.saldo)}</b></div>

            <div style={{fontSize:12, fontWeight:700, color:"#5A6478", textTransform:"uppercase", letterSpacing:".05em", marginBottom:6}}>Registrar abono</div>
            <div style={{display:"flex", gap:6, marginBottom:8, alignItems:"center"}}>
              <input inputMode="numeric" style={{...S.input, textAlign:"right", fontWeight:700, padding:"9px 11px"}} placeholder="Efectivo"
                value={miles(abonoEfe)} onChange={(e)=>setAbonoEfe(soloNum(e.target.value))} onKeyDown={(e)=>{ if(e.key==="Enter"){ registrarAbono("efectivo", abonoEfe); setAbonoEfe(""); }}} />
              <button style={{...S.btnP, padding:"10px 14px", whiteSpace:"nowrap"}} onClick={()=>{ registrarAbono("efectivo", abonoEfe); setAbonoEfe(""); }}>+ Efec.</button>
            </div>
            <div style={{display:"flex", gap:6, alignItems:"center"}}>
              <input inputMode="numeric" style={{...S.input, textAlign:"right", fontWeight:700, padding:"9px 11px"}} placeholder="Transferencia"
                value={miles(abonoTra)} onChange={(e)=>setAbonoTra(soloNum(e.target.value))} onKeyDown={(e)=>{ if(e.key==="Enter"){ registrarAbono("transferencia", abonoTra); setAbonoTra(""); }}} />
              <button style={{...S.btnP, padding:"10px 14px", whiteSpace:"nowrap"}} onClick={()=>{ registrarAbono("transferencia", abonoTra); setAbonoTra(""); }}>+ Transf.</button>
            </div>
            {Number(abonoTra) > 0 && <div style={{marginTop:6}}>
              <label style={{...S.label, fontSize:10.5}}>¿A qué banco entra esta transferencia?</label>
              <select style={{...S.input, padding:"8px 10px", fontSize:13}} value={c.bancoTransferencia||"Nequi"} onChange={(e)=>ajustarAbono("bancoTransferencia", e.target.value)}>
                {BANCOS_DISPONIBLES.map((b)=><option key={b}>{b}</option>)}
              </select>
            </div>}
            <details style={{marginTop:10}}>
              <summary style={{fontSize:12.5, color:BLUE, fontWeight:700, cursor:"pointer"}}>Corregir totales de abono</summary>
              <div style={{display:"flex", gap:6, marginTop:8}}>
                <div style={{flex:1}}><label style={{...S.label, fontSize:10.5}}>Efectivo total</label><input inputMode="numeric" style={{...S.input, textAlign:"right", padding:"8px 10px", fontSize:13}} value={miles(c.abonoEfectivo)} onChange={(e)=>ajustarAbono("abonoEfectivo", e.target.value)} /></div>
                <div style={{flex:1}}><label style={{...S.label, fontSize:10.5}}>Transf. total</label><input inputMode="numeric" style={{...S.input, textAlign:"right", padding:"8px 10px", fontSize:13}} value={miles(c.abonoTransferencia)} onChange={(e)=>ajustarAbono("abonoTransferencia", e.target.value)} /></div>
              </div>
              {Number(c.abonoTransferencia) > 0 && <div style={{marginTop:8}}>
                <label style={{...S.label, fontSize:10.5}}>Banco de la transferencia</label>
                <select style={{...S.input, padding:"8px 10px", fontSize:13}} value={c.bancoTransferencia||"Nequi"} onChange={(e)=>ajustarAbono("bancoTransferencia", e.target.value)}>
                  {BANCOS_DISPONIBLES.map((b)=><option key={b}>{b}</option>)}
                </select>
              </div>}
            </details>
          </div>
        </div>
        {!esCotizacion(c) && <>
        <div style={{...S.card, marginBottom:14}}>
          <div style={{fontWeight:800, color:NAVY, marginBottom:4}}>Documentos y observaciones</div>
          <div style={{fontSize:13, color:"#5A6478", marginBottom:14}}>Chulea el documento cuando el cliente lo entregue. Los pendientes se muestran al cliente en su seguimiento.</div>

          <div style={{fontSize:12.5, fontWeight:700, color:"#5A6478", textTransform:"uppercase", letterSpacing:".05em", marginBottom:8}}>Documentos</div>
          <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(210px, 1fr))", gap:8, marginBottom:18}}>
            {reqOrden(sel).map((r) => {
              const on = getReqs(sel)[r] === true;
              return (
                <button key={r} onClick={()=>toggleDoc(r)}
                  style={{display:"flex", alignItems:"center", gap:10, padding:"11px 13px", borderRadius:10,
                    border:"1.5px solid "+(on?"#1B7A3D":"#E0A800"), background:on?"#E9F8EE":"#FFF9E9",
                    cursor:"pointer", textAlign:"left", fontSize:14, fontWeight:600, color:NAVY}}>
                  <span style={{width:22, height:22, borderRadius:6, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center",
                    background:on?"#1B7A3D":"#fff", border:"2px solid "+(on?"#1B7A3D":"#E0A800"), color:"#fff", fontSize:14, fontWeight:800}}>{on?"✓":""}</span>
                  <span>{r}<br/><span style={{fontSize:11, fontWeight:700, color:on?"#1B7A3D":"#9A6B00"}}>{on?"Entregado":"Pendiente"}</span></span>
                </button>
              );
            })}
          </div>

          <div style={{fontSize:12.5, fontWeight:700, color:"#5A6478", textTransform:"uppercase", letterSpacing:".05em", marginBottom:8}}>Observaciones / pendientes</div>
          {getObs(sel).length === 0 && <div style={{fontSize:13.5, color:"#9AA3B2", marginBottom:10}}>No hay observaciones registradas.</div>}
          {getObs(sel).map((o) => (
            <div key={o.id} style={{display:"flex", alignItems:"flex-start", gap:10, padding:"9px 0", borderBottom:"1px solid #EEF1F7"}}>
              <button onClick={()=>toggleObs(o.id)} style={{width:24, height:24, borderRadius:7, flexShrink:0, marginTop:1, cursor:"pointer",
                background:o.hecho?"#1B7A3D":"#fff", border:"2px solid "+(o.hecho?"#1B7A3D":"#C9D2E2"), color:"#fff", fontSize:14, fontWeight:800}}>{o.hecho?"✓":""}</button>
              <div style={{flex:1, fontSize:14}}>
                <div style={{textDecoration:o.hecho?"line-through":"none", color:o.hecho?"#9AA3B2":NAVY}}>{o.texto}</div>
                <div style={{fontSize:11.5, color:"#5A6478", marginTop:2}}>{o.fecha} · {o.visible ? "Visible al cliente" : "Interno"}</div>
              </div>
              <button onClick={()=>eliminarObs(o.id)} style={{...S.btnD, padding:"6px 10px", fontSize:13}}>✕</button>
            </div>
          ))}
          <div style={{display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end", marginTop:12}}>
            <div style={{flex:"1 1 300px"}}>
              <label style={S.label}>Nueva observación o pendiente</label>
              <input style={S.input} value={nuevaObs} onChange={(e)=>setNuevaObs(e.target.value)}
                onKeyDown={(e)=>{ if(e.key==="Enter"){ agregarObs(nuevaObs, obsVisible); setNuevaObs(""); }}}
                placeholder="Ej: falta firma en el mandato" />
            </div>
            <label style={{display:"flex", alignItems:"center", gap:6, fontSize:13, fontWeight:600, color:NAVY, paddingBottom:11, cursor:"pointer"}}>
              <input type="checkbox" checked={obsVisible} onChange={(e)=>setObsVisible(e.target.checked)} /> Visible al cliente
            </label>
            <button style={S.btnP} onClick={()=>{ agregarObs(nuevaObs, obsVisible); setNuevaObs(""); }}>Agregar</button>
          </div>
        </div>
        <div style={{...S.card, marginBottom:14}}>
          <div style={{fontWeight:800, color:NAVY, marginBottom:4}}>Archivos del trámite</div>
          <div style={{fontSize:13, color:"#5A6478", marginBottom:14}}>Guarda aquí fotos o PDF del trámite: cédulas, tarjeta de propiedad, improntas, formularios, etc. (PDF, PNG o JPG).</div>
          {getAdj(sel).length > 0 && <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(150px, 1fr))", gap:12, marginBottom:14}}>
            {getAdj(sel).map((a) => (
              <div key={a.id} style={{border:"1px solid #E8ECF3", borderRadius:12, overflow:"hidden", background:"#fff"}}>
                <div onClick={()=>abrirAdjunto(a)} style={{cursor:"pointer", height:110, background:"#F4F6FA", display:"flex", alignItems:"center", justifyContent:"center"}}>

                    ? <img src={a.data} alt={a.nombre} style={{width:"100%", height:"100%", objectFit:"cover"}} />

                </div>

                  <div style={{fontSize:12, color:NAVY, fontWeight:600, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}} title={a.nombre}>{a.nombre}</div>
                  <div style={{display:"flex", justifyContent:"space-between", marginTop:6}}>
                    <button onClick={()=>abrirAdjunto(a)} style={{background:"none", border:"none", color:BLUE, fontWeight:700, fontSize:12.5, cursor:"pointer", padding:0}}>Abrir</button>
                    <button onClick={()=>eliminarAdjunto(a.id)} style={{background:"none", border:"none", color:"#C0392B", fontWeight:700, fontSize:12.5, cursor:"pointer", padding:0}}>Eliminar</button>
                  </div>
                </div>

            </label>

          {c.historial.slice().reverse().map((h, i) => (
            <div key={i} style={{display:"flex", gap:12, padding:"10px 0", borderBottom:"1px solid #EEF1F7", fontSize:13.5}}>
              <div style={{width:8, height:8, borderRadius:"50%", background:BLUE, marginTop:6, flexShrink:0}} />
