const defaultReqs = () => Object.fromEntries(REQUISITOS_BASE.map((r)=>[r, false]));
/* lista de requisitos según el servicio del vehículo */
const reqOrden = (c) => {
  const publico = c && c.vehiculo && c.vehiculo.servicio === "Público";
  return publico ? [...REQUISITOS_BASE, ...REQUISITOS_PUBLICO] : REQUISITOS_BASE;
};

/* compatibilidad: cotizaciones viejas guardaban un solo tramite.tipo */
const getTipos = (c) => {
  const tp = c && c.tramite;
  if (tp && Array.isArray(tp.tipos) && tp.tipos.length) return tp.tipos;
  if (tp && tp.tipo) return [tp.tipo];
  return [];
};
const tiposTexto = (c) => getTipos(c).join(" · ") || "Trámite";
const getSoat = (c) => (c.vehiculo && c.vehiculo.soat) || { tiene:false, desde:"", hasta:"" };
const getTecno = (c) => (c.vehiculo && c.vehiculo.tecno) || { tiene:false, desde:"", hasta:"" };
const getReqs = (c) => (c.tramite && c.tramite.reqs) || {};
const docsFaltantes = (c) => reqOrden(c).filter((r)=> getReqs(c)[r] !== true);
const getObs = (c) => Array.isArray(c.observaciones) ? c.observaciones : [];
const getAdj = (c) => Array.isArray(c.adjuntos) ? c.adjuntos : [];

/* tarifas fijas */
const TARIFA_GENERAL = { "Papelería": 15000 };
const TARIFA_IBAGUE = { "Honorarios": 100000, "Derechos de tránsito": 306000 };
const BANCOS_DISPONIBLES = ["Nequi", "Davivienda", "Bancolombia"];
/* clasificación de dinero de trámites: honorarios (ganancia real) vs canje (pasa a tránsito) */
const CONCEPTOS_GANANCIA_APP = ["Honorarios", "Honorarios de impuestos", "Papelería", "Improntas"];
const CONCEPTOS_CANJE_APP = ["Derechos de tránsito", "Impuestos", "Retención", "Multas", "Mensajería"];
function clasificarConceptos(c) {
  let ganancia = 0, canje = 0;
  (c.conceptos || []).forEach((x) => {
    const v = (Number(x.cant) || 1) * (Number(x.valor) || 0);
    if (!v) return;
    if (CONCEPTOS_GANANCIA_APP.includes(x.desc)) ganancia += v;
    else if (CONCEPTOS_CANJE_APP.includes(x.desc)) canje += v;
    else ganancia += v;
  });
  return { ganancia, canje };
}
/* Calcula los movimientos automáticos de caja que faltan por crear para un trámite,
   dado su abono actual y lo que ya se ha sincronizado antes (para no duplicar).
   Prioridad: el dinero pagado cubre primero el canje (para tránsito), el sobrante va a honorarios. */
function calcularMovimientosAutoTramite(c, movimientosCaja) {
  if (esCotizacion(c)) return [];
  const { ganancia, canje } = clasificarConceptos(c);
  const abonoEfectivo = Number(c.abonoEfectivo) || 0;
  const abonoTransferencia = Number(c.abonoTransferencia) || 0;
  const banco = c.bancoTransferencia || "Nequi";
  // TODO lo ya registrado para este trámite (manual o automático) — nunca se duplica dinero real en cuentas
  const previosDelTramite = (movimientosCaja || []).filter(m => m.tramiteId === c.id && m.tipo === "ingreso");
  const yaEfectivo = previosDelTramite.filter(m => m.cuenta === "Efectivo").reduce((a,m)=>a+Number(m.monto),0);
  const yaBanco = previosDelTramite.filter(m => m.cuenta === banco).reduce((a,m)=>a+Number(m.monto),0);
  const yaTotalRegistrado = previosDelTramite.reduce((a,m)=>a+Number(m.monto),0);
  const deltaEfectivo = Math.max(0, abonoEfectivo - yaEfectivo);
  const deltaBanco = Math.max(0, abonoTransferencia - yaBanco);
  if (deltaEfectivo <= 0 && deltaBanco <= 0) return [];
  // se asume que la prioridad canje-primero ya aplicó sobre lo previamente registrado, para no descuadrar
  let canjeRestante = Math.max(0, canje - Math.min(yaTotalRegistrado, canje));
  const info = { numero: c.numero, placa: c.vehiculo.placa, cliente: c.cliente.nombre, tipo: tiposTexto(c) };
  const nuevos = [];
  // efectivo primero, luego transferencia — cada uno se reparte entre canje (prioridad) y honorarios (sobrante)
  [{ cuenta:"Efectivo", delta:deltaEfectivo }, { cuenta:banco, delta:deltaBanco }].forEach(({ cuenta, delta }) => {
    if (delta <= 0) return;
    const paraCanje = Math.min(delta, canjeRestante);
    const paraHonorarios = delta - paraCanje;
    if (paraCanje > 0) {
      nuevos.push({ id: uid(), tipo:"ingreso", cuenta, cuentaDest:null, monto: paraCanje,
        categoria: "Abono trámite (Canje)", categoriaTipo:"canje", nota: `${info.numero} · ${info.placa} · ${info.cliente}`,
        fecha: hoy(), creado: ahora(), tramiteId: c.id, autoSync:true, tramiteInfo: info });
      canjeRestante -= paraCanje;
    }
    if (paraHonorarios > 0) {
      nuevos.push({ id: uid(), tipo:"ingreso", cuenta, cuentaDest:null, monto: paraHonorarios,
        categoria: "Abono trámite (Honorarios)", categoriaTipo:"honorarios", nota: `${info.numero} · ${info.placa} · ${info.cliente}`,
        fecha: hoy(), creado: ahora(), tramiteId: c.id, autoSync:true, tramiteInfo: info });
    }
  });
  return nuevos;
}
const esIbague = (c) => String(c||"").trim().toLowerCase().startsWith("ibagu");

const conceptosIniciales = (ciudad) => {
  const t = { ...TARIFA_GENERAL, ...(esIbague(ciudad) ? TARIFA_IBAGUE : {}) };
  return CONCEPTOS_BASE.map((d) => ({ cant:1, desc:d, valor: t[d] ? String(t[d]) : "" }));
};

/* aplica tarifas al cambiar de ciudad, sin borrar lo que el asesor ya escribió a mano */
const aplicarCiudad = (conceptos, ciudad) => {
  const ib = esIbague(ciudad);
  return conceptos.map((x) => {
    if (!(x.desc in TARIFA_IBAGUE)) return x;
    const tarifa = String(TARIFA_IBAGUE[x.desc]);
    if (ib) return (!x.valor || x.valor === "0") ? { ...x, valor: tarifa } : x;
    return x.valor === tarifa ? { ...x, valor: "" } : x;
  });
};

/* si hay impuestos, agrega automáticamente los honorarios de impuestos */
const normalizarConceptos = (conceptos) => {
  const hayImpuesto = conceptos.some((x) => x.desc === "Impuestos" && Number(x.valor) > 0);
  const sinHon = conceptos.filter((x) => x.desc !== HON_IMPUESTOS);
  if (!hayImpuesto) return sinHon;
  const i = sinHon.findIndex((x) => x.desc === "Impuestos");
  const fila = { cant:1, desc: HON_IMPUESTOS, valor: String(VALOR_HON_IMPUESTOS), fijo: true };
  return [...sinHon.slice(0, i+1), fila, ...sinHon.slice(i+1)];
};

const fmt = (n) => "$" + (Number(n) || 0).toLocaleString("es-CO");
/* separador de miles mientras se escribe */
const miles = (v) => { const d = String(v ?? "").replace(/\D/g, "").replace(/^0+(?=\d)/, ""); return d ? Number(d).toLocaleString("es-CO") : ""; };
const soloNum = (v) => String(v ?? "").replace(/\D/g, "");
const hoy = () => new Date().toISOString().slice(0, 10);
/* separa una fecha YYYY-MM-DD en sus partes, sin pasar por objetos Date con zona horaria */
const partesFecha = (f) => { const p = String(f||"").split("-").map(Number); return { y:p[0], m:p[1], d:p[2] }; };
/* SOAT: vence un día antes de la misma fecha, un año después (vigencia de 1 año exacto). Cálculo en UTC puro para que no varíe según la zona horaria del dispositivo. */
const vigenciaSoat = (fecha) => {
  const { y, m, d } = partesFecha(fecha);
  if (!y || !m || !d) return "";
  const dt = new Date(Date.UTC(y + 1, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() - 1);
  return dt.toISOString().slice(0, 10);
};
/* Tecnomecánica: vence el mismo día, un año después. También en UTC puro. */
const vigenciaTecno = (fecha) => {
  const { y, m, d } = partesFecha(fecha);
  if (!y || !m || !d) return "";
  const dt = new Date(Date.UTC(y + 1, m - 1, d));
  return dt.toISOString().slice(0, 10);
};
const masUnAnio = vigenciaSoat; // alias por compatibilidad
/* días que faltan para que venza una fecha (negativo si ya venció) */
const diasParaVencer = (fecha) => {
  if (!fecha) return null;
  const d = new Date(fecha + "T00:00:00");
  if (isNaN(d)) return null;
  const hoyD = new Date(hoy() + "T00:00:00");
  return Math.round((d - hoyD) / 86400000);
};
/* evalúa el estado de vigencia de SOAT/tecno de un vehículo: retorna { alerta, mensaje } si algo está por vencer o vencido */
function alertaVigencia(vehiculo) {
  if (!vehiculo) return null;
  const items = [];
  if (vehiculo.soat && vehiculo.soat.tiene && vehiculo.soat.hasta) items.push({ nombre:"SOAT", dias: diasParaVencer(vehiculo.soat.hasta) });
  if (vehiculo.tecno && vehiculo.tecno.tiene && vehiculo.tecno.hasta) items.push({ nombre:"Tecnomecánica", dias: diasParaVencer(vehiculo.tecno.hasta) });
  const criticos = items.filter(i => i.dias !== null && i.dias <= 5);
  if (criticos.length === 0) return null;
  const vencidos = criticos.filter(i => i.dias < 0);
  const porVencer = criticos.filter(i => i.dias >= 0);
  let mensaje;
  if (vencidos.length) mensaje = vencidos.map(i=>i.nombre).join(" y ") + " ya venció";
  else mensaje = porVencer.map(i=> i.nombre + (i.dias===0 ? " vence hoy" : ` vence en ${i.dias} día${i.dias===1?"":"s"}`)).join(" · ");
  return { critico: vencidos.length>0, mensaje };
}

const totales = (c) => {
  const sub = c.conceptos.reduce((a, x) => a + (Number(x.cant)||1) * (Number(x.valor)||0), 0);
  const total = sub - (Number(c.descuento)||0);
  const abono = (Number(c.abonoEfectivo)||0) + (Number(c.abonoTransferencia)||0);
  return { sub, total, abono, saldo: total - abono };
};

function abrirCotizacion(c, notificar) {
  const html = htmlCotizacion(c);
  try {
    const w = window.open("", "_blank");
    if (w && w.document) {
      w.document.open(); w.document.write(html); w.document.close();
      return;
    }
  } catch (e) { /* bloqueado por el navegador */ }
  descargarCotizacion(c, notificar);
}

function descargarCotizacion(c, notificar) {
  try {
    const blob = new Blob([htmlCotizacion(c)], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `Cotizacion_${c.numero || "MGL"}_${c.vehiculo.placa || ""}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    if (notificar) notificar("Archivo descargado. Ábrelo y usa Imprimir → Guardar como PDF.");
  } catch (e) { if (notificar) notificar("No se pudo descargar el archivo."); }
}

/* captura la tarjeta de la cotización como imagen y la copia al portapapeles (para pegar en WhatsApp) */
async function copiarImagenCotizacion(notificar) {
  const el = document.getElementById("tarjeta-cotizacion-captura");
  if (!el) { notificar("No se encontró la vista para copiar."); return; }
  if (!window.html2canvas) { notificar("No se pudo cargar el generador de imágenes. Usa 'Descargar' como alternativa."); return; }
  try {
    notificar("Generando imagen…");
    const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
    canvas.toBlob(async (blob) => {
      if (!blob) { notificar("No se pudo generar la imagen."); return; }
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new window.ClipboardItem({ "image/png": blob })]);
          notificar("Imagen copiada. Ya puedes pegarla en WhatsApp (Ctrl/Cmd+V).");
        } else {
          throw new Error("clipboard no soportado");
        }
      } catch (e) {
        // alternativa: descargar la imagen si el portapapeles no está disponible (común en Safari/iOS o sin HTTPS)
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "cotizacion.png";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
        notificar("Tu navegador no permite copiar directo. Se descargó la imagen para que la envíes por WhatsApp.");
      }
    }, "image/png");
  } catch (e) { notificar("No se pudo generar la imagen de la cotización."); }
}

function App() {

  const pinInputRef = useRef(null);
  const [errPin, setErrPin] = useState("");
  const [sel, setSel] = useState(null);
  const [form, setForm] = useState(null);
  const [busqueda, setBusqueda] = useState("");
  const [filtroEstado, setFiltroEstado] = useState("");
  const [toast, setToast] = useState("");
  const [pPlaca, setPPlaca] = useState("");
  const [pCodigo, setPCodigo] = useState("");
  const [pResultado, setPResultado] = useState(null);
  const [pError, setPError] = useState("");
  const [nuevoEstado, setNuevoEstado] = useState("");
  const [obsEstado, setObsEstado] = useState("");
  const [nuevaObs, setNuevaObs] = useState("");
  const [obsVisible, setObsVisible] = useState(true);
  const [abonoEfe, setAbonoEfe] = useState("");
  const [abonoTra, setAbonoTra] = useState("");
  const [visibleCliente, setVisibleCliente] = useState(true);
  const [textoRestaurar, setTextoRestaurar] = useState("");
  const [hayBorrador, setHayBorrador] = useState(false);

  const [sync, setSync] = useState(sb ? "nube" : "local");

  useEffect(() => { cargar(); }, []);
  const notificar = (m) => { setToast(m); setTimeout(()=>setToast(""), 3200); };

  /* ---- Borrador automático: guarda lo que se está creando/editando ---- */
  useEffect(() => {
    if (vista === "form" && form) {
      try { localStorage.setItem("mgl-borrador", JSON.stringify(form)); setHayBorrador(true); } catch (e) {}
    }
  }, [form, vista]);

  useEffect(() => {
    try { setHayBorrador(!!localStorage.getItem("mgl-borrador")); } catch (e) {}
  }, []);

  const limpiarBorrador = () => { try { localStorage.removeItem("mgl-borrador"); } catch (e) {} setHayBorrador(false); };
  const recuperarBorrador = () => {
    try {
      const b = localStorage.getItem("mgl-borrador");
      if (b) { setForm(JSON.parse(b)); setVista("form"); notificar("Borrador recuperado"); }
    } catch (e) { notificar("No se pudo recuperar el borrador"); }
  };

  /* ---- Cierre por inactividad (15 minutos) ---- */
  useEffect(() => {
    if (vista === "login" || vista === "portal") return;
    let timer;
    const reiniciar = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        setVista("login"); setPin("");
        notificar("Sesión cerrada por inactividad. Tu borrador quedó guardado.");
      }, 15 * 60 * 1000);
    };
    const eventos = ["mousedown","keydown","touchstart","scroll"];
    eventos.forEach((e) => window.addEventListener(e, reiniciar));
    reiniciar();
    return () => { clearTimeout(timer); eventos.forEach((e) => window.removeEventListener(e, reiniciar)); };
  }, [vista]);

  async function cargar() {
    setSync(sb ? "cargando" : "local");
    if (sb) {
      const salvavidas = setTimeout(()=> setCargando(false), 7000);
      const conTimeout = (promesa, ms) => Promise.race([promesa, new Promise((res)=>setTimeout(()=>res({ data:null, error:"timeout" }), ms))]);
      let huboError = false;
      try {
        const { data, error } = await conTimeout(sb.from("app_state").select("data").eq("id", 1).single(), 6000);
        if (!error && data && data.data) setDb(data.data);
        else if (error) huboError = true;
        sb.channel("mgl-realtime")
          .on("postgres_changes", { event: "*", schema: "public", table: "app_state" },
            (payload) => { if (payload.new && payload.new.data) setDb(payload.new.data); })
          .subscribe();
      } catch (e) { huboError = true; }
      // resumen de caja en solo lectura, para el mini-panel del dashboard (no bloquea la carga principal)
      try {
        const { data: cData } = await conTimeout(sb.from("caja_state").select("data").eq("id",1).single(), 6000);
        if (cData && cData.data) setCajaData(cData.data);
        sb.channel("caja-mini")
          .on("postgres_changes", { event: "*", schema: "public", table: "caja_state" },
            (p) => { if (p.new && p.new.data) setCajaData(p.new.data); })
          .subscribe();
      } catch (e) { /* la caja aún no tiene datos */ }
      clearTimeout(salvavidas);
      setSync(huboError ? "error" : "nube");
      setCargando(false);
      return;
    }
    try {
      const r = localStorage.getItem("movigestion-luz-v1");
      if (r) setDb(JSON.parse(r));
    } catch (e) { /* primera vez */ }
    setCargando(false);
  }
  async function guardarDb(nueva) {
    setDb(nueva);
    if (sb) {
      try { await sb.from("app_state").upsert({ id: 1, data: nueva }); }
      catch (e) { notificar("No se pudo sincronizar. Revisa la conexión."); }
      return;
    }
    try { localStorage.setItem("movigestion-luz-v1", JSON.stringify(nueva)); }
    catch (e) { notificar("No se pudo guardar."); }
  }

  /* sincroniza automáticamente los movimientos de caja (honorarios/canje) cuando cambia el abono de un trámite */
  async function sincronizarCajaAuto(cotizacion) {
    if (!sb || esCotizacion(cotizacion)) return;
    try {
      const { data } = await sb.from("caja_state").select("data").eq("id", 1).single();
      const cajaActual = (data && data.data) || { cuentas:{}, movimientos:[], arqueos:[], config:{} };
      const nuevos = calcularMovimientosAutoTramite(cotizacion, cajaActual.movimientos || []);
      if (nuevos.length === 0) return;
      const nueva = { ...cajaActual, movimientos: [...nuevos, ...(cajaActual.movimientos || [])] };
      await sb.from("caja_state").upsert({ id: 1, data: nueva });
      setCajaData(nueva);
    } catch (e) { /* la caja aún no existe o no hay conexión; el botón manual queda de respaldo */ }
  }

  const upd = (path, val) => {
    setForm((f) => {
      const n = JSON.parse(JSON.stringify(f));
      const keys = path.split(".");
      let o = n; for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
      o[keys[keys.length - 1]] = val;
      return n;
    });
  };

  function guardarCotizacion() {
    const f = { ...form };
    if (!f.cliente.nombre.trim() || !f.vehiculo.placa.trim()) { notificar("Nombre del cliente y placa son obligatorios."); return; }
    f.vehiculo.placa = f.vehiculo.placa.toUpperCase().trim();
    if (!f.tramite.tipos || !f.tramite.tipos.length) f.tramite.tipos = [f.tramite.tipo || "Traspaso"];
    f.tramite.tipo = f.tramite.tipos[0];
    if (f.notaManual && f.notaManual.trim()) {
      f.observaciones = [...(f.observaciones || []), { id: Date.now(), texto: f.notaManual.trim(), fecha: ahora(), visible:false, hecho:false }];
      f.notaManual = "";
    }
    let nueva = { ...db };
    const existe = db.cotizaciones.find((c) => c.id === f.id);
    if (!existe) {
      if (esCotizacion(f)) {
        nueva.counterCot = (db.counterCot || 0) + 1;
        f.numero = "COT-" + String(nueva.counterCot).padStart(4, "0");
      } else {
        nueva.counter = (db.counter || 0) + 1;
        f.numero = "MGL-" + String(nueva.counter).padStart(4, "0");
      }
      f.historial = [{ de: null, a: f.estado, fecha: ahora(), usuario: f.asesor || "Admin", obs: esCotizacion(f) ? "Cotización creada" : "Trámite creado", visible: true }];
      nueva.cotizaciones = [f, ...db.cotizaciones];
    } else {
      nueva.cotizaciones = db.cotizaciones.map((c) => (c.id === f.id ? f : c));
    }
    guardarDb(nueva);
    sincronizarCajaAuto(f);
    limpiarBorrador();
    setSel(f);
    setVista(existe ? "detalle" : "enviarWA");
    notificar(existe ? "Cambios guardados" : (esCotizacion(f) ? "Cotización " : "Trámite ") + f.numero + " creado");
  }

  /* convertir una cotización en trámite: le asigna número MGL nuevo */
  function convertirATramite(c) {
    if (!window.confirm("¿Convertir esta cotización en trámite? Se le asignará un número de trámite nuevo y podrás completar toda la información.")) return;
    const nueva = { ...db };
    nueva.counter = (db.counter || 0) + 1;
    const numeroMGL = "MGL-" + String(nueva.counter).padStart(4, "0");
    const nv = { ...c, modo: "tramite", numeroCotizacion: c.numero, numero: numeroMGL, estado: PASOS[0],
      historial: [...(c.historial||[]), { de: null, a: PASOS[0], fecha: ahora(), usuario: c.asesor || "Admin", obs: "Convertido a trámite desde " + c.numero, visible: false }] };
    nueva.cotizaciones = db.cotizaciones.map((x) => x.id === c.id ? nv : x);
    guardarDb(nueva);
    setForm(JSON.parse(JSON.stringify(nv))); setVista("form");
    notificar("Convertida a trámite " + numeroMGL + ". Completa la información.");
  }

  function cambiarEstado() {
    if (!nuevoEstado || nuevoEstado === sel.estado) return;
    const nv = { ...sel, estado: nuevoEstado,
      historial: [...sel.historial, { de: sel.estado, a: nuevoEstado, fecha: ahora(), usuario: sel.asesor || "Admin", obs: obsEstado, visible: visibleCliente }] };
    guardarDb({ ...db, cotizaciones: db.cotizaciones.map((c) => c.id === sel.id ? nv : c) });
    setSel(nv); setNuevoEstado(""); setObsEstado("");
    notificar("Estado actualizado: " + nuevoEstado);
  }

  /* marcar/desmarcar un documento como recibido desde el detalle */
  function toggleDoc(r) {
    const reqs = { ...getReqs(sel), [r]: !getReqs(sel)[r] };
    const nv = { ...sel, tramite: { ...sel.tramite, reqs } };
    guardarDb({ ...db, cotizaciones: db.cotizaciones.map((c) => c.id === sel.id ? nv : c) });
    setSel(nv);
  }

  /* SOAT / Tecnomecánica desde el detalle */
  function toggleVigencia(campo) {
    const actual = (sel.vehiculo && sel.vehiculo[campo]) || { tiene:false, desde:"", hasta:"" };
    const nv = { ...sel, vehiculo: { ...sel.vehiculo, [campo]: { ...actual, tiene: !actual.tiene } } };
    guardarDb({ ...db, cotizaciones: db.cotizaciones.map((c) => c.id === sel.id ? nv : c) });
    setSel(nv);
  }
  function setVigenciaFecha(campo, key, valor) {
    const actual = (sel.vehiculo && sel.vehiculo[campo]) || { tiene:false, desde:"", hasta:"" };
    let cambios = { [key]: valor };
    if (key === "desde" && valor) cambios.hasta = campo === "soat" ? vigenciaSoat(valor) : vigenciaTecno(valor);
    const nv = { ...sel, vehiculo: { ...sel.vehiculo, [campo]: { ...actual, ...cambios } } };
    guardarDb({ ...db, cotizaciones: db.cotizaciones.map((c) => c.id === sel.id ? nv : c) });
    setSel(nv);
  }

  /* registrar abono rápido (suma al abono existente) */
  function registrarAbono(tipo, monto) {
    const n = Number(String(monto).replace(/\D/g, ""));
    if (!n) { notificar("Escribe un monto válido"); return; }
    const campo = tipo === "efectivo" ? "abonoEfectivo" : "abonoTransferencia";
    const actual = Number(sel[campo]) || 0;
    const nv = { ...sel, [campo]: actual + n };
    guardarDb({ ...db, cotizaciones: db.cotizaciones.map((c) => c.id === sel.id ? nv : c) });
    sincronizarCajaAuto(nv);
    setSel(nv);
    notificar("Abono registrado: " + fmt(n) + " en " + (tipo==="efectivo"?"efectivo":"transferencia"));
  }
  function ajustarAbono(campo, valor) {
    const n = campo === "bancoTransferencia" ? valor : (Number(String(valor).replace(/\D/g, "")) || 0);
    const nv = { ...sel, [campo]: n };

    setSel(nv);

  function agregarObs(texto, visible) {
    if (!texto.trim()) return;
    const obs = [...getObs(sel), { id: Date.now(), texto: texto.trim(), fecha: ahora(), visible, hecho: false }];

  function toggleObs(id) {
    const obs = getObs(sel).map((o)=> o.id===id ? { ...o, hecho: !o.hecho } : o);

    guardarDb({ ...db, cotizaciones: db.cotizaciones.map((c) => c.id === sel.id ? nv : c) });

  }
  function eliminarObs(id) {
    const obs = getObs(sel).filter((o)=> o.id!==id);

    guardarDb({ ...db, cotizaciones: db.cotizaciones.map((c) => c.id === sel.id ? nv : c) });
    setSel(nv);
  }

  /* ---- Adjuntos (PDF, PNG, JPG) ---- */
  function comprimirImagen(file) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 1400;
        let { width, height } = img;
        if (width > max || height > max) {
          const r = Math.min(max/width, max/height);
          width = Math.round(width*r); height = Math.round(height*r);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }
  function leerArchivo(file) {
    return new Promise((resolve) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => resolve(null);
      r.readAsDataURL(file);
    });
  }
  async function subirAdjuntos(fileList) {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const nuevos = [];
    for (const f of files) {
      const esImg = f.type.startsWith("image/");
      const esPdf = f.type === "application/pdf";
      if (!esImg && !esPdf) { notificar("Solo se permiten PDF, PNG o JPG."); continue; }
      if (esPdf && f.size > 3 * 1024 * 1024) { notificar('"'+f.name+'" pesa más de 3 MB. Usa un PDF más liviano.'); continue; }
      const data = esImg ? await comprimirImagen(f) : await leerArchivo(f);
      if (!data) { notificar("No se pudo leer "+f.name); continue; }
      nuevos.push({ id: Date.now()+Math.random().toString(36).slice(2,6), nombre: f.name, tipo: esPdf ? "pdf" : "img", data });
    }
    if (!nuevos.length) return;
    const nv = { ...sel, adjuntos: [...getAdj(sel), ...nuevos] };
    guardarDb({ ...db, cotizaciones: db.cotizaciones.map((c) => c.id === sel.id ? nv : c) });
    setSel(nv);
    notificar(nuevos.length === 1 ? "Archivo adjuntado" : nuevos.length+" archivos adjuntados");
  }
  function abrirAdjunto(a) {
    try {
      const win = window.open();
      if (a.tipo === "img") win.document.write('<img src="'+a.data+'" style="max-width:100%">');
      else win.location.href = a.data;
    } catch (e) { notificar("No se pudo abrir el archivo"); }
  }
  function eliminarAdjunto(id) {
    if (!window.confirm("¿Eliminar este archivo?")) return;
    const nv = { ...sel, adjuntos: getAdj(sel).filter((a)=>a.id!==id) };
    guardarDb({ ...db, cotizaciones: db.cotizaciones.map((c) => c.id === sel.id ? nv : c) });
    setSel(nv);
  }

  function eliminar(id) {
    if (!window.confirm("¿Eliminar esta cotización? Esta acción no se puede deshacer.")) return;
    guardarDb({ ...db, cotizaciones: db.cotizaciones.filter((c) => c.id !== id) });
    setVista("lista"); notificar("Cotización eliminada");
  }

    d.estado = PASOS[0]; d.historial = []; d.conceptos = normalizarConceptos(d.conceptos);

    setForm(d); setVista("form");
  }

  function descargarRespaldo() {
    try {
      const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `respaldo-movigestion-${hoy()}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      notificar("Respaldo descargado");
    } catch (e) { notificar("No se pudo generar el respaldo"); }
  }

  function restaurarRespaldo() {
    try {
      const d = JSON.parse(textoRestaurar);
      if (!d.cotizaciones) { notificar("El texto no tiene el formato de respaldo"); return; }
      if (!window.confirm("Esto reemplazará las cotizaciones actuales. ¿Continuar?")) return;
      guardarDb(d); setTextoRestaurar(""); notificar("Datos restaurados: " + d.cotizaciones.length + " cotizaciones");
    } catch (e) { notificar("No se pudo leer el respaldo. Revisa el texto pegado."); }
  }

  function consultarPortal() {
    setPError(""); setPResultado(null);
    const limpiar = (v) => String(v || "").toUpperCase().replace(/[\s\-.]/g, "");
    const placaB = limpiar(pPlaca), codigoB = limpiar(pCodigo);
    if (!placaB || !codigoB) { setPError("Escribe la placa y el código de seguimiento."); return; }
    const c = db.cotizaciones.find((x) =>
      limpiar(x.vehiculo.placa) === placaB && limpiar(x.codigo) === codigoB);
    if (!c) {
      const soloPlaca = db.cotizaciones.find((x) => limpiar(x.vehiculo.placa) === placaB);
      if (soloPlaca) setPError("La placa está bien, pero el código no coincide. Revisa el código de seguimiento (aparece en tu cotización) o escríbenos por WhatsApp.");
      else setPError("No encontramos un trámite con esa placa. Verifica los datos o escríbenos por WhatsApp.");
      return;
    }
    setPResultado(c);
  }

  const filtradas = useMemo(() => {
    const q = busqueda.toLowerCase().trim();
    const finalizado = (c) => c.estado === ESTADO_FINAL && !esCotizacion(c);
    return db.cotizaciones.filter((c) => {
      const matchQ = !q || [c.numero, c.codigo, c.cliente.nombre, c.cliente.doc, c.cliente.tel, c.vehiculo.placa, c.fecha]
        .some((v) => (v || "").toLowerCase().includes(q));
      const matchE = !filtroEstado || c.estado === filtroEstado;
      let enSeccion;
      if (vista === "cotizaciones") enSeccion = esCotizacion(c);
      else if (vista === "archivados") enSeccion = finalizado(c);
      else enSeccion = !esCotizacion(c) && (!finalizado(c) || filtroEstado === ESTADO_FINAL); // trámites activos
      return matchQ && matchE && enSeccion;
    });
  }, [db, busqueda, filtroEstado, vista]);

  const stats = useMemo(() => {
    const cs = db.cotizaciones.filter((c)=>!esCotizacion(c));

      total: cs.length,

    return (

          <button style={{background:"rgba(255,255,255,.1)", border:"1px solid rgba(255,255,255,.2)", color:"#C7D6F0", padding:"8px 14px", borderRadius:20, fontSize:13, fontWeight:600, cursor:"pointer"}} onClick={()=>setVista("login")}>Volver</button>
